<path d="M 486 106.5 L 494 112 L 486 117.5 Z" fill="#5b7385"/>
<path d="M 684 112 L 721 112" stroke="#5b7385" stroke-width="2.2" fill="none"/>
<path d="M 721 106.5 L 729 112 L 721 117.5 Z" fill="#5b7385"/>
<path d="M 919 112 L 941 112" stroke="#5b7385" stroke-width="2.2" fill="none"/>
<path d="M 941 106.5 L 949 112 L 941 117.5 Z" fill="#5b7385"/>
<rect x="265" y="214" width="415" height="56" rx="10" fill="#f1f6f9" stroke="#8aa4b5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="472" y="238" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#22323d" text-anchor="middle">pdf_config.yaml &#183; assets.yaml</text>
<text x="472" y="258" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b7385" text-anchor="middle">sizes, bleed, colours, artwork &#8212; no code changes</text>
