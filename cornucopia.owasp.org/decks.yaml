structuredData:
  website:
    "@type": "WebSite"
    "@id": "https://cornucopia.owasp.org"
    url: "https://cornucopia.owasp.org"
    name: "OWASP Cornucopia"
    publisher:
      "@id": "https://owasp.org"

  product:
    "@type":
      - "Product"
      - "Game"
    "@id": "https://cornucopia.owasp.org#product"
    name: "OWASP Cornucopia Card Game"
    description: "An open-source card game to assist software development teams identify security requirements and map threat modeling."
    brand:
      "@id": "https://owasp.org"
    license: "https://github.com/OWASP/cornucopia/blob/master/LICENSE.md"
    offers:
      "@type": "Offer"
      price: "0.00"
      priceCurrency: "USD"
      availability: "https://schema.org/InStock"

  organization:
    "@type": "Organization"
    "@id": "https://owasp.org"
    name: "OWASP Foundation"
    url: "https://owasp.org"
    logo: "https://cornucopia.owasp.org/images/owasp-logo.png"
cloudflare:
  headers:
    reset:
      - '! Access-Control-Allow-Origin'
      - '! Content-Type'
    stage:
      '/*':
        Access-Control-Allow-Origin: 'https://owaspcornucopia.org'
        X-Robots-Tag: 'noindex'
        Content-Type: 'text/html; charset=utf-8'
    production:
      '/*':
        Access-Control-Allow-Origin: 'https://cornucopia.owasp.org'
        Content-Type: 'text/html; charset=utf-8'
      '/404':
        Access-Control-Allow-Origin: 'https://cornucopia.owasp.org'
        Content-Type: 'text/html; charset=utf-8'
        X-Robots-Tag: noindex
      '/api/*':
        Access-Control-Allow-Origin: '*'
        Content-Type: 'application/json'
      '/api/docs':
        Access-Control-Allow-Origin: 'https://cornucopia.owasp.org'
        Content-Type: 'text/html; charset=utf-8'
    all:
      '/*':
        Cross-Origin-Opener-Policy: same-origin
        X-Frame-Options: SAMEORIGIN
        X-XSS-Protection: '1; mode=block'
        X-Content-Type-Options: nosniff
        Referrer-Policy: same-origin
        Permissions-Policy: 'accelerometer=(), autoplay=(), camera=(), document-domain=(), encrypted-media=(), fullscreen=(self "https://www.youtube.com/"), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self "https://www.youtube.com/"), publickey-credentials-get=(), sync-xhr=(), usb=(), xr-spatial-tracking=(), geolocation=()'
        Strict-Transport-Security: 'max-age=31536000; includeSubDomains; preload'
        Content-Security-Policy: "base-uri 'self'; default-src 'none'; frame-src 'self' https://www.youtube.com youtube.com; connect-src 'self'; img-src 'self' i.ytimg.com; script-src 'self' 'nonce-DhcnhD3khTMePgXw'; style-src 'self'; style-src-elem 'self'; upgrade-insecure-requests"
