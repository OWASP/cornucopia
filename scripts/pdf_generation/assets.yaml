---
# ==========================================================================
# OWASP Cornucopia — per-suit artwork and colour
#
# Everything a suit needs in order to look right: the colour of its card
# numbers, and the artwork behind its cards.
#
# Per suit:
#   color              card-number colour on pip cards, as CMYK percentages.
#                      Injected into the Scribus document at build time, so a
#                      template does not need to define it beforehand.
#   court_color        card-number colour on court cards (J, Q, K). Optional;
#                      white is used when it is not given.
#   backgrounds        artwork behind the ordinary cards, per card size.
#   court_backgrounds  artwork behind J, Q and K. Omit for a suit with no
#                      court cards, such as the jokers.
#   cards              artwork for one specific card, overriding the above.
#
# Filenames are relative to resources/card_artwork/ and can be anything; the
# names below simply follow the pattern the artwork was delivered in. To use a
# different picture for a card, point at it here -- see "Customising decks and
# cards" in README.md.
#
# If a suit is left out of this file entirely, the generator falls back to
# looking for <edition>/<suit>-<small|big>-<default|court>.png, so a new
# edition can be built before any of this is filled in.
#
# NOTE: these CMYK values duplicate the suit colours already defined for the
# website at copi.owasp.org/assets/css/cards.scss. Longer term they would be
# better sourced from that existing file so print and web cannot drift apart;
# they live here for now to avoid coupling this tool to the website build.
# ==========================================================================

meta:
  component: backgroundimages
  image_path: "card_artwork"

# ==========================================================================
# WEB APP EDITION — 7 suits including jokers, 80 cards
# ==========================================================================
webapp:
  suits:
    - id: VE
      color: {c: 0, m: 0, y: 0, k: 50}
      backgrounds: {small: "webapp/ve-small-default.png", big: "webapp/ve-big-default.png"}
      court_backgrounds: {small: "webapp/ve-small-court.png", big: "webapp/ve-big-court.png"}
