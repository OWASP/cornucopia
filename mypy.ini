[mypy]

# The PDF generation tool is excluded from strict checking for now. It runs in
# two very different interpreters -- Scribus' embedded Python and the system
# one -- and imports `scribus`, which has no type stubs, so strict mode cannot
# see most of what it does. Annotating it is worthwhile, but is a piece of work
# in its own right rather than something to rush alongside the feature.
[mypy-scripts.pdf_generation.*]
ignore_errors = True
