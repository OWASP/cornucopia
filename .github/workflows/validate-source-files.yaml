name: Validate Source Files

on:
  pull_request:
    branches:
      - master
    paths:
      - 'source/**'
      - 'scripts/validate_source_files.py'
      - 'tests/scripts/validate_source_files_utest.py'
      - '.github/workflows/validate-source-files.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-files:
    name: Validate Source Files
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github-cloud.githubusercontent.com:443
            github.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            ppa.launchpadcontent.net:443
            pypi.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pipenv'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --require-hashes
          pipenv install --ignore-pipfile --dev

      - name: Run validator unit tests
        run: pipenv run python -m unittest tests/scripts/validate_source_files_utest.py

      - name: Validate all top-level source YAML files
        run: pipenv run python scripts/validate_source_files.py --source-dir source

