name: Comment pull request build output

on:
  workflow_run:
    workflows:
      - Run Tests and generate output files
    types:
      - completed

permissions:
  actions: read
  issues: write

jobs:
  commentpr:
    name: Comment on PR with build artifacts
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download translation check report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: translation-check-report
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const reportPath = 'translation_check_report.md';
            let translationReport = 'Translation check report not found.';

            if (fs.existsSync(reportPath)) {
              translationReport = fs.readFileSync(reportPath, 'utf8').slice(0, 20000);
            }

            const pullRequests = context.payload.workflow_run.pull_requests;
            const prNumber = pullRequests?.[0]?.number;
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('The completed workflow is not associated with a pull request.');
              return;
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;
            const prNotes = `[badge]: https://img.shields.io/badge/Build-Success!-3fb950?logo=github&style=for-the-badge

            ## Build artifacts

            Build run: ${runUrl}

            ---

            ${translationReport}`;

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: prNotes
            });
