paragraphs:
-
  id: Common
  name: "عمومی"
  sentences:
  -
    id: Title
    text: "نسخه همراه v1.0 (FA)"
  -
    id: T00010
    text: "بسته توسعه Cornucopia"
  -
    id: T00020
    text: "نویسندگان"
  -
    id: T00100
    text: "سپاسگزاری‌ها"
  -
    id: T00110
    text: "Cornucopia توسط تیمی جهانی از داوطلبان توسعه داده می‌شود، نگهداری و به‌روزرسانی می‌شود و ترویج می‌یابد. بدون آن‌ها، Cornucopia ممکن نبود. افزون بر این، می‌خواهیم از افراد و پروژه‌های زیر برای مشارکت‌ها و الهام‌بخشی‌شان سپاسگزاری کنیم:"
  -
    id: T00120
    text: "از Adam Shostack و تیم Microsoft SDL برای «بازی مدل‌سازی تهدید Elevation of Privilege»، که تحت مجوز Creative Commons Attribution منتشر شده و الهام‌بخش Cornucopia بوده و بسیاری از ایده‌ها، به‌ویژه نظریه بازی آن، از آن برگرفته شده است."
  -
    id: T00130
    text: "از همه رهبران پروژه و مشارکت‌کنندگان پروژه‌های OWASP که ورودی و راهنمایی ارزشمندی برای OWASP Top 10، OWASP AISVS و پروژه OWASP GenAI Security فراهم کرده‌اند. همچنین می‌خواهیم از افراد و مشارکت‌کنندگان فهرست‌بندی و طبقه‌بندی الگوهای حمله رایج Mitre (CAPEC™) و Mitre Atlas™ و از Cloud Security Alliance برای استفاده از Cloud Controls Matrix سپاسگزاری کنیم که همگی در ارجاع‌های متقابل ارائه‌شده به‌کار رفته‌اند."
  -
    id: T00140
    text: "از همه مشارکت‌کنندگان، حامیان، اسپانسرها و داوطلبان پیشین که در سال‌های گذشته در پروژه OWASP Cornucopia مشارکت و از آن پشتیبانی کرده‌اند."
  -
    id: T00150
    text: "OWASP® Cornucopia استفاده رایگان دارد. این اثر تحت مجوز Creative Commons Attribution-ShareAlike 4.0 منتشر شده است؛ بنابراین می‌توانید آن را کپی، توزیع و منتقل کنید، آن را اقتباس کنید و به‌صورت تجاری از آن استفاده کنید، اما همه این‌ها مشروط به ذکر نام پدیدآورندگان است و اگر این اثر را تغییر دهید، تبدیل کنید یا بر پایه آن اثری بسازید، تنها می‌توانید اثر حاصل را تحت همان مجوز یا مجوزی مشابه آن توزیع کنید."
  -
    id: T00160
    text: "© 2012-2026 OWASP Foundation. All rights reserved."
  -
    id: T00200
    text: "مقدمه"
  -
    id: T00210
    text: "دسته کارت همراه (Companion) شامل چند دسته اختیاری است که هر کدام یک موضوع امنیت برنامه را پوشش می‌دهند و برای استفاده همراه با نسخه‌های برنامه وب و برنامه موبایل OWASP Cornucopia در نظر گرفته شده‌اند. یک دسته از دسته کارت همراه می‌تواند جایگزین یکی از دسته‌های نسخه برنامه وب شود (یا علاوه بر آن‌ها استفاده شود) تا بازیکنان بتوانند تمرکزی ویژه برای مدل‌سازی تهدید خود اضافه کنند. همچنین می‌توان از آن‌ها به‌جای دسته Cornucopia به‌عنوان دسته برتر (trump) استفاده کرد."
  -
    id: T00220
    text: "برای مثال، فرض کنید در حال ساخت یک برنامه LLM هستید و می‌خواهید مدل‌سازی تهدید را با تمرکز بر LLMها و وب انجام دهید. در این صورت می‌توانید از نسخه برنامه وب OWASP Cornucopia و دسته همراه LLM به‌عنوان حوزه تمرکز برگزیده OWASP Cornucopia خود استفاده کنید."
  -
    id: T00230
    text: "هر حمله روی کارت‌های دسته‌های مختلف دسته کارت همراه Cornucopia، الزامات امنیت برنامه (AppSec) را از پروژه‌های مختلف OWASP و فراتر از آن‌ها نشان می‌دهد و بیست‌وپنجمین سالگرد بنیاد OWASP را گرامی می‌دارد و جشن می‌گیرد. با امنیت برنامه خود قمار نکنید، با آن ورق بازی کنید!"
  -
    id: T00300
    text: "دسته کارت‌ها (بسته)"
  -
    id: T00310
    text: "هوش مصنوعی عامل‌محور (AAI):"
  -
    id: T00315
    text: "شامل تهدیدهای پوشش‌داده‌شده توسط OWASP Agentic Top 10 و Mitre Atlas™ است. این دسته برای زمانی در نظر گرفته شده که برنامه‌هایی توسعه می‌دهید که از قابلیت‌های عامل‌محور استفاده می‌کنند."
  -
    id: T00320
    text: "OWASP Top 10 for Agentic Applications 2026 چارچوبی است که در سطح جهانی توسط همتایان بازبینی شده و حیاتی‌ترین ریسک‌های امنیتی پیش روی سامانه‌های هوش مصنوعی خودمختار و عامل‌محور را شناسایی می‌کند. این فهرست با همکاری گسترده بیش از 100 متخصص صنعت، پژوهشگر و کارشناس تدوین شده و راهنمایی عملی و قابل‌اجرا ارائه می‌دهد تا سازمان‌ها بتوانند از عامل‌های هوش مصنوعی که در گردش‌کارهای پیچیده برنامه‌ریزی، اقدام و تصمیم‌گیری می‌کنند ایمن‌سازی کنند."
  -
    id: T00330
    text: "تهدیدهای خودکار (BOT):"
  -
    id: T00335
    text: "شامل تهدیدهای پوشش‌داده‌شده توسط OWASP Automated Threats to Web Applications است."
  -
    id: T00340
    text: "برنامه‌های وب روز و شب در معرض استفاده خودکار ناخواسته قرار دارند. اغلب این رویدادها به سوءاستفاده از قابلیت‌های معتبر ذاتی مربوط‌اند، نه تلاش برای بهره‌برداری از آسیب‌پذیری‌های رفع‌نشده. همچنین، سوءاستفاده بیش از حد معمولاً به‌اشتباه به‌عنوان حمله انکار سرویس (DoS) گزارش می‌شود، در حالی که DoS یک اثر جانبی است و نه هدف اصلی. این پروژه این اهداف را فهرست می‌کند."
  -
    id: T00350
    text: "ابر (CLD):"
  -
    id: T00355
    text: "شامل تهدیدهایی از MITRE ATT&CK® است، به‌ویژه آن‌هایی که بر برنامه‌های ابری اثر می‌گذارند. هنگامی که برنامه در حال توسعه مبتنی بر ابر است، می‌توان از این دسته برای پوشش جنبه‌های ابری برنامه استفاده کرد. برای مدل‌سازی تهدید دقیق‌تر برنامه‌های ابری می‌توانید از OWASP Cumulus استفاده کنید که می‌توانید آن را به‌صورت آنلاین در copi.owasp.org بازی کنید."
  -
    id: T00360
    text: "دواپس (DVO):"
  -
    id: T00365
    text: "تهدیدهای مربوط به تیم‌هایی را پوشش می‌دهد که هم مسئول توسعه و استقرار و تا حدی عملیات برنامه‌های خود هستند. این دسته CAPECهای™ مرتبط با ریسک‌های زنجیره تأمین، تدارک و استقرار را شامل می‌شود."
  -
    id: T00370
    text: "فرانت‌اند (FRE):"
  -
    id: T00375
    text: "شامل تهدیدهایی از OWASP Top 10 Client-Side Security Risks و OWASP Top 10 است. این دسته برای برنامه‌های Angular، Electron و React در نظر گرفته شده که ممکن است کاملاً فرانت‌اند باشند یا با یک لایه بک‌اند نازک ساخته شده باشند."
  -
    id: T00380
    text: "مدل‌های زبانی بزرگ (LLM):"
  -
    id: T00385
    text: "بر پایه OWASP Top 10 for Large Language Model Applications است. از این دسته می‌توان برای یکپارچه‌سازی با LLMها استفاده کرد. همچنین تهدیدهای پایه مرتبط با آموزش و تنظیم را پوشش می‌دهد. برای مدل‌سازی تهدید عمیق‌تر LLM از نظر جنبه‌های یادگیری ماشین، لطفاً یک نشست جداگانه برگزار کنید و از Elevation of MLSec استفاده کنید که می‌توانید آن را به‌صورت آنلاین در copi.owasp.org بازی کنید."
  -
    id: T00400
    text: "نحوه استفاده از کارت‌ها"
  -
    id: T00410
    text: "دسته‌هایی را که می‌خواهید استفاده کنید بر اساس دامنه توسعه انتخاب کنید. اگر مطمئن نیستید، بخش قبلی را برای اطلاعات درباره هر دسته بخوانید. ایده خوبی است که دامنه توسعه را از پیش، قبل از نشست مدل‌سازی تهدید، مشخص کنید تا تیم توسعه بداند کدام مؤلفه‌ها باید در نمودار جریان داده‌ای که پیش از نشست آماده می‌کند گنجانده شوند. به این ترتیب می‌توانیم بدانیم:"
  -
    id: T00415
    text: "روی چه چیزی کار می‌کنیم؟"
  -
    id: T00420
    text: "با خیال راحت هر دسته‌ای را از دسته اصلی خود، چه نسخه برنامه وب و چه برنامه موبایل، کنار بگذارید و به‌جای آن از دسته‌های دسته کارت همراه استفاده کنید. همچنین می‌توانید دسته‌های همراه را علاوه بر همه دسته‌ها استفاده کنید یا یک دسته همراه مشخص را به همان روشی که با دسته Cornucopia انجام می‌شود به‌عنوان دسته برتر بازی کنید. مطمئن شوید از ابتدا روشن کرده‌اید کدام دسته، در صورت وجود، دسته برتر است."
  -
    id: T00430
    text: "مطمئن شوید تیم پیش از بازی قوانین Cornucopia را می‌داند. اگر مطمئن نیستید، دستورالعمل‌های عمومی نحوه بازی با کارت‌ها را در وب‌سایت OWASP Cornucopia بخوانید:"
  -
    id: T00500
    text: "نگاشت‌ها"
  -
    id: T00510
    text: "هر کارت شامل یک کد QR است. کد QR شما را به این مکان می‌برد:"
  -
    id: T00520
    text: "در آنجا یک مثال مشخص از تهدید مرتبط با کارت را پیدا خواهید کرد. افزون بر این، درباره موارد زیر نیز اطلاعات پیدا می‌کنید"
  -
    id: T00530
    text: "کدام دسته STRIDE کاربردپذیر است و چرا؟"
  -
    id: T00540
    text: "پاسخ به:"
  -
    id: T00545
    text: "چه چیزی ممکن است اشتباه پیش برود؟"
  -
    id: T00550
    text: "پاسخ به:"
  -
    id: T00555
    text: "برای آن چه کار خواهیم کرد؟"
  -
    id: T00560
    text: "نیازمندی‌های مرتبط با پرسش‌های بالا."
  -
    id: T00570
    text: "نیازمندی‌ها در نگاشت گنجانده شده‌اند. نگاشت معمولاً شامل تهدیدها و نیازمندی‌هاست. تهدیدها می‌توانند به درک کارت کمک کنند، در حالی که نیازمندی‌ها به شما کمک می‌کنند راستی‌آزمایی کنید که تهدیدها به‌درستی کاهش یافته‌اند. هر دو برای تمرین مدل‌سازی تهدید و تحلیل نیازمندی مهم هستند. افزون بر این، آنچه را در نشست‌های مدل‌سازی تهدید پیشین انجام داده‌اید بازبینی کنید و تهدیدهایی را که شناسایی کرده‌اید دوباره مرور کنید. می‌توانید این کار را با نگاهی دوباره به نگاشت انجام دهید. آیا تهدیدی هست که ممکن است از دست داده باشید و در نگاشت نمایش داده شده باشد؟ آیا به یاد داشتید همه نیازمندی‌های مرتبط با تهدیدها را پیاده‌سازی و راستی‌آزمایی کنید؟ پرسیدن این پرسش‌ها به پاسخ دادن به پرسش پایانی کمک می‌کند:"
  -
    id: T00575
    text: "آیا کار را خوب انجام دادیم؟"
  -
    id: "T01000"
    text: "بازخورد بدهید"
  -
    id: "T01010"
    text: "اگر ایده یا بازخوردی درباره استفاده از OWASP® Cornucopia دارید، لطفاً آن را به اشتراک بگذارید."
  -
    id: "T01020"
    text: "حتی بهتر است اگر نسخه‌های جایگزین کارت‌ها را بسازید یا نسخه‌های حرفه‌ای آماده چاپ تولید کنید، آن را با داوطلبانی که این نسخه را ساخته‌اند و با جامعه گسترده‌تر توسعه و امنیت برنامه به اشتراک بگذارید."
  -
    id: "T01030"
    text: "بهترین مکان برای گفت‌وگو یا مشارکت، فهرست/گروه پروژه OWASP است:"
  -
    id: "T01040"
    text: "فهرست/گروه:"
  -
    id: "T01050"
    text: "صفحه اصلی پروژه:"
  -
    id: "T01060"
    text: "همچنین می‌توانید از طریق مخزن GitHub ما با طرح یک پرسش یا یک issue در آنجا با ما در تماس باشید:"
