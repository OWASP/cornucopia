    misc: "آیا به عضویت فردی در OWASP فکر کرده‌اید؟ همه ابزارها، راهنماها و گردهمایی‌های محلی برای همه رایگان است، اما عضویت فردی به حمایت از کار OWASP کمک می‌کند"
  -
