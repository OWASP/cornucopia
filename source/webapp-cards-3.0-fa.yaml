    desc: "Jan می‌تواند بارهای داده (payload) خاصی بسازد تا اعتبارسنجی ورودی را ناکام کند، زیرا مجموعه نویسه‌ها مشخص یا اعمال نشده است، یا داده چندین بار کدگذاری شده است، یا داده پیش از اعتبارسنجی کاملاً به قالبی که برنامه استفاده می‌کند تبدیل نمی‌شود (مثلاً هم‌سان‌سازی یا canonicalization)، یا متغیرها به‌صورت قوی نوع‌دهی نشده‌اند"
