  -
    id: "T00120"
    text: "Keith Turpin و مشارکت‌کنندگان در «راهنمای مرجع سریع شیوه‌های کدنویسی امن» (Secure Coding Practices - Quick Reference Guide) OWASP® که در ابتدا توسط Boeing به OWASP اهدا شد و به‌عنوان منبع اصلی اطلاعات الزامات امنیتی برای تدوین محتوای کارت‌ها استفاده شده است."
  -
    id: "T00130"
    text: "مشارکت‌کنندگان، حامیان، اسپانسرها و داوطلبان پروژه‌های OWASP® ASVS، AppSensor، Developer Guide و Web Framework Security Matrix، فهرست الگوهای حمله رایج و طبقه‌بندی آن‌ها (CAPEC™) از Mitre، و «داستان‌های امنیتی و وظایف امنیتی عملی برای محیط‌های توسعه چابک» (Practical Security Stories and Security Tasks for Agile Development Environments) از SAFECode که همگی در ارجاعات متقابل ارائه‌شده استفاده شده‌اند."
  -
    id: "T00140"
    text: "Playgen برای برگزاری یک سمینار آموزنده بعدازظهر درباره بازی‌وارسازی (gamification) وظایف، و tartanmaker.com برای ابزار آنلاینی که به ایجاد الگوی پشت کارت‌ها کمک کرد."
  -
    id: "T00145"
    text: "مشارکت‌کنندگان و رهبران فعلی و پیشین پروژه OWASP® Cornucopia، به‌ویژه کسانی که اخیراً در به‌روزرسانی ارجاعات متقابل، ایجاد نسخه‌های آنلاین و نوشتن اسکریپت‌هایی برای تولید پویای فایل‌های خروجی Cornucopia نقش داشته‌اند."
  -
    id: "T00150"
    text: "Blackfoot (UK) Limited برای ایجاد و اهدای فایل‌های طراحی آماده چاپ، Tom Brennan و بنیاد OWASP® برای ابتکار ایجاد جعبه و بروشور با نام تجاری OWASP، و Secure Delivery Ltd برای توسعه و اهدای Copi، پلتفرم بازی آنلاین Cornucopia و EoP."
  -
    id: "T00161"
    text: "(ادامه در صفحه 20)"
  -
    id: "T00162"
    text: "(ادامه از صفحه 10)"
  -
    id: "T00170"
    text: "Colin Watson به‌عنوان نویسنده و هم‌رهبر پروژه در کنار Grant Ongers، به همراه سایر داوطلبان OWASP که از راه‌های بسیار کمک کرده‌اند."
  -
    id: "T00180"
    text: "OWASP® هیچ محصول یا خدمات تجاری را تأیید یا توصیه نمی‌کند © 2012-2025 OWASP® Foundation این سند تحت مجوز Creative Commons Attribution-ShareAlike 3.0 منتشر شده است"
  -
    id: "T00200"
    text: "مقدمه"
  -
    id: "T00210"
    text: "ایده Cornucopia کمک به تیم‌های توسعه، به‌ویژه تیم‌هایی که از روش‌شناسی‌های چابک استفاده می‌کنند، برای شناسایی الزامات امنیتی برنامه و تدوین داستان‌های کاربری مبتنی بر امنیت است."
  -
    id: "T00220"
    text: "هرچند این ایده مدتی در انتظار زمان کافی برای پیشرفت بود، انگیزه نهایی زمانی پدید آمد که SAFECode سند «داستان‌های امنیتی و وظایف امنیتی عملی برای محیط‌های توسعه چابک» را در ژوئیه 2012 منتشر کرد."
  -
    id: "T00230"
    text: "تیم Microsoft SDL پیش‌تر بازی عالی «ارتقای سطح دسترسی: بازی مدل‌سازی تهدید» (EoP) را منتشر کرده بود، اما به نظر نمی‌رسید این بازی به مناسب‌ترین نوع مسائلی که تیم‌های توسعه برنامه وب بیشتر باید به آن‌ها بپردازند، توجه کند."
  -
    id: "T00240"
    text: "EoP ایده و راهبرد بازی عالی‌ای است و تحت مجوز Creative Commons Attribution منتشر شده است."
  -
    id: "T00250"
    text: "ویرایش برنامه وب‌سایت Cornucopia بر مفاهیم و ایده‌های بازی EoP استوار است، اما آن‌ها برای ارتباط بیشتر با انواع مسائلی که توسعه‌دهندگان وب‌سایت و برنامه‌های وب با آن‌ها روبه‌رو می‌شوند اصلاح شده‌اند."
  -
    id: "T00260"
    text: "این ویرایش می‌کوشد ایده‌های مدل‌سازی تهدید را به تیم‌های توسعه‌ای معرفی کند که از روش‌شناسی‌های چابک استفاده می‌کنند، یا بیشتر بر ضعف‌های برنامه‌های وب تمرکز دارند تا سایر انواع آسیب‌پذیری‌های نرم‌افزاری، یا با STRIDE و DREAD آشنا نیستند."
  -
    id: "T00270"
    text: "ویرایش برنامه وب‌سایت Cornucopia به‌عنوان یک منبع اطلاعاتی در مکمل اطلاعاتی PCI DSS E-commerce Guidelines نسخه 2 از شورای استاندارد امنیت PCI در ژانویه 2013 ارجاع داده شده است."
  -
    id: "T00300"
    text: "دسته کارت (بسته)"
  -
    id: "T00310"
    text: "به‌جای خال‌های STRIDE در EoP (مجموعه‌هایی از کارت‌ها با طرح‌های یکسان)، خال‌های Cornucopia بر ساختار «راهنمای مرجع سریع شیوه‌های کدنویسی امن» (SCP) OWASP® استوارند، اما با توجه بیشتر به بخش‌هایی از «استاندارد راستی‌آزمایی امنیت برنامه» (ASVS) OWASP®، راهنمای آزمون امنیت وب (WSTG) و «اصول توسعه امن» (Principles of Secure Development) نوشته David Rook."
  -
    id: "T00320"
    text: "این‌ها پنج خال را فراهم کردند و خال ششمی با نام «کورنوکوپیا» برای همه موارد دیگر ایجاد شد:"
  -
    id: "T00330"
    text: "اعتبارسنجی و کدگذاری داده‌ها (VE)"
  -
    id: "T00340"
    text: "احراز هویت (AT)"
  -
    id: "T00350"
    text: "مدیریت نشست (SM)"
  -
    id: "T00360"
    text: "مجوزدهی (AZ)"
  -
    id: "T00370"
    text: "رمزنگاری (CR)"
  -
    id: "T00380"
    text: "کورنوکوپیا (C)"
  -
    id: "T00390"
    text: "مانند ورق‌های بازی پوکر، هر خال شامل 13 کارت است (آس، 2 تا 10، سرباز، ملکه و شاه)، اما برخلاف EoP، دو کارت جوکر هم وجود دارد."
  -
    id: "T00400"
    text: "محتوا عمدتاً از SCP گرفته شده است."
  -
    id: "T00500"
    text: "نگاشت‌ها"
  -
    id: "T00510"
    text: "محرک دیگر Cornucopia پیوند دادن حمله‌ها با الزامات و روش‌های راستی‌آزمایی است."
  -
    id: "T00520"
    text: "هدف اولیه ارجاع به شناسه‌های ضعف CWE™ بود، اما این شناسه‌ها بسیار زیاد بودند و در نتیجه تصمیم گرفته شد هر کارت به شناسه‌های الگوی حمله نرم‌افزاری CAPEC™ نگاشت شود که خود به CWEها نگاشت شده‌اند، تا نتیجه مطلوب حاصل شود."
  -
    id: "T00530"
    text: "هر کارت همچنین به 36 داستان امنیتی اصلی در سند SAFECode، و نیز به چک‌لیست برنامه وب راهنمای توسعه OWASP® نسخه 4.1.9، ASVS نسخه 5.0 و AppSensor (تشخیص و واکنش به حمله‌های برنامه) نگاشت شده است تا به تیم‌ها در ایجاد داستان‌های مرتبط با امنیت خودشان برای استفاده در فرایندهای چابک کمک کند."
  -
    id: "T00600"
    text: "راهبرد بازی"
  -
    id: "T00610"
    text: "جدا از تفاوت‌های محتوایی، قوانین بازی تقریباً با قوانین EoP یکسان است."
  -
    id: "T00700"
    text: "چاپ کارت‌ها"
  -
    id: "T00710"
    text: "برای تهیه دسته‌های چاپ‌شده روی کارت براق، صفحه پروژه Cornucopia را ببینید."
  -
    id: "T00720"
    text: "کارت‌ها را می‌توان از این سند به‌صورت سیاه‌وسفید چاپ کرد، اما رنگی مؤثرتر است."
  -
    id: "T00730"
    text: "کارت‌های صفحات بعدی این سند طوری چیده شده‌اند که روی یک نوع ورقه کارت ویزیت A4 از پیش برش‌خورده جا شوند."
  -
    id: "T00740"
    text: "به نظر می‌رسید این سریع‌ترین راه برای تولید سریع و اولیه ورق‌های بازی باشد."
  -
    id: "T00750"
    text: "کدهای محصول Avery شامل C32015 و C32030 با موفقیت آزمایش شده‌اند، اما هر کارت 10 تایی 85 در 54 میلی‌متر روی کاغذ A4 با کمی تنظیم باید کار کند."
  -
    id: "T00760"
    text: "تأمین‌کنندگان لوازم‌التحریر دیگر مانند Ryman و Sigel ورقه‌های مشابهی تولید می‌کنند"
  -
    id: "T00770"
    text: "این ورقه‌های کارت ارزان نیستند، بنابراین باید در تصمیم‌گیری درباره آنچه چاپ می‌شود و نوع رسانه و چاپگر دقت کرد."
  -
    id: "T00780"
    text: "البته می‌توان کارت‌ها را روی هر اندازه کاغذ یا مقوا چاپ و سپس دستی برش داد، یا یک چاپخانه تجاری می‌تواند حجم بیشتری چاپ کند و کارت‌ها را به اندازه ببرد."
  -
    id: "T00790"
    text: "خطوط برش در صفحه ماقبل آخر این سند نشان داده شده‌اند، اما Avery یک الگوی افقی A4 (A-0017-01_L.doc) نیز تولید می‌کند که می‌توان از آن به‌عنوان راهنما استفاده کرد."
  -
    id: "T00800"
    text: "چاپ و برش ممکن است حدود یک ساعت طول بکشد و استفاده از چاپگر سریع‌تر کمک می‌کند."
  -
    id: "T00810"
    text: "برای افزایش خوانایی سعی کنید با کیفیت بالاتری چاپ کنید."
  -
    id: "T00820"
    text: "یک طرح اختیاری برای پشت کارت (با طرح پارچه شطرنجی OWASP®) به‌عنوان آخرین صفحه این سند ارائه شده است."
  -
    id: "T00830"
    text: "به تراز خاصی نیاز نیست."
  -
    id: "T00840"
    text: "چاپ دورو به دقت ویژه‌ای نیاز دارد."
  -
    id: "T00850"
    text: "می‌توانید روی کارت‌ها یا پشت آن‌ها را مطابق ترجیحات سازمان خودتان سفارشی کنید."
  -
    id: "T00900"
    text: "سفارشی‌سازی"
  -
    id: "T00910"
    text: "پس از چند بار استفاده از Cornucopia ممکن است احساس کنید برخی کارت‌ها برای برنامه‌های شما کمتر مرتبط هستند یا تهدیدهای سازمان شما متفاوت است."
  -
    id: "T00920"
    text: "این سند را خودتان ویرایش کنید تا کارت‌ها برای تیم‌هایتان مناسب‌تر شوند، یا دسته‌های کاملاً جدیدی بسازید."
  -
    id: "T01000"
    text: "ارائه بازخورد"
  -
    id: "T01010"
    text: "اگر درباره استفاده از OWASP® Cornucopia ایده یا بازخوردی دارید، لطفاً آن را به اشتراک بگذارید."
  -
    id: "T01020"
    text: "بهتر آن است که نسخه‌های جایگزین کارت‌ها را ایجاد کنید یا نسخه‌های حرفه‌ای آماده چاپ تولید کنید؛ لطفاً آن‌ها را با داوطلبانی که این ویرایش را ساخته‌اند و با جامعه گسترده‌تر توسعه برنامه و امنیت برنامه به اشتراک بگذارید."
  -
    id: "T01030"
    text: "بهترین مکان برای بحث یا مشارکت، فهرست/گروه پروژه OWASP است:"
  -
    id: "T01040"
    text: "فهرست/گروه"
  -
    id: "T01050"
    text: "صفحه اصلی پروژه"
  -
    id: "T01060"
    text: "همه اسناد و ابزارهای OWASP برای دانلود و استفاده رایگان هستند."
  -
    id: "T01070"
    text: "OWASP® Cornucopia تحت مجوز Creative Commons Attribution-ShareAlike 3.0 منتشر شده است."
  -
    id: "T01100"
    text: "دستورالعمل‌ها"
  -
    id: "T01110"
    text: "متن روی هر کارت یک حمله را توصیف می‌کند، اما به مهاجم یک نام داده شده است که در بین همه کارت‌ها منحصربه‌فرد است."
  -
    id: "T01120"
    text: "این نام می‌تواند نمایانگر یک سیستم رایانه‌ای (مثلاً پایگاه داده، سیستم فایل، برنامه‌ای دیگر، سرویسی مرتبط، یک botnet)، یک فرد (مثلاً یک شهروند، مشتری، کارفرما، کارمند، مجرم، جاسوس)، یا حتی گروهی از افراد (مثلاً یک سازمان رقیب، فعالانی با هدف مشترک) باشد."
  -
    id: "T01130"
    text: "مهاجم ممکن است از راه دور در دستگاه/مکانی دیگر باشد، یا محلی/داخلی با دسترسی به همان دستگاه، میزبان یا شبکه‌ای که برنامه روی آن اجرا می‌شود."
  -
    id: "T01140"
    text: "مهاجم همیشه در ابتدای هر توصیف نام برده می‌شود"
  -
    id: "T01150"
    text: "یک مثال:"
  -
    id: "T01160"
    text: "William بر تولید شناسه‌های نشست کنترل دارد."
  -
    id: "T01170"
    text: "این یعنی مهاجم (William) می‌تواند شناسه‌های نشست جدیدی بسازد که برنامه آن‌ها را می‌پذیرد."
  -
    id: "T01180"
    text: "حمله‌ها عمدتاً از الزامات امنیتی فهرست‌شده در SCP نسخه 2 گرفته شدند، اما سپس با اهداف راستی‌آزمایی از «استاندارد راستی‌آزمایی امنیت برنامه» OWASP®، داستان‌های متمرکز بر امنیت در «داستان‌های امنیتی و وظایف امنیتی عملی برای محیط‌های توسعه چابک» SAFECode، و در نهایت بررسی کارت‌های EoP تکمیل شدند. در OWASP Cornucopia Website Edition نسخه 3.0، نگاشت SCP با چک‌لیست برنامه وب راهنمای توسعه OWASP جایگزین شد"
  -
    id: "T01190"
    text: "راهنمایی بیشتر درباره هر کارت در وب‌سایت OWASP در این نشانی در دسترس است:"
  -
    id: "T01200"
    text: "جستجوهای متقابل بین حمله‌ها و پنج منبع در بیشتر کارت‌ها ارائه شده است:"
  -
    id: "T01210"
    text: "الزامات در «OWASP DevGuide - Web Checklist» نسخه 4.1.9، OWASP®، ژوئیه 2025"
  -
    id: "T01220"
    text: "شناسه‌های راستی‌آزمایی در «استاندارد راستی‌آزمایی امنیت برنامه» OWASP®"
  -
    id: "T01230"
    text: "شناسه‌های نقاط تشخیص حمله در «AppSensor»، OWASP®، اوت 2010-2015"
  -
    id: "T01240"
    text: "شناسه‌ها در «فهرست الگوهای حمله رایج و طبقه‌بندی آن‌ها (CAPEC™)» نسخه 3.9، شرکت Mitre، نوامبر 2015"
  -
    id: "T01250"
    text: "داستان‌های متمرکز بر امنیت در «داستان‌های امنیتی و وظایف امنیتی عملی برای محیط‌های توسعه چابک»، SAFECode، ژوئیه 2012"
  -
    id: "T01260"
    text: "جستجوی متقابل یعنی حمله در مورد ارجاع‌شده گنجانده شده است، اما لزوماً کل مقصود آن را دربرنمی‌گیرد."
  -
    id: "T01270"
    text: "برای داده‌های ساختاریافته مانند CAPEC، دقیق‌ترین ارجاع ارائه شده است، اما گاهی ارجاعی متقابل نیز ارائه می‌شود که نمونه‌های دقیق‌تر (فرزند) هم دارد."
  -
    id: "T01280"
    text: "روی شش آس و دو جوکر جستجوی متقابلی وجود ندارد."
  -
    id: "T01290"
    text: "در عوض این کارت‌ها چند نکته کلی با متن مورب دارند."
  -
    id: "T01300"
    text: "Cornucopia را می‌توان به روش‌های مختلف بسیاری بازی کرد."
  -
    id: "T01301"
    text: "برای نحوه بازی، صفحات 11 تا 19 را بخوانید."
  -
    id: "T01310"
    text: "یک روش این است که در ویدیویی آنلاین در این نشانی نشان داده شده است:"
  -
    id: "T01311"
    text: "که از برگه امتیاز/ثبت جدید (مه 2015) در این نشانی استفاده می‌کند:"
  -
    id: "T01400"
    text: "آماده‌سازی"
  -
    id: "T01410"
    text: "یک دسته کارت تهیه کنید یا دسته کارت‌های Cornucopia را خودتان چاپ کنید (صفحه 2 این سند را ببینید) و کارت‌ها را جدا/برش دهید"
  -
    id: "T01411"
    text: "از کارت‌های این بسته استفاده کنید"
  -
    id: "T01420"
    text: "برنامه یا فرایند برنامه‌ای را برای بررسی مشخص کنید؛ این می‌تواند یک مفهوم، طراحی یا پیاده‌سازی واقعی باشد"
  -
    id: "T01430"
    text: "یک نمودار جریان داده، داستان‌های کاربری یا سایر مصنوعات را برای کمک به بررسی ایجاد کنید"
  -
    id: "T01431"
    text: "این به پاسخ دادن به این پرسش کمک می‌کند: «روی چه چیزی کار می‌کنیم؟»"
  -
    id: "T01440"
    text: "گروهی از 3 تا 6 معمار، توسعه‌دهنده، آزمونگر و سایر ذی‌نفعان کسب‌وکار را شناسایی و دعوت کنید و دور میزی بنشینید (سعی کنید کسی را که تا حدی با امنیت برنامه آشناست دعوت کنید)"
  -
    id: "T01450"
    text: "چند جایزه در دسترس داشته باشید (ستاره طلایی، شکلات، پیتزا، نوشیدنی یا گل، بسته به فرهنگ محل کارتان)"
  -
    id: "T01500"
    text: "بازی"
  -
    id: "T01510"
    text: "یک خال - کورنوکوپیا - نقش خال حکم (trump) را دارد."
  -
    id: "T01520"
    text: "آس‌ها بالاترین ارزش را دارند (یعنی از شاه‌ها برترند)."
  -
    id: "T01530"
    text: "بهتر است فردی غیربازیکن مسائل و امتیازها را ثبت کند."
  -
    id: "T01540"
    text: "جوکرها و چند کارت کم‌امتیاز (2، 3، 4) را از خال کورنوکوپیا خارج کنید تا هر بازیکن تعداد کارت یکسانی داشته باشد"
  -
    id: "T01550"
    text: "دسته را بُر بزنید و همه کارت‌ها را پخش کنید"
  -
    id: "T01560"
    text: "برای شروع، بازیکنی را به‌صورت تصادفی انتخاب کنید که اولین کارت را بازی کند - او می‌تواند هر کارتی از دست خود را بازی کند، به‌جز کارتی از خال حکم - کورنوکوپیا"
  -
    id: "T01570"
    text: "برای بازی هر کارت، هر بازیکن باید آن را با صدای بلند بخواند و توضیح دهد (برای نکات، Wiki Deck آنلاین را ببینید) که تهدید چگونه می‌تواند به کار آید (بازیکن برای حمله‌هایی که ممکن است کار کنند و گروه آن‌ها را یک باگ قابل اقدام می‌داند یک امتیاز می‌گیرد) - در این مرحله سعی نکنید راه‌های کاهش خطر را بیندیشید، و تنها به این دلیل که باور دارید تهدیدی قبلاً کاهش یافته آن را کنار نگذارید - یک نفر کارت را یادداشت کند و مسائل مطرح‌شده را ثبت کند"
  -
    id: "T01571"
    text: "اگر بازیکنی گیر کرد، از او بخواهید کد QR روی کارت را اسکن کند تا به صفحه آنلاین کارت دسترسی یابد و بخش «چه چیزی می‌تواند اشتباه پیش برود؟» را بخواند"
  -
    id: "T01580"
    text: "در جهت عقربه‌های ساعت بازی کنید؛ هر نفر باید کارتی را به همان روش بازی کند؛ اگر کارتی از خال شروع‌کننده دست دارید باید یکی از آن‌ها را بازی کنید، در غیر این صورت می‌توانید کارتی از هر خال دیگر بازی کنید."
  -
    id: "T01590"
    text: "فقط کارت بالاتر از همان خال، یا بالاترین کارت از خال حکم کورنوکوپیا، دست را می‌برد."
  -
    id: "T01600"
    text: "کسی که دور را برنده می‌شود، دور بعد را شروع می‌کند (یعنی اول بازی می‌کند) و بنابراین خال شروع‌کننده بعدی را تعیین می‌کند"
  -
    id: "T01610"
    text: "تا زمانی که همه کارت‌ها بازی شوند تکرار کنید"
  -
    id: "T01700"
    text: "امتیازدهی"
  -
    id: "T01710"
    text: "هدف شناسایی تهدیدهای قابل اعمال و بردن دست‌ها (دورها) است:"
  -
    id: "T01720"
    text: "برای هر کارتی که بتوانید آن را به‌عنوان تهدیدی معتبر برای برنامه مورد بررسی شناسایی کنید، یک امتیاز (+1) بگیرید"
  -
    id: "T01730"
    text: "اگر دوری را ببرید، یک امتیاز (+1) بگیرید"
  -
    id: "T01740"
    text: "پس از بازی همه کارت‌ها، هر کس بیشترین امتیاز را داشته باشد برنده است"
  -
    id: "T01800"
    text: "جمع‌بندی"
  -
    id: "T01810"
    text: "همه تهدیدهای قابل اعمال و الزامات امنیتی متناظر را مرور کنید"
  -
    id: "T01811"
    text: "از کدهای QR روی کارت‌ها برای دسترسی به صفحه آنلاین کارت استفاده کنید و بخش «برای مقابله با آن چه کار خواهیم کرد؟» را بخوانید"
  -
    id: "T01820"
    text: "بر حسب روش‌شناسی توسعه خود، داستان‌های کاربری، مشخصات و موارد آزمون ایجاد کنید."
  -
    id: "T01900"
    text: "قوانین جایگزین بازی"
  -
    id: "T01910"
    text: "اگر با بازی تازه‌کار هستید، در ابتدا آس‌ها و دو کارت جوکر را کنار بگذارید."
  -
    id: "T01920"
    text: "وقتی افراد با فرایند آشناتر شدند، کارت‌های جوکر را دوباره اضافه کنید."
  -
    id: "T01930"
    text: "جدا از قوانین «بازی با خال حکم» که در بالا توضیح داده شد و بسیار شبیه EoP است، می‌توان دسته را به‌صورت «بازی بیست‌ویک» (که «pontoon» یا «blackjack» هم نامیده می‌شود) نیز بازی کرد که معمولاً تعداد کارت‌های بازی‌شده در هر دور را کاهش می‌دهد."
  -
    id: "T01940"
    text: "روی یک برنامه فرضی، یا حتی برنامه‌ای که در آینده برنامه‌ریزی شده، تمرین کنید، به‌جای اینکه بخواهید در برنامه‌های موجود ایراد پیدا کنید، تا شرکت‌کنندگان از سودمندی بازی راضی شوند."
  -
    id: "T01950"
    text: "بازی با یک خال را برای جلسه کوتاه‌تر در نظر بگیرید - اما سعی کنید در هر پروژه همه خال‌ها را پوشش دهید."
  -
    id: "T01960"
    text: "یا حتی بهتر، فقط یک دست با کارت‌های از پیش انتخاب‌شده بازی کنید و فقط بر اساس توانایی شناسایی الزامات امنیتی امتیاز بدهید."
  -
    id: "T01970"
    text: "شاید هر روز به مدت یک هفته یا بیشتر یک بازی برای هر خال برگزار کنید، اگر شرکت‌کنندگان نمی‌توانند زمان کافی برای یک دسته کامل بگذارند."
  -
    id: "T01980"
    text: "برخی تیم‌ها ترجیح داده‌اند یک دست کامل کارت بازی کنند و سپس درباره محتوای کارت‌ها پس از هر دور بحث کنند (به‌جای بحث پس از بازی هر نفر)."
  -
    id: "T01990"
    text: "پیشنهاد دیگر این است که اگر بازیکنی نتوانست کارت را مرتبط تشخیص دهد، به بازیکنان دیگر اجازه دهید ایده پیشنهاد کنند و در صورت لزوم امتیاز آن کارت را به آن‌ها بدهید."
  -
    id: "T02000"
    text: "اعطای امتیاز اضافی برای مشارکت‌های به‌ویژه خوب را در نظر بگیرید."
  -
    id: "T02010"
    text: "حتی می‌توانید تنها بازی کنید."
  -
    id: "T02020"
    text: "فقط از کارت‌ها به‌عنوان محرک تفکر استفاده کنید."
  -
    id: "T02030"
    text: "با این حال، مشارکت افراد بیشتر سودمند خواهد بود."
  -
    id: "T02040"
    text: "در راهنمای EoP مایکروسافت، تقلب را به‌عنوان راهبرد بازی خوب توصیه می‌کنند."
  -
    id: "T02100"
    text: "دسته‌های کارت اصلاح‌شده ویژه چارچوب توسعه"
  -
    id: "T02110"
    text: "ممکن است در برخی زبان‌ها و چارچوب‌های رایج برای توسعه برنامه‌های وب و موبایل کنترل‌های امنیتی داخلی وجود داشته باشد."
  -
    id: "T02120"
    text: "با شرایطی، بررسی اینکه استفاده از این کنترل‌ها چگونه می‌تواند شناسایی الزامات اضافی را ساده کند مفید است - البته به شرط آنکه کنترل‌ها گنجانده، فعال و به‌درستی پیکربندی شده باشند."
  -
    id: "T02130"
    text: "اگر مطمئن هستید که نحوه استفاده شما از زبان/چارچوب آن‌ها را پوشش می‌دهد، حذف کارت‌ها از دسته را در نظر بگیرید."
  -
    id: "T02140"
    text: "موارد داخل پرانتز «احتمالی» هستند."
  -
    id: "T02200"
    text: "استانداردهای کدنویسی و کتابخانه‌های داخلی"
  -
    id: "T02210"
    text: "فهرست خودتان از کارت‌های مستثنی‌شده را بر اساس استانداردهای کدنویسی سازمانتان اضافه کنید (به شرط آنکه با مراحل راستی‌آزمایی مناسب در چرخه عمر توسعه تأیید شده باشند)."
  -
    id: "T02220"
    text: "استانداردهای کدنویسی و کتابخانه‌های شما"
  -
    id: "T02230"
    text: "اعتبارسنجی و کدگذاری داده‌ها"
  -
    id: "T02240"
    text: "[فهرست شما]"
  -
    id: "T02250"
    text: "احراز هویت"
  -
    id: "T02260"
    text: "[فهرست شما]"
  -
    id: "T02270"
    text: "مدیریت نشست"
  -
    id: "T02280"
    text: "[فهرست شما]"
  -
    id: "T02290"
    text: "مجوزدهی"
  -
    id: "T02300"
    text: "[فهرست شما]"
  -
    id: "T02310"
    text: "رمزنگاری"
  -
    id: "T02320"
    text: "[فهرست شما]"
  -
    id: "T02330"
    text: "کورنوکوپیا"
  -
    id: "T02340"
    text: "[فهرست شما]"
  -
    id: "T02400"
    text: "دسته‌های الزامات انطباق"
  -
    id: "T02410"
    text: "با گنجاندن فقط کارت‌های مربوط به یک الزام انطباق خاص، یک دسته کوچک‌تر بسازید."
  -
    id: "T02420"
    text: "الزام انطباق"
  -
    id: "T02430"
    text: "اعتبارسنجی و کدگذاری داده‌ها"
  -
    id: "T02440"
    text: "[فهرست انطباق]"
  -
    id: "T02450"
    text: "احراز هویت"
  -
    id: "T02460"
    text: "[فهرست انطباق]"
  -
    id: "T02470"
    text: "مدیریت نشست"
  -
    id: "T02480"
    text: "[فهرست انطباق]"
  -
    id: "T02490"
    text: "مجوزدهی"
  -
    id: "T02500"
    text: "[فهرست انطباق]"
  -
    id: "T02510"
    text: "رمزنگاری"
  -
    id: "T02520"
    text: "[فهرست انطباق]"
  -
    id: "T02530"
    text: "کورنوکوپیا"
  -
    id: "T02540"
    text: "[فهرست انطباق]"
  -
    id: "T02600"
    text: "پرسش‌های متداول"
  -
    id: "T02610"
    text: "1. آیا می‌توانم بازی را کپی یا ویرایش کنم؟"
  -
    id: "T02620"
    text: "بله، البته."
  -
    id: "T02630"
    text: "همه مواد OWASP را می‌توانید هر طور که می‌خواهید استفاده کنید، به شرط رعایت مجوز Creative Commons Attribution-ShareAlike 3.0."
  -
    id: "T02640"
    text: "شاید اگر نسخه جدیدی بسازید، بخواهید آن را به پروژه OWASP® Cornucopia اهدا کنید؟"
  -
    id: "T02650"
    text: "2. چگونه می‌توانم مشارکت کنم؟"
  -
    id: "T02660"
    text: "لطفاً ایده‌ها یا پیشنهادهای کمک را به فهرست پستی پروژه ارسال کنید."
  -
    id: "T02670"
    text: "3. نام مهاجمان چگونه انتخاب شد؟"
  -
    id: "T02680"
    text: "EoP هر توصیف را با عباراتی مانند «یک مهاجم می‌تواند...» آغاز می‌کند."
  -
    id: "T02690"
    text: "این‌ها باید به‌صورت حمله بیان شوند، اما من به اصطلاحات بی‌نام علاقه نداشتم و چیزی جذاب‌تر می‌خواستم، و بنابراین از نام‌های شخصی استفاده کردم."
  -
    id: "T02700"
    text: "این نام‌ها را می‌توان افراد خارجی یا داخلی یا نام مستعار برای سیستم‌های رایانه‌ای دانست. اما به‌جای نام‌های صرفاً تصادفی، فکر کردم چگونه می‌توانند جنبه جامعه OWASP را بازتاب دهند."
  -
    id: "T02710"
    text: "بنابراین، به‌جز «Alice و Bob»، از نام‌های کوچک کارمندان و اعضای هیئت‌مدیره فعلی و اخیر OWASP (بدون ترتیب خاص) استفاده کردم و سپس حدود 50 نام باقی‌مانده را به‌صورت تصادفی از فهرست فعلی اعضای حقیقی پرداخت‌کننده OWASP انتخاب کردم."
  -
    id: "T02720"
    text: "هیچ نامی بیش از یک بار استفاده نشده است و جایی که افراد دو نام شخصی ارائه کرده بودند، یک بخش را حذف کردم تا مطمئن شوم کسی به‌آسانی قابل شناسایی نیست."
  -
    id: "T02730"
    text: "نام‌ها عمداً به هیچ حمله، دفاع یا الزام خاصی اختصاص داده نشده‌اند. ترکیب فرهنگی و جنسیتی صرفاً بازتاب این منابع نام‌هاست و قرار نیست نماینده جهان باشد."
  -
    id: "T02740"
    text: "در نسخه 1.20، نام روی VE-10 تغییر کرد تا هم‌رهبر جدید پروژه را بازتاب دهد - این کارت تنها کارتی است که دو نام در حمله دارد."
  -
    id: "T02750"
    text: "4. چرا روی کارت‌ها هیچ تصویری وجود ندارد؟"
  -
    id: "T02760"
    text: "متن روی کارت‌ها بسیار زیاد است و ارجاعات متقابل نیز فضا می‌گیرند."
  -
    id: "T02770"
    text: "اما خوب است که عناصر طراحی اضافی هم گنجانده شود."
  -
    id: "T02790"
    text: "5. آیا حمله‌ها بر اساس عدد روی کارت رتبه‌بندی شده‌اند؟"
  -
    id: "T02800"
    text: "فقط تقریباً."
  -
    id: "T02810"
    text: "ریسک به برنامه و سازمان بستگی دارد، به دلیل الزامات امنیتی و انطباق متفاوت، بنابراین رتبه‌بندی شدت شما ممکن است کارت‌ها را در ترتیبی غیر از اعداد روی کارت‌ها قرار دهد."
  -
    id: "T02820"
    text: "6. بازی یک دور کارت با دسته کامل چقدر طول می‌کشد؟"
  -
    id: "T02830"
    text: "این بستگی به دامنه برنامه، میزان بحث و میزان آشنایی بازیکنان با مفاهیم امنیت برنامه دارد."
  -
    id: "T02840"
    text: "اما شاید برای 4 تا 6 نفر 1.5 تا 2.0 ساعت زمان در نظر بگیرید."
  -
    id: "T02850"
    text: "7. چه نوع افرادی باید بازی کنند؟"
  -
    id: "T02860"
    text: "همیشه سعی کنید ترکیبی از نقش‌ها داشته باشید که بتوانند دیدگاه‌های متفاوتی ارائه دهند."
  -
    id: "T02870"
    text: "اما فردی را شامل کنید که دانش معقولی از اصطلاحات آسیب‌پذیری برنامه دارد."
  -
    id: "T02880"
    text: "در غیر این صورت سعی کنید ترکیبی از معماران، توسعه‌دهندگان، آزمونگران و یک مدیر پروژه یا صاحب کسب‌وکار مرتبط را شامل کنید."
  -
    id: "T02890"
    text: "8. چه کسی باید یادداشت بردارد و امتیازها را ثبت کند؟"
  -
    id: "T02900"
    text: "بهتر است فرد دیگری که بازی نمی‌کند، درباره الزامات شناسایی‌شده و مسائل بحث‌شده یادداشت بردارد."
  -
    id: "T02910"
    text: "این کار می‌تواند به‌عنوان آموزش برای یک توسعه‌دهنده تازه‌کار استفاده شود، یا توسط مدیر پروژه انجام شود."
  -
    id: "T02920"
    text: "برخی سازمان‌ها ضبطی تهیه کرده‌اند تا بعداً، هنگام نگارش رسمی‌تر الزامات، آن را مرور کنند."
  -
    id: "T02930"
    text: "9. آیا همیشه باید از دسته کامل کارت‌ها استفاده کنیم؟"
  -
    id: "T02940"
    text: "خیر."
  -
    id: "T02950"
