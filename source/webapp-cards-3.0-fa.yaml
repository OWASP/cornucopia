-
  id: "SM"
  name: "مدیریت نشست"
  cards:
  -
    id: "SM2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/SM2"
    desc: "William بر تولید شناسه‌های نشست یا توکن‌های مجوزدهی کنترل دارد"
  -
    id: "SM3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/SM3"
    desc: "Ryan می‌تواند از یک نشست سرقت‌شده تا حداکثر مدت اعتبار آن استفاده کند، زیرا کاربر نمی‌تواند بررسی کند که آیا نشست ممکن است سرقت شده باشد، یا نشست را خاتمه دهد یا از مدیر بخواهد این کار را انجام دهد، یا زیرا برنامه در برابر رهگیری کد مجوزدهی (authorization code) اقدام پیشگیرانه‌ای ندارد"
  -
    id: "SM4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/SM4"
    desc: "Alison می‌تواند کوکی‌های شناسایی نشست را تنظیم کند یا از توکن‌ها برای برنامه وب دیگری استفاده کند، زیرا دامنه، مسیر (یا در مورد توکن‌ها، مخاطب یا audience) به‌اندازه کافی محدود نشده است"
  -
    id: "SM5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/SM5"
    desc: "John می‌تواند شناسه‌های نشست را پیش‌بینی یا حدس بزند، زیرا هنگام تغییر نقش کاربر (مثلاً پیش و پس از احراز هویت) تغییر نمی‌کنند، یا با یک سرویس پشتیبان (backend) مورد اعتماد تأیید نمی‌شوند، یا به‌اندازه کافی طولانی و تصادفی نیستند، یا به‌صورت دوره‌ای تغییر نمی‌کنند"
  -
    id: "SM6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/SM6"
    desc: "Gary می‌تواند نشست یک کاربر را تصاحب کند، زیرا مهلت عدم فعالیت طولانی است یا وجود ندارد، یا محدودیت زمانی کلی نشست طولانی است یا وجود ندارد، یا یک نشست را می‌توان از بیش از یک دستگاه یا مکان استفاده کرد"
  -
    id: "SM7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/SM7"
    desc: "Graham می‌تواند پس از پایان کار Adam از نشست او استفاده کند، زیرا قابلیت خروج وجود ندارد، یا Adam نمی‌تواند به‌آسانی خارج شود، یا زیرا خروج و سایر سازوکارهای تغییر تنظیمات احراز هویت به کاربر اجازه نمی‌دهند نشست یا نشست‌ها را خاتمه دهد"
  -
    id: "SM8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/SM8"
    desc: "Matt می‌تواند از نشست‌ها سوءاستفاده کند، زیرا برنامه پس از رسیدن به محدودیت زمانی نشست، بسته‌شدن حساب، تغییر سطح دسترسی‌ها، یا پس از هر تغییر ناگهانی و پرخطر در تنظیمات احراز هویت یا ویژگی‌های محیطی و زمینه‌ای کاربر (مثلاً نشانی IP، دستگاه، مکان، ساعت روز، مرورگر و غیره) احراز هویت مجدد را الزامی نمی‌کند"
  -
    id: "SM9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/SM9"
    desc: "Ivan می‌تواند شناسه‌های نشست یا توکن‌های مجوزدهی را سرقت کند، زیرا از کانال‌های ناامن ارسال می‌شوند، یا ثبت (log) می‌شوند، یا در پیام‌های خطا آشکار می‌شوند، یا در URLها گنجانده شده‌اند، یا بی‌دلیل برای کد، حافظه پنهان یا توزیع‌کننده‌های بار (load balancer) که مهاجم می‌تواند بر آن‌ها تأثیر بگذارد یا آن‌ها را تغییر دهد قابل دسترسی هستند"
  -
    id: "SMX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/SMX"
    desc: "Marce می‌تواند درخواست‌ها را جعل کند، زیرا برای عملیاتی که وضعیت را تغییر می‌دهند، توکن‌های تصادفی قوی (یعنی توکن‌های ضد CSRF) یا موارد مشابه به‌ازای هر نشست، یا برای عملیات حساس‌تر به‌ازای هر درخواست، استفاده نمی‌شوند"
  -
    id: "SMJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/SMJ"
    desc: "Jeff می‌تواند شناسه‌های نشست و/یا توکن‌های سرقت‌شده را دوباره استفاده کند، زیرا به‌صورت محرمانه مدیریت نمی‌شوند یا اثبات قوی مالکیت وجود ندارد (مثلاً اتصال به گواهی، دستگاه، نشانی IP، user-agent و غیره)"
  -
    id: "SMQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/SMQ"
    desc: "Salim می‌تواند مدیریت نشست را دور بزند، زیرا به‌طور جامع و یکنواخت در سراسر برنامه اعمال نمی‌شود"
  -
    id: "SMK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/SMK"
    desc: "Peter می‌تواند کنترل‌های مدیریت نشست را دور بزند، زیرا به‌جای استفاده از یک چارچوب استاندارد یا ماژول آزمون‌شده و تأییدشده، خودساخته و/یا ضعیف هستند"
  -
    id: "SMA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/SMA"
    desc: "شما حمله‌ای جدید علیه مدیریت نشست ابداع کرده‌اید"
    misc: "درباره این موضوع بیشتر در Cheat Sheets رایگان OWASP بخوانید: Session Management و Cross Site Request Forgery (CSRF) Prevention"
