    value: "3"
    url: "https://cornucopia.owasp.org/cards/AZ3"
    desc: "Christian می‌تواند به اطلاعاتی که نباید مجوز دسترسی به آن‌ها را داشته باشد، از طریق سازوکار دیگری که مجوز دارد (مثلاً نمایه‌ساز جستجو، ثبت‌کننده رویداد (logger)، گزارش‌گیری)، یا چون در حافظه پنهان ذخیره شده یا بیش از حد لازم نگهداری شده است، یا از طریق نشت اطلاعات دیگر دسترسی پیدا کند"
  -
    id: "AZ4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/AZ4"
    desc: "Kelly می‌تواند کنترل‌های مجوزدهی را دور بزند، زیرا در صورت بروز خطا به‌صورت امن عمل نمی‌کنند (یعنی به‌طور پیش‌فرض دسترسی را مجاز می‌کنند)"
  -
    id: "AZ5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/AZ5"
    desc: "Chad می‌تواند به منابعی (از جمله سرویس‌ها، فرایندها، AJAX، ویدیو، تصاویر، اسناد، فایل‌های موقت، داده‌های نشست، ویژگی‌های سیستم، داده‌های پیکربندی، تنظیمات رجیستری، لاگ‌ها) که نباید به آن‌ها دسترسی داشته باشد دسترسی پیدا کند، به‌دلیل نبود مجوزدهی یا اعطای دسترسی‌های بیش‌ازحد (مثلاً عدم رعایت اصل حداقل دسترسی)"
  -
    id: "AZ6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/AZ6"
    desc: "Eduardo می‌تواند به داده‌هایی که مجوز دسترسی به آن‌ها را ندارد دسترسی پیدا کند، هرچند به فرم/صفحه/URL/نقطه ورود مربوطه مجوز دارد"
  -
    id: "AZ7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/AZ7"
    desc: "Yuanjing می‌تواند به عملکردها، اشیاء یا ویژگی‌های برنامه که مجاز به دسترسی به آن‌ها نیست دسترسی پیدا کند"
  -
    id: "AZ8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/AZ8"
    desc: "Tom می‌تواند قوانین کسب‌وکار را با تغییر ترتیب یا جریان معمول فرایند، یا انجام فرایند به ترتیب نادرست، یا دستکاری مقادیر تاریخ و زمان مورد استفاده برنامه، یا استفاده از قابلیت‌های معتبر برای مقاصد ناخواسته، یا دستکاری داده‌های کنترلی دور بزند"
  -
    id: "AZ9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/AZ9"
    desc: "Michael می‌تواند با دور زدن برنامه به داده‌ها دسترسی پیدا کند، زیرا ابزارها یا رابط‌های مدیریتی به‌اندازه کافی ایمن نشده‌اند"
  -
    id: "AZX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/AZX"
    desc: "Richard می‌تواند کنترل‌های مجوزدهی متمرکز را دور بزند، زیرا این کنترل‌ها به‌طور جامع در همه تعاملات استفاده نمی‌شوند، یا نادرست پیکربندی شده‌اند، یا برنامه از یک ماژول/چارچوب/سرویس مجوزدهی متمرکز، استاندارد، آزمون‌شده، اثبات‌شده، توصیه‌شده و تأییدشده استفاده نمی‌کند"
  -
    id: "AZJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/AZJ"
    desc: "Dinis می‌تواند به اطلاعات پیکربندی امنیتی یا فهرست‌های کنترل دسترسی (ACL) دسترسی پیدا کند"
  -
    id: "AZQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/AZQ"
    desc: "Christopher می‌تواند فرمانی تزریق کند که برنامه آن را با سطح دسترسی بالاتری اجرا می‌کند"
  -
    id: "AZK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/AZK"
    desc: "Adrian می‌تواند بر کنترل‌ها و مجوزهای مجوزدهی تأثیر بگذارد یا آن‌ها را تغییر دهد و در نتیجه آن‌ها را دور بزند"
  -
    id: "AZA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/AZA"
    desc: "شما حمله‌ای جدید علیه مجوزدهی ابداع کرده‌اید"
    misc: "درباره این موضوع بیشتر در راهنماهای توسعه و آزمون (Development and Testing Guides) OWASP بخوانید"
-
  id: "CR"
  name: "رمزنگاری"
  cards:
  -
    id: "CR2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/CR2"
    desc: "Kyun می‌تواند به داده دسترسی پیدا کند، زیرا به‌جای استفاده از یک تابع رمزنگاری تأییدشده، فقط مبهم‌سازی (obfuscation) شده است"
  -
    id: "CR3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/CR3"
    desc: "Axel می‌تواند داده‌های گذرا یا دائمی (ذخیره‌شده یا در حال انتقال)، یا کد منبع، یا به‌روزرسانی‌ها/وصله‌ها، یا داده‌های پیکربندی را تغییر دهد، زیرا بررسی یکپارچگی روی آن‌ها انجام نمی‌شود"
  -
    id: "CR4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/CR4"
    desc: "Paulo می‌تواند به داده‌های رمزنگاری‌نشده در حال انتقال دسترسی پیدا کند، حتی با وجود اینکه کانال رمزنگاری شده است"
  -
    id: "CR5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/CR5"
    desc: "Kyle می‌تواند کنترل‌های رمزنگاری را دور بزند، زیرا در صورت بروز خطا به‌صورت امن عمل نمی‌کنند (یعنی به‌طور پیش‌فرض بدون حفاظت می‌شوند)"
  -
    id: "CR6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/CR6"
    desc: "Romain می‌تواند داده‌های رمزنگاری‌نشده را در حافظه یا در حین انتقال (مثلاً رازهای رمزنگاری، اطلاعات ورود، شناسه‌های نشست، داده‌های شخصی و حساس تجاری) هنگام استفاده یا در ارتباطات درون برنامه، یا بین برنامه و کاربران، یا بین برنامه و سیستم‌های خارجی بخواند و تغییر دهد"
  -
    id: "CR7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/CR7"
    desc: "Gunter می‌تواند داده‌های رمزنگاری‌شده و/یا درهم‌سازی‌شده (hash) را در حین انتقال رهگیری یا تغییر دهد، زیرا پروتکل ضعیف پیاده‌سازی یا پیکربندی شده است، یا گواهی‌ها نامعتبرند، یا گواهی‌ها مورد اعتماد نیستند، یا اتصال را می‌توان به ارتباطی ضعیف‌تر یا رمزنگاری‌نشده تنزل داد"
  -
    id: "CR8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/CR8"
    desc: "Eoin می‌تواند به داده‌های ذخیره‌شده کسب‌وکار (مثلاً رمزهای عبور، شناسه‌های نشست، اطلاعات هویتی شخصی (PII)، داده‌های دارندگان کارت) دسترسی پیدا کند، زیرا به‌صورت امن رمزنگاری یا درهم‌سازی نشده‌اند"
  -
    id: "CR9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/CR9"
    desc: "Andy می‌تواند کنترل‌های رمزنگاری را دور بزند، زیرا توابع تولید عدد تصادفی، GUID یا درهم‌سازی خودساخته، پرخطر یا ضعیف هستند"
  -
    id: "CRX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/CRX"
    desc: "Susanna می‌تواند رمزنگاری مورد استفاده را بشکند، زیرا برای سطح حفاظت مورد نیاز به‌اندازه کافی قوی نیست، یا برای میزان تلاشی که مهاجم حاضر به انجام آن است به‌اندازه کافی قوی نیست"
  -
    id: "CRJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/CRJ"
    desc: "Justin می‌تواند اطلاعات ورود برای دسترسی به منابع، سرویس‌ها و سیستم‌های داخلی یا خارجی را بخواند، زیرا در قالب رمزنگاری‌نشده ذخیره شده‌اند یا در کد منبع ذخیره شده‌اند"
  -
    id: "CRQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/CRQ"
    desc: "Artim می‌تواند به رازهای رمزنگاری اصلی (master) دسترسی پیدا کند یا آن‌ها را پیش‌بینی کند"
  -
    id: "CRK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/CRK"
    desc: "Dan می‌تواند بر کد یا روال‌های رمزنگاری (رمزگذاری، درهم‌سازی، امضای دیجیتال، تولید عدد تصادفی و GUID) تأثیر بگذارد یا آن‌ها را تغییر دهد و در نتیجه آن‌ها را دور بزند"
  -
    id: "CRA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/CRA"
    desc: "شما حمله‌ای جدید علیه رمزنگاری ابداع کرده‌اید"
    misc: "درباره این موضوع بیشتر در Cheat Sheets رایگان OWASP بخوانید: Cryptographic Storage و Transport Layer Protection"
-
  id: "C"
  name: "کورنوکوپیا"
  cards:
  -
    id: "C2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/C2"
    desc: "Lee می‌تواند کنترل‌های برنامه را دور بزند، زیرا به‌جای جایگزین‌های ایمن‌تر از توابع خطرناک/پرخطر زبان برنامه‌نویسی استفاده شده است، یا خطاهای تبدیل نوع وجود دارد، یا برنامه هنگام در دسترس نبودن یک منبع خارجی غیرقابل‌اعتماد عمل می‌کند، یا شرایط رقابتی (race condition) وجود دارد، یا مشکلات مقداردهی اولیه، نشت یا تخصیص منابع وجود دارد، یا سرریز رخ می‌دهد"
  -
    id: "C3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/C3"
    desc: "Andrew می‌تواند به کد منبع دسترسی پیدا کند، یا آن را کامپایل‌معکوس (decompile) یا اشکال‌زدایی کند، یا به‌نحوی به منطق کسب‌وکار دسترسی یابد تا نحوه کار برنامه و رازهای موجود در آن را بفهمد"
  -
    id: "C4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/C4"
    desc: "Keith می‌تواند عملی را انجام دهد و نتوان آن را به او نسبت داد"
  -
    id: "C5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/C5"
    desc: "Larry می‌تواند بر اعتمادی که سایر طرف‌ها از جمله کاربران به برنامه دارند تأثیر بگذارد، یا از آن اعتماد در جای دیگری (مثلاً در برنامه‌ای دیگر) سوءاستفاده کند"
  -
    id: "C6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/C6"
    desc: "Aaron می‌تواند کنترل‌ها را دور بزند، زیرا مدیریت خطا/استثنا وجود ندارد، یا ناسازگار یا ناقص پیاده‌سازی شده است، یا دسترسی را به‌طور پیش‌فرض رد نمی‌کند (یعنی خطاها باید دسترسی/اجرا را خاتمه دهند)، یا به مدیریت توسط سرویس یا سیستم دیگری متکی است"
  -
    id: "C7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/C7"
    desc: "اقدامات Mwengu قابل بررسی نیستند، زیرا ثبت دقیق و زمان‌دار رویدادهای امنیتی کافی وجود ندارد، یا ردپای حسابرسی کامل وجود ندارد، یا Mwengu می‌تواند آن‌ها را تغییر دهد یا حذف کند، یا سرویس ثبت رویداد (logging) متمرکز وجود ندارد"
  -
    id: "C8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/C8"
    desc: "David می‌تواند با دور زدن برنامه به داده‌ها دسترسی پیدا کند، زیرا زیرساخت شبکه و میزبان و سرویس‌ها/برنامه‌های پشتیبان به‌صورت امن پیکربندی نشده‌اند، پیکربندی به‌صورت دوره‌ای بازبینی نمی‌شود و وصله‌های امنیتی اعمال نمی‌شوند، یا داده به‌صورت محلی ذخیره شده است، یا داده از نظر فیزیکی محافظت نمی‌شود"
  -
    id: "C9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/C9"
    desc: "Mike می‌تواند با استفاده از یک قابلیت معتبر بیش‌ازحد سریع یا مکرر، یا به شیوه دیگری که مورد نظر نبوده، یا با مصرف منابع برنامه، یا ایجاد شرایط رقابتی، یا استفاده بیش‌ازحد از یک قابلیت، از برنامه سوءاستفاده کند"
  -
    id: "CX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/CX"
    desc: "Spyros می‌تواند کنترل‌های برنامه را دور بزند، زیرا چارچوب‌های کد، کتابخانه‌ها و مؤلفه‌ها حاوی کد مخرب یا آسیب‌پذیری هستند (مثلاً درون‌سازمانی، آماده تجاری، برون‌سپاری‌شده، متن‌باز، میزبانی‌شده در بیرون)"
  -
    id: "CJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/CJ"
    desc: "Roman می‌تواند از برنامه سوءاستفاده کند، زیرا به‌صورت ناامن کامپایل یا مستقر شده است، یا پیکربندی آن به‌طور پیش‌فرض امن نیست، یا اطلاعات امنیتی مستند نشده یا به تیم‌های عملیات منتقل نشده است، یا هنگامی که قابلیت‌های امنیتی مورد انتظار پشتیبانی نمی‌شوند یا غیرفعال‌اند به کاربر هشدار داده نمی‌شود و دسترسی مسدود نمی‌شود"
  -
    id: "CQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/CQ"
    desc: "Jim می‌تواند اقدامات مخرب و غیرعادی را بدون تشخیص و واکنش بلادرنگ برنامه انجام دهد"
  -
    id: "CK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/CK"
    desc: "Grant می‌تواند از برنامه برای سلب سرویس (denial of service) از برخی یا همه کاربران آن استفاده کند"
  -
    id: "CA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/CA"
    desc: "شما حمله‌ای جدید از هر نوع ابداع کرده‌اید"
    misc: "درباره امنیت برنامه بیشتر در راهنماهای رایگان OWASP بخوانید: Requirements، Development، Code Review and Testing، مجموعه Cheat Sheet و Open Software Assurance Maturity Model"
