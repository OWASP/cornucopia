-
  id: "AT"
  name: "احراز هویت"
  cards:
  -
    id: "AT2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/AT2"
    desc: "James می‌تواند عملیات احراز هویت را بدون اطلاع کاربر واقعی انجام دهد (مثلاً تلاش برای ورود، ورود با اطلاعات ورود سرقت‌شده، بازنشانی رمز عبور)"
  -
    id: "AT3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/AT3"
    desc: "Muhammad می‌تواند رمز عبور کاربر یا رازهای دیگر مانند کدهای احراز هویت چندعاملی (MFA) یا داده‌های زیست‌سنجی را به دست آورد، از طریق مشاهده هنگام ورود، یا از حافظه پنهان محلی، یا از حافظه، یا در حین انتقال، یا با خواندن آن از محلی محافظت‌نشده، یا چون به‌طور گسترده شناخته‌شده یا افشا شده است"
  -
    id: "AT4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/AT4"
    desc: "Sebastien می‌تواند نام‌های کاربری را به‌آسانی شناسایی یا فهرست‌برداری (enumerate) کند"
  -
    id: "AT5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/AT5"
    desc: "Javier می‌تواند با اطلاعات ورود پیش‌فرض، آزمایشی یا به‌آسانی قابل حدس احراز هویت شود، یا از یک حساب قدیمی یا حسابی که برای برنامه ضروری نیست استفاده کند"
  -
    id: "AT6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/AT6"
    desc: "Sven می‌تواند یک رمز عبور موقت، یا یک کد بازیابی، فعال‌سازی، احراز هویت یا MFA را دوباره استفاده کند، زیرا پس از استفاده تغییر نمی‌کند، یا کاربر یا مدیر نمی‌تواند آن را بازنشانی کند، یا انقضای آن ناکافی پیاده‌سازی شده، بیش‌ازحد طولانی است یا اصلاً ندارد، یا پس از استفاده، بازنشانی یا ابطال همچنان معتبر است، یا از روش تحویل امن خارج از باند (مثلاً پست، برنامه موبایل، پیامک) استفاده نمی‌کند"
  -
    id: "AT7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/AT7"
    desc: "Cecilia می‌تواند حمله‌های جستجوی فراگیر (brute force) و دیکشنری را علیه یک یا چند حساب بدون محدودیت اجرا کند، یا این حمله‌ها به‌دلیل پیچیدگی، طول، انقضا و الزامات ناکافی برای رمزهای عبور و کدهای بازیابی، فعال‌سازی یا MFA ساده‌تر می‌شوند"
  -
    id: "AT8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/AT8"
    desc: "Kate می‌تواند احراز هویت را دور بزند، زیرا در صورت بروز خطا به‌صورت امن عمل نمی‌کند (fail secure)؛ یعنی به‌طور پیش‌فرض دسترسی بدون احراز هویت را مجاز می‌کند"
  -
    id: "AT9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/AT9"
    desc: "Claudia می‌تواند عملیات حساس‌تری را انجام دهد، زیرا الزامات احراز هویت ناسازگار یا بسیار ضعیف است (مثلاً از passkey یا احراز هویت قوی دیگری مانند روش MFA توصیه‌شده استفاده نمی‌شود)، یا برای این عملیات نیازی به احراز هویت مجدد نیست"
  -
    id: "ATX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/ATX"
    desc: "Pravin می‌تواند کنترل‌های احراز هویت را دور بزند، زیرا از یک ماژول/چارچوب/سرویس احراز هویت متمرکز، استاندارد، آزمون‌شده، اثبات‌شده، توصیه‌شده و تأییدشده که جدا از منبع درخواستی باشد استفاده نمی‌شود، یا نادرست پیکربندی یا پیاده‌سازی شده است"
  -
    id: "ATJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/ATJ"
    desc: "Mark می‌تواند به منابع یا سرویس‌ها دسترسی پیدا کند، زیرا الزام احراز هویت وجود ندارد، یا احراز هویت به‌دلیل پیکربندی نادرست، طراحی یا پیاده‌سازی نامناسب غایب است، یا به‌اشتباه فرض شده که احراز هویت توسط سیستم دیگری یا در اقدام قبلی انجام می‌شود"
  -
    id: "ATQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/ATQ"
    desc: "Johan می‌تواند احراز هویت را دور بزند، زیرا با دقت یکسان برای همه انواع عملکردهای احراز هویت (مثلاً ثبت‌نام، تغییر رمز عبور، بازیابی رمز عبور، خروج، مدیریت) یا در همه نسخه‌ها و کانال‌ها (مثلاً وب‌سایت موبایل، برنامه موبایل، وب‌سایت کامل، API، مرکز تماس) اعمال نمی‌شود"
  -
    id: "ATK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/ATK"
    desc: "Olga می‌تواند بر کد یا روال‌های احراز هویت تأثیر بگذارد یا آن‌ها را تغییر دهد تا بتوان آن‌ها را دور زد"
  -
    id: "ATA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/ATA"
    desc: "شما حمله‌ای جدید علیه احراز هویت ابداع کرده‌اید"
