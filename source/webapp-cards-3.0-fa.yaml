    desc: "Darío می‌تواند از اعتمادی که برنامه به یک منبع داده دارد سوءاستفاده کند (مثلاً داده‌های قابل تعریف توسط کاربر، دستکاری داده‌های ذخیره‌شده محلی، تغییر داده‌های وضعیت روی دستگاه کلاینت، نبود یا اعمال نادرست کنترل‌های سمت کلاینت، نبود تأیید هویت هنگام اعتبارسنجی داده، مانند اینکه Darío می‌تواند خود را Colin جا بزند)"
  -
    id: "VEJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/VEJ"
    desc: "Toby بر کد یا روال‌های اعتبارسنجی ورودی، اعتبارسنجی خروجی، پاک‌سازی یا کدگذاری خروجی کنترل دارد، بنابراین می‌توان آن‌ها را دور زد"
  -
    id: "VEQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/VEQ"
    desc: "Xavier می‌تواند داده را به یک مفسر سمت کلاینت یا دستگاه تزریق کند، زیرا از رابط پارامتری‌شده استفاده نمی‌شود یا به‌درستی پیاده‌سازی نشده است، یا داده متناسب با زمینه به‌درستی کدگذاری، پاک‌سازی یا escape نشده است، یا سیاست محدودکننده‌ای برای گنجاندن کد یا داده وجود ندارد"
  -
    id: "VEK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/VEK"
    desc: "Gabe می‌تواند داده را به یک مفسر سمت سرور (مثلاً SQL، دستورهای سیستم‌عامل، Xpath، جاوااسکریپت سمت سرور، SMTP) تزریق کند، زیرا از رابط پارامتری‌شده با نوع قوی استفاده نمی‌شود، یا به‌درستی پیاده‌سازی یا پیکربندی نشده است"
  -
    id: "VEA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/VEA"
    desc: "شما حمله‌ای جدید علیه اعتبارسنجی و کدگذاری داده‌ها ابداع کرده‌اید"
