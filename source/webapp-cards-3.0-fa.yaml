    desc: "Robert می‌تواند داده‌های مخرب وارد کند، زیرا قالب پروتکل مجاز بررسی نمی‌شود، یا موارد تکراری پذیرفته می‌شوند، یا ساختار تأیید نمی‌شود، یا عناصر داده پاک‌سازی نمی‌شوند و ترجیحاً از نظر قالب، نوع، محدوده، اندازه، طول و فهرست سفید نویسه‌ها یا قالب‌های مجاز اعتبارسنجی نمی‌شوند"
  -
