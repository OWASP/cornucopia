    id: "T03820"
    text: "آن‌ها وقت و انرژی خود را برای ارائه پیشنهاد، بازخورد، نوشتن، بازبینی و ویرایش مستندات، تشویق، آزمایش بازی و ترویج این مفهوم صرف کرده‌اند."
