    misc: "آسیب‌پذیری‌ها را بررسی کنید و با استفاده از OWASP® Juice Shop، Security Shepherd یا چالش‌های آنلاین OWASP® Hacking-lab که رایگان هستند، یاد بگیرید چگونه می‌توان آن‌ها را برطرف کرد"
