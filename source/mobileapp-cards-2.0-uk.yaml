  cards:
  -
    id: "PC2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/PC2"
    desc: "Ендрю може розкрити конфіденційні дані через знімки екрана, записи екрана або автоматично створений попередній перегляд застосунку, коли він переходить у фоновий режим"
  -
    id: "PC3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/PC3"
    desc: "Гарольд може розкрити конфіденційні дані, які відображаються, вводяться або кешуються, оскільки даних забагато, вони належним чином не маскуються або не очищаються після використання, зберігаються без захисту, відкриті для вебвмісту або доступні стороннім компонентам через непотрібні дозволи"
  -
    id: "PC4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/PC4"
    desc: "Келлі може розкрити конфіденційні дані, скориставшись надмірними, незрозумілими або необґрунтованими дозволами та правами доступу до геолокації, камери, мікрофона, сховища, даних про здоров’я тощо"
  -
    id: "PC5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/PC5"
    desc: "Тобі може змінити або розкрити дані, оскільки наміри (intents) є неявними та містять дані, важливі для безпеки, на які можуть реєструватися застосунки, або тому що відповідь від намірів (intents) належним чином не перевіряється чи не очищається"
  -
    id: "PC6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/PC6"
    desc: "Доун може розкрити та перехопити конфіденційну функціональність через міжпроцесну комунікацію, оскільки дозволи на трансляцію (broadcast) і спільний доступ не встановлені, недостатньо обмежені або конфіденційна функціональність належним чином не виключається під час спільного доступу"
  -
    id: "PC7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/PC7"
    desc: "Колін може розкрити або змінити конфіденційні дані через міжпроцесну комунікацію застосунку через неправильну конфігурацію або тому що методи запитів постачальника вмісту (content provider) належно не параметризовані, а аргументи не очищені"
  -
    id: "PC8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/PC8"
    desc: "Лорен може переглядати або змінювати інакше захищені файли чи сервіси через доступ до базової файлової системи, використовуючи слабкі місця постачальника вмісту (content provider) на основі файлової системи, резолвера (resolver) або його конфігурації"
  -
    id: "PC9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/PC9"
    desc: "Макс може змінити або розкрити конфіденційні дані, оскільки перевірка та очищення вхідних даних належним чином не застосовуються до міжпроцесної комунікації або розширення належним чином не обмежені"
  -
    id: "PCX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/PCX"
    desc: "Юхан може змінити або розкрити конфіденційні дані, використовуючи застарілі платформи, SDK, сторонні залежності або компоненти WebView, оскільки підтримувані версії, довірені компоненти та оновлення безпеки не забезпечуються"
  -
    id: "PCJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/PCJ"
    desc: "Ксав’є може впровадити скрипти у вебперегляд (WebView), оскільки він дозволяє вбудовувати вміст через глибокі посилання (deep linking) без належної авторизації та перевірки хоста, схеми та шляху цільового ресурсу, які може змінити користувач, або тому що безпечний перегляд вимкнено"
  -
    id: "PCQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/PCQ"
    desc: "Грант може змінити або розкрити дані, впливаючи на містки JavaScript (bridges), DOM, розширення або міжпроцесну комунікацію чи змінюючи їх (наприклад, спільну пам’ять, передавання повідомлень, канали (pipes), сокети (sockets))"
  -
    id: "PCK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/PCK"
    desc: "Джейсон може спричинити витік або пошкодження пам’яті, оскільки застосунок неналежно керує пам’яттю чи спільними ресурсами або його нативні бінарні файли (двійкові файли) не містять захисту, наданого компілятором"
  -
    id: "PCA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/PCA"
    desc: "Ви вигадали нову атаку проти «Платформи та коду»"
    misc: "Дізнайтеся більше про цю тему у безкоштовних шпаргалках OWASP з безпеки мобільних застосунків, а також у розділі «Якість коду мобільного застосунку» у «Посібнику з тестування безпеки мобільних застосунків» на сайті OWASP MAS"
-
  id: "AA"
  name: "Автентифікація та авторизація"
  cards:
  -
    id: "AA2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/AA2"
    desc: "Ананта може виконувати конфіденційні операції без посиленої автентифікації або повторної автентифікації, оскільки вимоги до автентифікації не враховують ризик, пов’язаний із транзакціями або змінами контексту"
  -
    id: "AA3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/AA3"
    desc: "Вандана може отримати доступ до конфіденційних функцій через неправильно прив’язані або налаштовані засоби біометричної автентифікації, небезпечні резервні механізми (fallback) або необроблені зміни конфігурації"
  -
    id: "AA4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/AA4"
    desc: "Цзе може використовувати застосунок для виконання конфіденційних операцій, оскільки «розблокований ключ» не використовується під час робочого процесу застосунку"
  -
    id: "AA5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/AA5"
    desc: "Прамод може перехопити облікові дані шляхом введення в оману, оскільки застосунок вразливий до атак на кшталт Tapjacking, StrandHogg та/або перехоплення схеми URL (URL scheme hijacking)"
  -
    id: "AA6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/AA6"
    desc: "Ейман може обійти локальну автентифікацію шляхом модифікації коду (patching) та/або інструментування (instrumentation), оскільки автентифікацію можна обійти патчем або перевантажити через небезпечні резервні механізми чи неправильну конфігурацію"
  -
    id: "AA7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/AA7"
    desc: "Абдулла може обійти захищені операції, викликаючи їх не в належній послідовності, повторно використовуючи раніше дійсний результат автентифікації або змінюючи стан, час чи вхідні дані функцій, контрольовані клієнтом і довірені застосунком, замість повторної перевірки авторизації"
  -
    id: "AA8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/AA8"
    desc: "Вонг може обійти автентифікацію, оскільки застосунок довіряє результатам автентифікації на стороні клієнта або за замовчуванням дозволяє доступ, коли перевірка завершується помилкою"
  -
    id: "AA9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/AA9"
    desc: "Чой може отримати доступ до конфіденційних даних або функціональності, оскільки засоби контролю доступу до компонентів застосунку (наприклад, прав (entitlements), дозволів (permissions)), локальних ресурсів або вебвмісту (web content) надто широкі, неправильно налаштовані або не застосовуються"
  -
    id: "AAX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/AAX"
    desc: "Аде може обійти автентифікацію, оскільки вона не забезпечується через віддалену кінцеву точку (remote endpoint) або не ґрунтується на криптографічному примітиві, захищеному прапорцями контролю доступу (access control flags) сховища ключів або зв’язки ключів (keychain)"
  -
    id: "AAJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/AAJ"
    desc: "Прасад може обійти централізовані засоби контролю автентифікації та авторизації, оскільки вони не використовуються комплексно для всіх взаємодій"
  -
    id: "AAQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/AAQ"
    desc: "Ріотаро може обійти засоби контролю авторизації, використовуючи потоки даних між поданнями (views) / екранами, процесами та компонентами для впровадження команд, маніпулювання даними або розкриття конфіденційної інформації"
  -
    id: "AAK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/AAK"
    desc: "Аатіф може впливати на засоби контролю автентифікації або змінювати їх і тому обходити їх"
  -
    id: "AAA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/AAA"
    desc: "Ви вигадали нову атаку проти «Автентифікації та авторизації»"
    misc: "Дізнайтеся більше про цю тему у безкоштовних шпаргалках OWASP з безпеки мобільних застосунків, а також у розділі «Архітектури автентифікації мобільних застосунків» у «Посібнику з тестування безпеки мобільних застосунків» на сайті OWASP MAS"
-
  id: "NS"
  name: "Мережа та сховище"
  cards:
  -
    id: "NS2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/NS2"
    desc: "Метт може переглядати конфіденційні дані журналів застосунку, оскільки оператори журналювання не видалені або не перевірені на безпечність перед випуском у робоче середовище (production)"
  -
    id: "NS3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/NS3"
    desc: "Біл може отримати доступ до конфіденційних даних у чутливих полях із буфера обміну (pasteboard/clipboard) або кешу клавіатури, оскільки буфер обміну несвоєчасно очищається, не вимикається або не обмежується для чутливих полів, або кеш клавіатури не вимикається"
  -
    id: "NS4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/NS4"
    desc: "Кевін може прочитати конфіденційні дані, пов’язані з обліковими записами або сеансами користувачів, вилучаючи дані, відкриті через сторонні бібліотеки, сповіщення, резервні копії, кеші, локальні бази даних або інші вбудовані сервіси"
  -
    id: "NS5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/NS5"
    desc: "Стів може отримати доступ до конфіденційних даних, читаючи резервні копії та/або локальне, внутрішнє чи зовнішнє сховище"
  -
    id: "NS6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/NS6"
    desc: "Рікардо може вилучити дані, збережені застосунком на викраденому або виведеному з експлуатації пристрої, оскільки пристрій не забезпечує виконання політик безпеки доступу (наприклад, блокування із захистом PIN, перевірки версії застосунку/ОС, вимкнення налагодження через USB, шифрування пристрою та виявлення root-прав (rooting))"
  -
    id: "NS7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/NS7"
    desc: "Сем може витягти (зняти дамп) конфіденційні дані з пам’яті, оскільки дані не зберігаються як примітивні типи даних і після використання не перезаписуються випадковими даними, або поля введення застосунку використовують небезпечні SDK для зберігання даних у RAM"
  -
    id: "NS8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/NS8"
    desc: "Тахер може розкрити або змінити конфіденційні дані у стані спокою, оскільки шифрування або захист цілісності недостатні"
  -
    id: "NS9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/NS9"
    desc: "Мартін може змінити поведінку або отримати доступ до конфіденційних даних, підробляючи важливі для безпеки дані у спільних налаштуваннях (shared preferences), параметрах користувача (user defaults), файлах або базах даних, оскільки застосунок не перевіряє їхню цілісність і автентичність перед використанням"
  -
    id: "NSX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/NSX"
    desc: "Адріан може скомпрометувати комунікацію застосунку через проксі, оскільки застосунок не використовує закріплення сертифікатів (certificate pinning) або реалізує його неправильно"
  -
    id: "NSJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/NSJ"
    desc: "Ніель може розкрити або змінити дані під час передавання, оскільки застосунок дозволяє відкритий трафік (cleartext traffic) або зниження версії (downgrade) до застарілих версій протоколу TLS"
  -
    id: "NSQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/NSQ"
    desc: "Ахмед може читати та змінювати дані під час передавання, оскільки комунікація передається через незашифрований канал"
  -
    id: "NSK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/NSK"
    desc: "Маартен може видати себе за довірений сервер і розкрити або змінити дані під час передавання, оскільки перевірка TLS-сертифіката, імені хоста (hostname) або спеціальна перевірка довіри слабкі чи можуть бути обійдені"
  -
    id: "NSA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/NSA"
    desc: "Ви вигадали нову атаку проти «Мережі та сховища»"
    misc: "Дізнайтеся більше про цю тему у безкоштовних шпаргалках OWASP з безпеки мобільних застосунків, а також у розділі «Мережева комунікація мобільних застосунків» у «Посібнику з тестування безпеки мобільних застосунків» на сайті OWASP MAS"
-
  id: "RS"
  name: "Стійкість"
  cards:
  -
    id: "RS2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/RS2"
    desc: "Себастьєн може розкрити конфіденційні дані або внутрішню поведінку, оскільки код налагодження (debug-код), докладна діагностика, тестові ресурси або небезпечне журналювання під час виконання залишаються у релізному застосунку"
  -
    id: "RS3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/RS3"
    desc: "Тобіас може розкрити конфіденційні дані та деталі реалізації, оскільки символи налагодження (debug symbols) та інші метадані розробки залишаються доступними у релізі"
  -
    id: "RS4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/RS4"
    desc: "Тімур може замінити, повторно поширити або додати неперевірений код у релізний застосунок, оскільки його підпис, сертифікат, походження з магазину застосунків (app store), цілісність упакованого коду або походження відтворюваної збірки неможливо належним чином перевірити"
  -
    id: "RS5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/RS5"
    desc: "Маттео може обійти засоби контролю доступу та викликати функціональність, оскільки налагодження (debugging) залишено увімкненим у робочій збірці (production)"
  -
    id: "RS6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/RS6"
    desc: "Йорен може обійти засоби контролю доступу, оскільки засоби захисту від налагодження (anti-debugging) недостатньо надійні відповідно до рекомендацій або передбачуваних зусиль потенційного зловмисника"
  -
    id: "RS7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/RS7"
    desc: "Ерленд може скомпрометувати застосунок, запустивши його в емуляторі, симуляторі, віртуалізованому середовищі або на недовіреному пристрої, оскільки виявлення середовища чи атестація (attestation) відсутні або надто слабкі"
  -
    id: "RS8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/RS8"
    desc: "Карлос може розкрити конфіденційні дані, перехоплюючи виклики чутливих функцій (hooking) під час виконання, оскільки застосунок не виявляє інструментування (instrumentation) і не реагує на нього"
  -
    id: "RS9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/RS9"
    desc: "Шон може виконати зворотне проектування (reverse engineering) застосунку, оскільки код або чутливі для безпеки ресурси (наприклад, рядки, конфігурація та вбудовані ресурси (bundled assets)) недостатньо обфусковані"
  -
    id: "RSX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/RSX"
    desc: "Хуан може отримати доступ до функціональності з рутованого пристрою, пристрою зі знятим захистом (jailbroken) або зараженого пристрою, оскільки застосунок не виявляє ворожих середовищ (hostile environments) або не реагує на них належним чином"
  -
    id: "RSJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/RSJ"
    desc: "Пекка може змінити важливі для безпеки файли, конфігурацію, завантажений вміст або відновлені дані, оскільки застосунок не перевіряє їхню цілісність і автентичність перед використанням"
  -
    id: "RSQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/RSQ"
    desc: "Тітус може змінити або обійти критичну функціональність, модифікувавши (пропатчивши) застосунок або перехоплюючи виклики чутливих функцій під час виконання, оскільки застосунок належним чином не виявляє несанкціонованого втручання (tampering) і не реагує на інструментування під час виконання (runtime instrumentation)"
  -
    id: "RSK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/RSK"
    desc: "Шеріф може вимкнути або обійти перевірки захисту від зворотного проектування (anti-reversing) та захисту під час виконання (runtime protection), модифікувавши їх або перехопивши сигнали, на яких вони ґрунтуються, що дає змогу непомітно продовжити аналіз або інструментування (instrumentation)"
  -
    id: "RSA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/RSA"
    desc: "Ви вигадали нову атаку проти «Стійкості»"
    misc: "Дізнайтеся більше про цю тему у безкоштовних шпаргалках OWASP з безпеки мобільних застосунків, а також у розділі «Втручання та зворотне проектування (Tampering & Reverse Engineering) мобільних застосунків» у «Посібнику з тестування безпеки мобільних застосунків» на сайті OWASP MAS"
-
  id: "CRM"
  name: "Криптографія"
  cards:
  -
    id: "CRM2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/CRM2"
    desc: "Лесего може скомпрометувати криптографічні операції та ресурси, оскільки ключі повторно використовуються для кількох цілей або не використовуються відповідно до призначення, для якого їх створено"
  -
    id: "CRM3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/CRM3"
    desc: "Ораче може скомпрометувати захищені дані, оскільки випадкові значення, що використовуються для генерації криптографічних ключів, векторів ініціалізації (IV) або одноразових чисел (nonces), є передбачуваними"
  -
    id: "CRM4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/CRM4"
    desc: "Адель може передбачити, вивести або відновити ключі шифрування чи підпису, оскільки для їхньої генерації або виведення використовуються недостатня ентропія, слабкі параметри або відомі чи перебірні вхідні значення"
  -
    id: "CRM5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/CRM5"
    desc: "Емері може отримати доступ до даних, оскільки їх обфусковано замість використання схваленої криптографічної функції"
  -
    id: "CRM6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/CRM6"
    desc: "Енсельм може змінити конфіденційні дані (збережені або під час передавання), оскільки вони не проходять перевірку цілісності"
  -
    id: "CRM7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/CRM7"
    desc: "Гасан може вилучити або змінити конфіденційні дані, оскільки вони зберігаються без належного шифрування або платформних засобів захисту даних"
  -
    id: "CRM8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/CRM8"
    desc: "Еш може зламати криптографію, оскільки вона недостатньо надійна відповідно до рекомендацій або передбачуваних зусиль потенційного зловмисника"
  -
    id: "CRM9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/CRM9"
    desc: "Рамзі може отримати доступ до захищених конфіденційних даних, оскільки криптографічна конфігурація (наприклад, алгоритм, режим, IV, nonce або провайдер) є слабкою чи використовується неправильно"
  -
    id: "CRMX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/CRMX"
    desc: "Коуті може вилучити криптографічні ключі або конфіденційні дані, оскільки вони жорстко закодовані або зберігаються без шифрування чи належного платформного захисту в приватному або спільному сховищі застосунку"
  -
    id: "CRMJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/CRMJ"
    desc: "Фаді може обійти криптографічні засоби контролю, оскільки вони не завершуються безпечно (тобто за замовчуванням залишаються незахищеними)"
  -
    id: "CRMQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/CRMQ"
    desc: "Саймон може обійти функції хешування та шифрування, оскільки вони власні та/або реалізовані неналежним чином"
  -
    id: "CRMK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/CRMK"
    desc: "Тарік може впливати на криптографічні операції або змінювати їх і тому обходити їх"
  -
    id: "CRMA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/CRMA"
    desc: "Ви вигадали нову атаку проти «Криптографії»"
    misc: "Дізнайтеся більше про цю тему у безкоштовних шпаргалках OWASP з безпеки мобільних застосунків, а також у розділі «Криптографія мобільних застосунків» у «Посібнику з тестування безпеки мобільних застосунків» на сайті OWASP MAS"
-
  id: "CM"
  name: "Cornucopia"
  cards:
  -
    id: "CM2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/CM2"
    desc: "Гарт може погіршити приватність користувачів застосунку, оскільки застосунок чітко не розкриває конфіденційні дані або домени відстеження (tracking domains), до яких він отримує доступ, які збирає, використовує чи поширює"
  -
    id: "CM3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/CM3"
    desc: "Ельза може погіршити приватність користувачів застосунку, оскільки застосунок не дає користувачеві змоги легко керувати, видаляти та змінювати свої дані, змінювати налаштування приватності й повторно запитувати згоду, коли потрібні додаткові дані"
  -
    id: "CM4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/CM4"
    desc: "Єлизавета може погіршити приватність користувачів застосунку, оскільки застосунок чітко не розкриває персональні дані, якими він ділиться зі сторонніми/зовнішніми сервісами (downstream services), або не отримує на це згоду користувача"
  -
    id: "CM5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/CM5"
    desc: "Дебарґхая може погіршити приватність користувачів застосунку, оскільки застосунок повторно використовує персональні дані, зібрані для безпеки або запобігання шахрайству, у комерційних цілях без поінформованої згоди"
  -
    id: "CM6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/CM6"
    desc: "Кім може погіршити приватність користувачів застосунку, оскільки застосунок повторно використовує біометричну інформацію (наприклад, відбитки пальців, дані розпізнавання обличчя тощо), зібрану з міркувань безпеки, для задоволення комерційних інтересів"
  -
    id: "CM7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/CM7"
    desc: "Карлос може використовувати служби сповіщень застосунку для запуску фішингових кампаній, оскільки вміст сповіщень або цільові адреси дій (action destinations) належним чином не очищаються чи не перевіряються"
  -
    id: "CM8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/CM8"
    desc: "Гастон може ініціювати шкідливі дії, використовуючи небезпечну міжзастосункову комунікацію або делеговані дії"
  -
    id: "CM9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/CM9"
    desc: "Луїс може змусити застосунок діяти на основі підроблених захищених даних, оскільки він не перевіряє, що дані, отримані від зовнішніх сервісів, автентичні та незмінені"
  -
    id: "CMX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/CMX"
    desc: "Роксана може довільно перезаписувати файли та потенційно виконувати шкідливий код через обхід шляху (path traversal), оскільки цільовий шлях і каталог належним чином не перевіряються"
  -
    id: "CMJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/CMJ"
    desc: "Алессандро може використати застосунок, скориставшись переповненнями буфера та витоками пам’яті для запису стороннього коду в адресний простір мобільного коду"
  -
    id: "CMQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/CMQ"
    desc: "Віктор може модифікувати (пропатчити) застосунок і використовувати його для поширення шкідливого коду, оскільки перевірки цілісності під час виконання недостатньо надійні відповідно до рекомендацій або передбачуваних зусиль потенційного зловмисника"

  -
    id: "CMK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/CMK"
    desc: "Рубен може використовувати застосунок для поширення шкідливого коду, оскільки він приймає, завантажує або пересилає недовірений вміст без перевірки його джерела, типу чи безпечності"
  -
    id: "CMA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/CMA"
    desc: "Ви вигадали нову атаку будь-якого типу"
    misc: "Дізнайтеся більше про цю тему у безкоштовних шпаргалках OWASP з безпеки мобільних застосунків, а також у розділі «Захист приватності користувачів мобільних застосунків» у «Посібнику з тестування безпеки мобільних застосунків» на сайті OWASP MAS"
-
  id: "WC"
  name: "Джокер"
  cards:
  -
    id: "JOAM"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/JOAM"
    card: "Joker"
    desc: "Старр може вплинути на застосунок, змінити його або впливати на нього так, що він більше не відповідатиме законодавчим, нормативним, договірним чи іншим вимогам"
    misc: "Чи думали ви про те, щоб стати індивідуальним членом OWASP? Усі інструменти, рекомендації та місцеві зустрічі безкоштовні для всіх, але індивідуальне членство допомагає підтримувати роботу OWASP"
  -
    id: "JOBM"
    value: "B"
    url: "https://cornucopia.owasp.org/cards/JOBM"
    card: "Joker"
    desc: "Меллорі може зловмисно використовувати застосунок, встановлений на пристрої Боба, щоб стежити, шпигувати, підслуховувати, дистанційно керувати, відстежувати або іншим чином контролювати Боба без згоди та/або повідомлення"
    misc: "Досліджуйте вразливості та дізнавайтеся, як їх можна виправити, використовуючи безкоштовні еталонні застосунки (reference applications) MASTG на сайті OWASP MAS"
paragraphs:
-
  id: "Common"
  name: "Common"
  sentences:
  -
    id: "NoCard"
    text: "Немає карти"
  -
    id: "Title"
    text: "Mobile App Edition v2.0-UK"
  -
    id: "Title_full"
    text: "OWASP® Cornucopia Mobile App Edition v2.0-UK"
  -
    id: "T00010"
    text: "OWASP® Cornucopia — це механізм, який допомагає командам розробки програмного забезпечення визначати вимоги безпеки в Agile-, звичайних і формальних процесах розробки."
  -
    id: "T00020"
    text: "Автори"
  -
    id: "T00090"
    text: "© 2012-2026 OWASP Foundation"
  -
    id: "T00092"
    text: "OWASP® Cornucopia Mobile App Edition is free to use. It is licensed under the Creative Commons Attribution-ShareAlike 4.0 license, so you can copy, distribute and transmit the work, and you can adapt it, and use it commercially, but all provided that you attribute the work and if you alter, transform, or build upon this work, you may distribute the resulting work only under the same or similar license to this one."
  -
    id: "T00100"
    text: "Подяки"
  -
    id: "T00110"
    text: "Адаму Шостаку та команді Microsoft SDL за «Elevation of Privilege Threat Modelling Game», опубліковану за ліцензією Creative Commons Attribution, яка стала натхненням для Cornucopia і джерелом багатьох ідей, особливо теорії гри."
  -
    id: "T00120"
    text: "Коліну Вотсону за створення Cornucopia, на якій ґрунтується OWASP Cornucopia Mobile App Edition."
  -
    id: "T00130"
    text: "Учасникам, прихильникам, спонсорам і волонтерам OWASP MASVS/MASTG, Common Attack Pattern Enumeration and Classification (CAPEC™) від Mitre та «Practical Security Stories and Security Tasks for Agile Development Environments» від SAFECode, які використані у наведених перехресних посиланнях."
  -
    id: "T00145"
    text: "Нинішнім і колишнім учасникам та керівникам проєкту OWASP® Cornucopia, особливо тим, хто нещодавно оновлював перехресні посилання, створював онлайн-версії та писав скрипти для динамічної генерації вихідних файлів Cornucopia."
  -
    id: "T00150"
    text: "Blackfoot (UK) Limited за створення та пожертвування готових до друку файлів дизайну, Тому Бреннану та OWASP® Foundation за ініціювання створення коробки й буклета з брендом OWASP, а також Secure Delivery Ltd за розробку та пожертвування Copi — платформи для онлайн-гри в Cornucopia та EoP."
  -
    id: "T00161"
    text: "(продовження на сторінці 20)"
  -
    id: "T00162"
    text: "(продовження зі сторінки 10)"
  -
    id: "T00200"
    text: "Вступ"
  -
    id: "T00210"
    text: "Ідея Cornucopia полягає в тому, щоб допомогти командам розробки, особливо тим, які використовують методології Agile, визначати вимоги безпеки застосунків і розробляти користувацькі сценарії (user stories) на основі безпеки."
  -
    id: "T00220"
    text: "Мобільне видання Cornucopia використовує ті самі концепції та стратегію гри, що й видання Cornucopia для вебзастосунків, але створене для команд, які розробляють мобільні застосунки. Cornucopia натхненна «Elevation of Privilege: The Threat Modeling Game (EoP)»."
  -
    id: "T00240"
    text: "Cornucopia намагається запровадити ідеї моделювання загроз (threat modeling) у команди мобільної розробки, які використовують методології Agile або більше зосереджені на слабких місцях мобільних застосунків, ніж на інших типах вразливостей програмного забезпечення."
  -
    id: "T00300"
    text: "Колода карт (набір)"
  -
    id: "T00310"
    text: "Сценарії карт мають охоплювати всі вимоги MASVS 2.0, усі тести з MASTG і будь-які додаткові рекомендації з посібників безпечного кодування для Android та iOS. Це зроблено, щоб гра якомога краще відповідала найновішим рекомендаціям щодо безпечної мобільної розробки. Водночас важливо пам’ятати, що рекомендації та вимоги безпеки постійно змінюються, а гру насамперед слід використовувати як допоміжний засіб під час моделювання загроз для мобільних застосунків, а не як повний посібник із вимог і рекомендацій безпеки."
  -
    id: "T00311"
    text: "Масті Cornucopia Mobile App Edition базуються на розділах Mobile Application Security Verification Standard."
  -
    id: "T00320"
    text: "Цей стандарт надав п’ять мастей, а шосту під назвою «Cornucopia» створено як козирну масть:"
  -
    id: "T00330"
    text: "Платформа та код (PC)"
  -
    id: "T00340"
    text: "Автентифікація та авторизація (AA)"
  -
    id: "T00350"
    text: "Мережа та сховище (NS)"
  -
    id: "T00360"
    text: "Стійкість (RS)"
  -
    id: "T00370"
    text: "Криптографія (CRM)"
  -
    id: "T00380"
    text: "Cornucopia (CM)"
  -
    id: "T00390"
    text: "Подібно до гральних карт, кожна масть містить 13 карт (туз, 2–10, валет, дама та король)."
  -
    id: "T00400"
    text: "Також є дві карти Джокера, подібні до карт у виданні Cornucopia для вебзастосунків."
  -
    id: "T00500"
    text: "Відповідності"
  -
    id: "T00510"
    text: "Інша мета Mobile Cornucopia — пов’язати атаки з вимогами та методами перевірки."
  -
    id: "T00520"
    text: "Окрім надрукованих на них кодів вимог MASVS 2.0 і кодів тестів MASTG, карти також містять посилання на ідентифікатори шаблонів атак програмного забезпечення CAPEC™, які своєю чергою пов’язані з CWE."
  -
    id: "T00530"
    text: "Кожна карта також пов’язана з 36 основними захисними сценаріями (security stories) у документі SAFECode, щоб допомогти командам створювати власні історії, пов’язані з безпекою, для використання в процесах Agile."
  -
    id: "T00600"
    text: "Стратегія гри"
  -
    id: "T00610"
    text: "Окрім відмінностей у змісті, правила гри практично ідентичні правилам видання Cornucopia для вебзастосунків."
  -
    id: "T01000"
    text: "Надати відгук"
  -
    id: "T01010"
    text: "Якщо у вас є ідеї або відгуки щодо використання OWASP® Mobile Cornucopia, поділіться ними."
  -
    id: "T01020"
    text: "Ще краще, якщо ви створите альтернативні версії карт або професійні версії, готові до друку: поділіться ними з волонтерами, які створили це видання, і ширшою спільнотою розробників та фахівців із безпеки застосунків."
  -
    id: "T01030"
    text: "Найкраще місце для обговорення або участі — список/група проєкту OWASP:"
  -
    id: "T01040"
    text: "Список/група"
  -
    id: "T01050"
    text: "Домашня сторінка проєкту"
  -
    id: "T01060"
    text: "Усі документи та інструменти OWASP можна безкоштовно завантажувати й використовувати."
  -
    id: "T01070"
    text: "OWASP® Cornucopia Mobile App Edition is licensed under the Creative Commons Attribution-ShareAlike 4.0 license."
  -
    id: "T01100"
    text: "Інструкції"
  -
    id: "T01110"
    text: "Текст на кожній карті описує атаку, але зловмиснику присвоєно ім’я, унікальне для всіх карт."
  -
    id: "T01120"
    text: "Ім’я може позначати комп’ютерну систему (наприклад, базу даних, файлову систему, інший застосунок, пов’язаний сервіс, ботнет), окрему особу (наприклад, громадянина, покупця, клієнта, працівника, злочинця, шпигуна) або навіть групу людей (наприклад, конкуруючу організацію чи активістів зі спільною метою)."
  -
    id: "T01130"
    text: "Зловмисник може бути віддаленим і перебувати на іншому пристрої або в іншому місці, чи локальним/внутрішнім із доступом до того самого пристрою, хоста або мережі, в якій працює застосунок."
  -
    id: "T01140"
    text: "Зловмисник завжди названий на початку кожного опису"
  -
    id: "T01150"
    text: "Наприклад:"
  -
    id: "T01160"
    text: "Вонг може обійти автентифікацію, оскільки вона не завершується безпечно."
  -
    id: "T01170"
    text: "Це означає, що зловмисник Вонг може увійти до застосунку без надання облікових даних, оскільки механізм входу дозволяє доступ у разі помилки."
  -
    id: "T01180"
    text: "Атаки переважно взято з Mobile Application Testing guide MASVS 2.0 та посібників із безпечного кодування для Android та iOS."
  -
    id: "T01200"
    text: "На більшості карт наведено відповідності між атаками та посібниками:"
  -
    id: "T01210"
    text: "Коди тестів із MASVS Mobile Application Test Guide:"
  -
    id: "T01220"
    text: "Ідентифікатори перевірки у «Mobile Application Security Verification Standard (MASVS) 2.0 for Mobile Applications»"
  -
    id: "T01240"
    text: "Ідентифікатори у «Common Attack Pattern Enumeration and Classification (CAPEC™)», версія 3.9, Mitre Corporation, листопад 2015 року"
  -
    id: "T01250"
    text: "Історії, зосереджені на безпеці, у «Practical Security Stories and Security Tasks for Agile Development Environments», SAFECode, липень 2012 року"
  -
    id: "T01260"
    text: "Відповідність означає, що атака включена до зазначеного елемента, але він не обов’язково охоплює весь її задум."
  -
    id: "T01270"
    text: "Для структурованих даних, таких як CAPEC, наведено найточніше посилання, але іноді надається перехресне посилання, яке також містить конкретніші (дочірні) приклади."
  -
    id: "T01280"
    text: "Для шести тузів і двох Джокерів немає відповідностей."
  -
    id: "T01290"
    text: "Натомість ці карти містять загальні поради курсивом."
  -
    id: "T01300"
    text: "У Cornucopia можна грати багатьма різними способами."
  -
    id: "T01301"
    text: "Інструкції щодо гри дивіться на сторінках 11–19."
  -
    id: "T01400"
    text: "Підготовка"
  -
    id: "T01410"
    text: "Отримайте колоду або надрукуйте власну колоду карт Cornucopia (див. сторінку 2 цього документа) та відокремте/виріжте карти"
  -
    id: "T01411"
    text: "Використовуйте карти з цього набору"
  -
    id: "T01420"
    text: "Визначте застосунок або процес застосунку для перевірки; це може бути концепція, дизайн або фактична реалізація"
  -
    id: "T01430"
    text: "Створіть діаграму потоків даних, користувацькі сценарії (user stories) або інші артефакти, щоб допомогти з перевіркою"
  -
    id: "T01440"
    text: "Визначте та запросіть групу з 3–6 архітекторів, розробників, тестувальників та інших зацікавлених представників бізнесу й сядьте за стіл (спробуйте залучити когось, хто добре знайомий із безпекою застосунків)"
  -
    id: "T01450"
    text: "Підготуйте призи (золоті зірочки, шоколад, піцу, пиво або квіти — залежно від культури вашого офісу)"
  -
    id: "T01500"
    text: "Гра"
  -
    id: "T01510"
    text: "Одна масть — Cornucopia — є козирною."
  -
    id: "T01520"
    text: "Тузи старші за інші карти (тобто перемагають королів)."
  -
    id: "T01530"
    text: "Корисно, якщо питання та рахунок документує учасник, який не бере участі в грі (спостерігач)."
  -
    id: "T01540"
    text: "Приберіть Джокерів і кілька карт із низькими значеннями (2, 3, 4) з масті Cornucopia, щоб у кожного гравця була однакова кількість карт"
  -
    id: "T01550"
    text: "Перетасуйте колоду та роздайте всі карти"
  -
    id: "T01560"
    text: "Для початку випадково виберіть гравця, який зіграє першу карту — він може зіграти будь-яку карту зі своєї руки, крім карти козирної масті Cornucopia"
  -
    id: "T01570"
    text: "Щоб зіграти карту, кожен гравець має прочитати її вголос і пояснити (поради дивіться в онлайн Wiki Deck), як може проявитися загроза (гравець отримує бал за атаки, які можуть спрацювати й які група вважає помилкою, що потребує дії) — на цьому етапі не намагайтеся продумувати засоби пом’якшення і не відкидайте загрозу лише через припущення, що її вже усунуто; хтось має занотувати карту та записати порушені питання"
  -
    id: "T01580"
    text: "Грайте за годинниковою стрілкою; кожен має зіграти карту так само. Якщо у вас є карта масті, з якої почали раунд, ви повинні зіграти одну з них, інакше можете зіграти карту будь-якої іншої масті."
  -
    id: "T01590"
    text: "Взятку виграє лише старша карта тієї самої масті або найстарша карта козирної масті Cornucopia."
  -
    id: "T01600"
    text: "Переможець раунду починає наступний раунд (тобто грає першим) і таким чином визначає наступну масть раунду"
  -
    id: "T01610"
    text: "Повторюйте, доки не буде зіграно всі карти"
  -
    id: "T01700"
    text: "Підрахунок балів"
  -
    id: "T01710"
    text: "Мета — визначати відповідні загрози та вигравати взятки (раунди):"
  -
    id: "T01720"
    text: "Отримайте +1 бал за кожну карту, яку ви визначили як дійсну загрозу для застосунку, що розглядається"
  -
    id: "T01730"
    text: "Отримайте +1 бал за перемогу в раунді"
  -
    id: "T01740"
    text: "Після того як зіграно всі карти, перемагає гравець із найбільшою кількістю балів"
  -
    id: "T01800"
    text: "Завершення"
  -
    id: "T01810"
    text: "Перегляньте всі відповідні загрози та пов’язані з ними вимоги безпеки"
  -
    id: "T01820"
    text: "Створіть користувацькі сценарії (user stories), специфікації та тестові випадки відповідно до вашої методології розробки."
  -
    id: "T01900"
    text: "Альтернативні правила гри"
  -
    id: "T01910"
    text: "Якщо ви новачок у цій грі, спочатку приберіть тузи та дві карти Джокера."
  -
    id: "T01920"
    text: "Поверніть карти Джокера, коли учасники краще ознайомляться з процесом."
  -
    id: "T01930"
    text: "Окрім описаних вище правил «козирної карткової гри», дуже подібних до EoP, у колоду також можна грати як у «двадцять одне» (також відому як «понтон» або «блекджек»), що зазвичай зменшує кількість карт у кожному раунді."
  -
    id: "T01940"
    text: "Практикуйтеся на уявному або запланованому в майбутньому застосунку, а не шукайте недоліки в наявних застосунках, доки учасники не переконаються в корисності гри."
  -
    id: "T01950"
    text: "Розгляньте можливість грати лише однією мастю, щоб скоротити сеанс, але намагайтеся охопити всі масті для кожного проєкту."
  -
    id: "T01960"
    text: "Або ще краще — зіграйте одну роздачу з попередньо вибраними картами й нараховуйте бали лише за здатність визначати вимоги безпеки."
  -
    id: "T01970"
    text: "Якщо учасники не можуть виділити достатньо часу для повної колоди, можливо, грайте приблизно тиждень по одній грі кожної масті щодня."
  -
    id: "T01980"
    text: "Деякі команди вважають за краще зіграти повну роздачу, а потім обговорювати зміст карт після кожного раунду (замість обговорення після ходу кожного гравця)."
  -
    id: "T01990"
    text: "Ще одна пропозиція: якщо гравець не визначив, що карта має значення, дозвольте іншим гравцям запропонувати ідеї та, можливо, отримати бал за карту."
  -
    id: "T02000"
    text: "Розгляньте можливість нараховувати додаткові бали за особливо хороші внески."
  -
    id: "T02010"
    text: "Ви навіть можете грати самостійно."
  -
    id: "T02020"
    text: "Просто використовуйте карти як стимул для роздумів."
  -
    id: "T02030"
    text: "Однак залучення більшої кількості людей буде корисним."
  -
    id: "T02040"
    text: "У рекомендаціях Microsoft щодо EoP шахрайство рекомендується як хороша ігрова стратегія."
  -
    id: "T02600"
    text: "Поширені запитання"
  -
    id: "T02610"
    text: "1. Чи можу я копіювати або редагувати гру?"
  -
    id: "T02620"
    text: "Так, звичайно."
  -
    id: "T02630"
    text: "All OWASP materials are free to do with as you like provided you comply with the Creative Commons Attribution-ShareAlike 4.0 license. "
  -
    id: "T02640"
    text: "Можливо, якщо ви створите нову версію, ви пожертвуєте її проєкту OWASP® Cornucopia?"
  -
    id: "T02650"
    text: "2. Як я можу долучитися?"
  -
    id: "T02660"
    text: "Будь ласка, надсилайте ідеї або пропозиції допомоги до списку розсилки проєкту."
  -
    id: "T02670"
    text: "3. Як обиралися імена зловмисників?"
  -
    id: "T02680"
    text: "EoP починає кожен опис словами на кшталт «Зловмисник може...»."
  -
    id: "T02690"
    text: "але Колін Вотсон використав у Cornucopia особисті імена, які можна розглядати як зовнішніх або внутрішніх людей чи псевдоніми комп’ютерних систем."
  -
    id: "T02700"
    text: "Так само імена у Мобільному виданні відображають аспект спільноти OWASP."
  -
    id: "T02710"
    text: "Тому, окрім «Боба та Меллорі», імена зловмисників взято з імен членів глобальної та європейської рад OWASP 2024 року, працівників OWASP, авторів і учасників OWASP Cornucopia Mobile App Edition та керівників OWASP Chapter у всьому світі."
  -
    id: "T02720"
    text: "Культурне та гендерне різноманіття просто відображає ці джерела імен і"
  -
    id: "T02730"
    text: "не має на меті репрезентувати весь світ."
  -
    id: "T02750"
    text: "4. Чому на лицьових сторонах карт немає зображень?"
  -
    id: "T02760"
    text: "На картах досить багато тексту, а перехресні посилання також займають місце."
  -
    id: "T02770"
    text: "Але було б чудово додати додаткові елементи дизайну."
  -
    id: "T02780"
    text: "Є охочі?"
  -
    id: "T02790"
    text: "5. Чи впорядковані атаки за номером на карті?"
  -
    id: "T02800"
    text: "Лише приблизно."
  -
    id: "T02810"
    text: "Ризик залежить від застосунку та організації через різні вимоги безпеки й відповідності, тому ваша власна оцінка критичності може розташувати карти в іншому порядку, ніж номери на картах."
  -
    id: "T02820"
    text: "6. Скільки часу потрібно, щоб зіграти раунд картами з повної колоди?"
  -
    id: "T02830"
    text: "Це залежить від масштабу застосунку, обсягу обговорення та того, наскільки гравці знайомі з поняттями безпеки застосунків."
  -
    id: "T02840"
    text: "Але для 4–6 людей варто передбачити приблизно 1,5–2 години."
  -
    id: "T02850"
    text: "7. Хто має грати в цю гру?"
  -
    id: "T02860"
    text: "Завжди намагайтеся залучити людей із різними ролями, які можуть запропонувати альтернативні погляди."
  -
    id: "T02870"
    text: "Але обов’язково залучіть когось із достатніми знаннями термінології вразливостей застосунків."
  -
    id: "T02880"
    text: "Також намагайтеся залучити архітекторів, розробників, тестувальників і відповідного керівника проєкту або власника бізнесу."
  -
    id: "T02890"
    text: "8. Хто має робити нотатки та записувати рахунок?"
  -
    id: "T02900"
    text: "Краще, якщо нотатки про визначені вимоги та обговорені питання робитиме хтось інший, хто не грає."
  -
    id: "T02910"
    text: "Це може бути навчанням для молодшого розробника або це може виконувати керівник проєкту."
  -
    id: "T02920"
    text: "Деякі організації роблять запис, щоб переглянути його пізніше, коли вимоги буде оформлено більш формально."
  -
    id: "T02930"
    text: "9. Чи завжди потрібно використовувати повну колоду карт?"
  -
    id: "T02940"
    text: "Ні."
  -
    id: "T02950"
    text: "Меншу колоду можна зіграти швидше."
  -
    id: "T02960"
    text: "Почніть першу гру з кількістю карт, достатньою лише для двох або трьох раундів."
  -
    id: "T02970"
    text: "Завжди розглядайте можливість вилучити карти, які зовсім не відповідають цільовому застосунку або функції, що перевіряється."
  -
    id: "T02980"
    text: "У перші кілька разів зазвичай краще також вилучити тузи та дві карти Джокера."
  -
    id: "T02990"
    text: "Також зазвичай грають без козирної масті, доки учасники краще не ознайомляться з цією ідеєю."
  -
    id: "T03000"
    text: "10. Що мають робити гравці, коли їм трапляється карта туза з написом «вигадано нову X-атаку»?"
  -
    id: "T03010"
    text: "Гравець може вигадати будь-яку атаку, яку вважає дійсною, але вона має відповідати масті карти (наприклад, «Платформа та код»)."
  -
    id: "T03020"
    text: "Для гравців, які ще не знайомі з грою, на початку краще вилучити ці карти (див. також поширене запитання 9)."
  -
    id: "T03850"
    text: "Старанні працівники OWASP."
