---
meta:
  edition: companion
  component: cards
  language: HI
  version: '1.0'
suits:
  - id: LLM
    name: लार्ज लैंग्वेज मॉडल्स
    cards:
      - id: LLM2
        value: 2
        url: https://cornucopia.owasp.org/cards/LLM2
        desc: समंथा भारी-भरकम या रिकर्सिव (recursive) LLM क्वेरी भेजकर सारे कंप्यूटिंग रिसोर्सेज़ को खत्म कर सकती है या खर्च बढ़ा सकती है, जिससे मॉडल डाउन (DoS) हो सकता है।
      - id: LLM3
        value: 3
        url: https://cornucopia.owasp.org/cards/LLM3
        desc: डेव एलएलएम के आउटपुट पर जरूरत से ज्यादा भरोसा (overreliance) करने की कमजोरी का फायदा उठा सकता है जहाँ जरूरी इंसानी देखरेख (human oversight) नहीं होती, जिससे सुरक्षा में चूक हो सकती है या मतिभ्रम (hallucinations) या गलत तर्क के आधार पर गलत फैसले लिए जा सकते हैं।
      - id: LLM4
        value: 4
        url: https://cornucopia.owasp.org/cards/LLM4
        desc: David अपर्याप्त इनपुट और/या आउटपुट फ़िल्टरिंग या प्रॉम्प्ट लीकेज के कारण मॉडल से उसके प्रशिक्षण डेटा, सिस्टम
          प्रॉम्प्ट, कॉन्फ़िगरेशन, सेवाओं या अन्य उपयोगकर्ताओं के संदर्भ से संवेदनशील जानकारी प्रकट करवा सकता है
      - id: LLM5
        value: 5
        url: https://cornucopia.owasp.org/cards/LLM5
        desc: Roy मल्टी-टेनेंट LLM प्रणालियों में कमजोर प्रमाणीकरण, प्राधिकरण, या अनुचित सत्र अलगाव (session isolation) के
          कारण विशेषाधिकार बढ़ा सकता है या अन्य उपयोगकर्ताओं के डेटा और सत्रों तक पहुँच प्राप्त कर सकता है
      - id: LLM6
        value: 6
        url: https://cornucopia.owasp.org/cards/LLM6
        desc: एंडरसन (Andersen) रिट्रीवल नॉलेज बेस (retrieval knowledge bases), वेक्टर डेटाबेस (vector databases), मेटाडेटा (metadata), नीतियों या रिट्रीवल-ऑगमेंटेड जनरेशन (RAG) तथा मॉडल कॉन्टेक्स्ट प्रोटोकॉल (MCP) से जुड़े अन्य स्रोतों में हेरफेर कर सकता है, ताकि मॉडल गलत, पक्षपाती या दुर्भावनापूर्ण जानकारी को तथ्य मानकर प्राप्त करे और प्रस्तुत करे।
      - id: LLM7
        value: 7
        url: https://cornucopia.owasp.org/cards/LLM7
        desc: Tyrell प्रशिक्षण या फाइन-ट्यूनिंग डेटासेट अथवा स्वयं फाइन-ट्यूनिंग प्रक्रिया को दूषित (poison) कर सकता है, जिससे
          बैकडोर या दुर्भावनापूर्ण व्यवहार शामिल हो सकता है जिसे बाद में ट्रिगर किया जा सके
      - id: LLM8
        value: 8
        url: https://cornucopia.owasp.org/cards/LLM9
        desc: Rossum LLM इंटरफ़ेस के माध्यम से संवेदनशील डेटा तक पहुँचने, प्रमाणीकरण को बायपास करने, या अनधिकृत संचालन निष्पादित
          करने के लिए असुरक्षित प्लगइन, MCP सर्वर, या एकीकरण डिज़ाइनों का दुरुपयोग कर सकता है
      - id: LLM9
        value: 9
        url: https://cornucopia.owasp.org/cards/LLM8
        desc: Deckard बाहरी सामग्री जैसे दस्तावेज़ों, ईमेल्स या वेब पेजों में दुर्भावनापूर्ण निर्देश एम्बेड कर सकता है जिन्हें
          मॉडल द्वारा संसाधित किया जाता है, जिससे अनपेक्षित व्यवहार या डेटा एक्सफ़िल्ट्रेशन हो सकता है
      - id: LLMX
        value: 10
        url: https://cornucopia.owasp.org/cards/LLMX
        desc: Sarah तैयार किए गए इनपुट के माध्यम से सिस्टम प्रॉम्प्ट या सुरक्षा निर्देशों को ओवरराइड या हेरफेर कर सकती है,
          जिससे मॉडल अपनी निर्धारित सीमाओं की अनदेखी करता है या अनधिकृत कार्य करता है
      - id: LLMJ
        value: J
        url: https://cornucopia.owasp.org/cards/LLMJ
        desc: रिप्ली (Ripley) आपूर्ति श्रृंखला (supply chain) में ऐसे तीसरे पक्ष के मॉडल (third-party models), एम्बेडिंग (embeddings) या दुर्भावनापूर्ण मशीन लर्निंग (ML) घटक शामिल कर सकता है, जिन्हें हैक किया गया हो या जिनसे छेड़छाड़ की गई हो। इससे छिपी हुई सुरक्षा कमजोरियाँ पैदा हो सकती हैं या डेटा चोरी हो सकता है।
      - id: LLMQ
        value: Q
        url: https://cornucopia.owasp.org/cards/LLMQ
        desc: Kyle मॉडल आउटपुट के असुरक्षित संचालन का फायदा उठा सकता है जिनका उपयोग सीधे डाउनस्ट्रीम सिस्टम में किया जाता
          है, जिससे इंजेक्शन हमले, रिमोट कोड निष्पादन (RCE), या अनधिकृत क्रियाएं संभव हो सकती हैं
      - id: LLMK
        value: K
        url: https://cornucopia.owasp.org/cards/LLMK
        desc: Ava मानवीय अनुमोदन (human-in-the-loop approval) की कमी के कारण अनधिकृत या उच्च जोखिम वाले कार्यों को करने के
          लिए प्लगइन्स, एक्सटेंशन, या अन्य AI घटकों में अत्यधिक एजेंसी या स्वायत्तता का फायदा उठा सकती है
      - id: LLMA
        value: A
        url: https://cornucopia.owasp.org/cards/LLMA
        desc: आपने AI और LLM सुरक्षा के विरुद्ध एक नया हमला खोजा है
        misc: OWASP Gen AI सिक्योरिटी प्रोजेक्ट्स की वेबसाइट पर जाकर AI और LLM के खतरों से बचाव (mitigation) के बारे में और विस्तार से पढ़ें।
  - id: CLD
    name: क्लाउड
    cards:
      - id: CLD2
        value: 2
        url: https://cornucopia.owasp.org/cards/CLD2
        desc: Dan किसी एप्लिकेशन को सौंपी गई अत्यधिक अनुमेय भूमिकाओं (overly permissive roles) का दुरुपयोग करके अपने निर्धारित
          दायरे से बाहर क्लाउड सेवाओं तक पूर्ण पहुँच प्राप्त कर सकता है
      - id: CLD3
        value: 3
        url: https://cornucopia.owasp.org/cards/CLD3
        desc: Roupe सार्वजनिक रूप से सुलभ क्लाउड स्टोरेज का पता लगा सकता है और सीधे इंटरनेट से संवेदनशील ग्राहक डेटा डाउनलोड
          कर सकता है
      - id: CLD4
        value: 4
        url: https://cornucopia.owasp.org/cards/CLD4
        desc: Ryan ऑडिट लॉग और सुरक्षा निगरानी के अभाव का फायदा उठाकर अलर्ट ट्रिगर किए बिना महत्वपूर्ण क्लाउड सेवाओं के भीतर
          काम कर सकता है
      - id: CLD5
        value: 5
        url: https://cornucopia.owasp.org/cards/CLD5
        desc: जोश (Josh) असुरक्षित बिल्ड वेरिएबल्स (build variables) का फायदा उठाकर क्लाउड के बिल्ड या डिप्लॉयमेंट पाइपलाइन (build or deployment pipeline) में दुर्भावनापूर्ण कोड डाल सकता है।
      - id: CLD6
        value: 6
        url: https://cornucopia.owasp.org/cards/CLD6
        desc: मोनिका (Monica) कमज़ोर सुरक्षा वाले क्लाउड API (cloud API) का फायदा उठाकर क्लाउड संसाधनों की सूची तैयार कर सकती है और बैकएंड क्लाउड सेवाओं में बदलाव कर सकती है।
      - id: CLD7
        value: 7
        url: https://cornucopia.owasp.org/cards/CLD7
        desc: जॉन (Jon) किसी हैक किए गए कंटेनर (container) से बाहर निकलकर उसके नीचे चल रहे क्लाउड होस्ट (cloud host) तक पहुँच सकता है।
      - id: CLD8
        value: 8
        url: https://cornucopia.owasp.org/cards/CLD8
        desc: Siddharth पहुँच अलगाव (access isolation) के बिना एक साझा क्लाउड खाते का फायदा उठा सकता है, और कई उत्पादों से
          संबंधित संसाधनों की पहचान और पहुँच के लिए मेटाडेटा और टैग का उपयोग कर सकता है
      - id: CLD9
        value: 9
        url: https://cornucopia.owasp.org/cards/CLD9
        desc: आकाश (Akash) मौजूदा भरोसे के संबंधों (trust relationships) का फायदा उठाकर एक हैक किए गए क्लाउड खाते से आगे बढ़ते हुए कई जुड़े हुए परिवेशों (environments) तक पहुँच बना सकता है।
      - id: CLDX
        value: 10
        url: https://cornucopia.owasp.org/cards/CLDX
        desc: Adrian वर्शन कंट्रोल में बैकडोर युक्त इन्फ्रास्ट्रक्चर-एज-कोड (IaC) टेम्प्लेट शामिल कर सकता है, जिससे बड़े पैमाने
          पर असुरक्षित क्लाउड परिवेश तैनात हो सकते हैं
      - id: CLDJ
        value: J
        url: https://cornucopia.owasp.org/cards/CLDJ
        desc: माइकल (Michael) किसी बिल्ड रनर (build runner) को हैक करके कंटेनर इमेज (container images) में दुर्भावनापूर्ण कोड डाल सकता है। ये इमेज अपने-आप सभी क्लाउड क्लस्टरों (cloud clusters) के प्रोडक्शन वातावरण (production environment) में तैनात की जा सकती हैं।
      - id: CLDQ
        value: Q
        url: https://cornucopia.owasp.org/cards/CLDQ
        desc: Eleftherios साझा पहचानों, पाइपलाइनों और सीक्रेट्स का दुरुपयोग करके एक क्लाउड सेवा में सेंधमारी का लाभ उठाकर
          दूसरी सेवा में स्थानांतरित (pivot) हो सकता है
      - id: CLDK
        value: K
        url: https://cornucopia.owasp.org/cards/CLDK
        desc: डेनिएल (Daniele) क्लाउड के रूट खाते (root account) या आपातकालीन पहुँच वाले ब्रेक-ग्लास खाते (break-glass account) को हैक करके बिलिंग (billing), पहचान प्रबंधन (identity management) और रिकवरी तंत्र (recovery mechanisms) पर ऐसा नियंत्रण हासिल कर सकता है, जिसे वापस लेना संभव न हो।
      - id: CLDA
        value: A
        url: https://cornucopia.owasp.org/cards/CLDA
        desc: आपने क्लाउड के विरुद्ध एक नया हमला खोजा है
        misc: क्लाउड ऐप्लिकेशन (cloud applications) के जोखिम विश्लेषण और थ्रेट मॉडलिंग (threat modeling) की जानकारी के लिए OWASP क्लाउड आर्किटेक्चर सिक्योरिटी चीट शीट (Cloud Architecture Security Cheat Sheet) पढ़ें। क्लाउड ऐप्लिकेशन की खेल-आधारित थ्रेट मॉडलिंग के लिए OWASP क्यूमुलस (Cumulus) भी देखें।
  - id: FRE
    name: फ़्रंटएंड
    cards:
      - id: FRE2
        value: 2
        url: https://cornucopia.owasp.org/cards/FRE2
        desc: Marcus क्लाइंट-साइड सत्यापन को बायपास करता है और बैकएंड API को सीधे विकृत या दुर्भावनापूर्ण इनपुट भेजता है,
          जिससे लॉजिक त्रुटियां, मानवीय गलतियां और प्रयोज्य (usability) समस्याएं उत्पन्न होती हैं
      - id: FRE3
        value: 3
        url: https://cornucopia.owasp.org/cards/FRE3
        desc: Lena संवेदनशील या गोपनीय जानकारी तक पहुँच प्राप्त कर सकती है क्योंकि यह लॉगआउट के बाद या क्लाइंट सत्र समाप्त
          होने (या समाप्त हो जाने चाहिए थे) पर नहीं हटाई जाती है
      - id: FRE4
        value: 4
        url: https://cornucopia.owasp.org/cards/FRE4
        desc: James उपयोगकर्ता-नियंत्रित डेटा के माध्यम से जावास्क्रिप्ट इंजेक्ट करता है जिसे बिना उपयुक्त सैनिटाइजेशन या
          एन्कोडिंग के सीधे DOM में लिखा जाता है
      - id: FRE5
        value: 5
        url: https://cornucopia.owasp.org/cards/FRE5
        desc: विक्टर (Victor) सामग्री वितरण नेटवर्क (CDN) से लोड की गई किसी तीसरे पक्ष की स्क्रिप्ट (third-party script) में छेड़छाड़ कर सकता है या उसे बदल सकता है और उसके ज़रिए हर उपयोगकर्ता के ब्राउज़र में दुर्भावनापूर्ण कोड (malicious code) चला सकता है।
      - id: FRE6
        value: 6
        url: https://cornucopia.owasp.org/cards/FRE6
        desc: ओल्गा (Olga) दुर्भावनापूर्ण जावास्क्रिप्ट (malicious JavaScript) का इस्तेमाल करके प्रमाणीकरण टोकन (authentication tokens) चुरा सकती है और उपयोगकर्ताओं के सक्रिय सत्रों (active sessions) पर कब्ज़ा कर सकती है। इस तरह वह बिना सही लॉगिन विवरण के भी उनके खातों तक पहुँच हासिल कर सकती है।
      - id: FRE7
        value: 7
        url: https://cornucopia.owasp.org/cards/FRE7
        desc: कार्लोस (Carlos) क्रॉस-ओरिजिन रिसोर्स शेयरिंग (CORS) की गलत कॉन्फ़िगरेशन, पोस्ट-मैसेज (postMessage) के असुरक्षित प्रबंधन या फ्रंटएंड की अन्य सुरक्षा कमजोरियों का फायदा उठाकर किसी दुर्भावनापूर्ण स्रोत से संवेदनशील फ्रंटएंड डेटा पढ़ सकता है या उसमें बदलाव कर सकता है।
      - id: FRE8
        value: 8
        url: https://cornucopia.owasp.org/cards/FRE8
        desc: नाथन (Nathan) फ्रंटएंड जावास्क्रिप्ट (JavaScript) में छेड़छाड़ करके प्रतिबंधित सुविधाओं (restricted features) को चालू कर सकता है या ऐसे डेटा तक पहुँच सकता है, जिसके लिए सर्वर की ओर से अनुमति (authorization) मिलना ज़रूरी है।
      - id: FRE9
        value: 9
        url: https://cornucopia.owasp.org/cards/FRE9
        desc: सोफिया (Sophia) JSON वेब टोकन (JWT) या एक्सेस टोकन का दोबारा इस्तेमाल करके, उनका अनुमान लगाकर या जाली टोकन बनाकर किसी दूसरे उपयोगकर्ता का रूप धारण (impersonate) कर सकती है और उसके सक्रिय सत्र (active session) पर कब्ज़ा कर सकती है।
      - id: FREX
        value: 10
        url: https://cornucopia.owasp.org/cards/FREX
        desc: पिओत्र (Piotr) ऐप्लिकेशन को किसी छिपे हुए या भ्रामक फ्रेम (frame) में दिखाकर उपयोगकर्ताओं को ऐसे उपयोगकर्ता इंटरफ़ेस (UI) तत्वों पर क्लिक करने के लिए धोखा दे सकता है, जो संवेदनशील कार्रवाइयाँ करते हैं।
      - id: FREJ
        value: J
        url: https://cornucopia.owasp.org/cards/FREJ
