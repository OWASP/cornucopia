        value: A
        url: https://cornucopia.owasp.org/cards/AAIA
        desc: आपने एक ऐसे हमले की पहचान की है जो अंतर्निहित एजेंटिक एआई (Agentic AI) कार्यक्षमता या संबंधित डिज़ाइन दोष का
          दुरुपयोग करता है
        misc: OWASP जेन एआई सिक्योरिटी प्रोजेक्ट्स (Gen AI Security Projects) में बताए गए खतरों और उनसे बचाव के तरीकों (mitigations) के बारे में और पढ़ें।
paragraphs:
  - id: Common
    name: सामान्य
    sentences:
      - id: Title
        text: Companion Edition v1.0 (HI)
      - id: T00010
        text: Cornucopia विस्तार पैक
      - id: T00020
        text: लेखक
      - id: T00100
        text: आभार
      - id: T00110
        text: 'Cornucopia दुनिया भर के स्वयंसेवकों की एक टीम द्वारा विकसित, अनुरक्षित, अद्यतन और प्रचारित किया जाता है। उनके
          बिना, Cornucopia संभव नहीं होता। इसके अलावा, हम उनके योगदान और प्रेरणा के लिए निम्नलिखित लोगों और परियोजनाओं को
          धन्यवाद देना चाहते हैं:'
      - id: T00120
        text: Adam Shostack और Microsoft SDL टीम को “Elevation of Privilege Threat Modelling Game” के लिए, जो Creative Commons
          Attribution लाइसेंस के तहत प्रकाशित हुआ, Cornucopia के लिए प्रेरणा के रूप में और जिससे कई विचार, विशेष रूप से गेम
          थ्योरी, लिए गए थे।
      - id: T00130
        text: OWASP परियोजनाओं के सभी परियोजना नेताओं और योगदानकर्ताओं को जिन्होंने OWASP Top 10, OWASP AISVS और OWASP GenAI
          Security परियोजना को मूल्यवान इनपुट और मार्गदर्शन प्रदान किया है। हम Mitre के Common Attack Pattern Enumeration
          and Classification (CAPEC™) और Mitre Atlas™ के लोगों और योगदानकर्ताओं को, और Cloud Security Alliance को Cloud Controls
          Matrix के उपयोग के लिए भी धन्यवाद देना चाहते हैं, जो सभी प्रदान किए गए क्रॉस-रेफरेंस में उपयोग किए जाते हैं।
      - id: T00140
        text: सभी पिछले योगदानकर्ताओं, समर्थकों, प्रायोजकों और स्वयंसेवकों को जिन्होंने वर्षों से OWASP Cornucopia परियोजना
          में योगदान और समर्थन दिया है।
      - id: T00150
        text: OWASP® Cornucopia उपयोग करने के लिए निःशुल्क है। यह Creative Commons Attribution-ShareAlike 4.0 लाइसेंस के तहत
          लाइसेंस प्राप्त है, इसलिए आप इस काम को कॉपी, वितरित और प्रसारित कर सकते हैं, और आप इसे अनुकूलित कर सकते हैं, और
          व्यावसायिक रूप से इसका उपयोग कर सकते हैं, लेकिन इस शर्त पर कि आप काम का श्रेय दें और यदि आप इस काम को बदलते हैं,
          रूपांतरित करते हैं, या इस पर निर्माण करते हैं, तो आप परिणामी कार्य को केवल इसी या इसके समान लाइसेंस के तहत वितरित
          कर सकते हैं।
      - id: T00160
        text: © 2012-2026 OWASP Foundation. सर्वाधिकार सुरक्षित।
      - id: T00200
        text: परिचय
      - id: T00210
        text: कंपैनियन डेक में कई वैकल्पिक सूट (sets) शामिल हैं। इनमें से प्रत्येक सूट एप्लिकेशन सुरक्षा के एक विशिष्ट विषय पर केंद्रित है और इसे मौजूदा OWASP कॉर्नुकॉपिया वेबसाइट ऐप (Website App) तथा मोबाइल ऐप (Mobile App) संस्करणों (Editions) के साथ उपयोग के लिए डिज़ाइन किया गया है। थ्रेट मॉडलिंग (Threat Modeling) के दौरान किसी विशिष्ट विषय पर विशेष ध्यान देने के लिए, कंपैनियन डेक का कोई भी सूट मौजूदा वेबसाइट ऐप संस्करण के किसी एक सूट की जगह ले सकता है या उसके पूरक के रूप में (साथ में) इस्तेमाल किया जा सकता है। कंपैनियन डेक के इन सूटों को कॉर्नुकॉपिया सूट के विकल्प के रूप में ट्रम्प (Trump / प्रभावी कार्ड) की तरह भी इस्तेमाल किया जा सकता है।
      - id: T00220
        text: उदाहरण के लिए, मान लें कि आप एक LLM एप्लिकेशन बना रहे हैं और LLM और वेब पर केंद्रित थ्रेट मॉडलिंग करना चाहते
          हैं। यदि ऐसा है, तो आप अपने चुने हुए OWASP Cornucopia फोकस क्षेत्र के रूप में OWASP Cornucopia वेबसाइट ऐप संस्करण
          और LLM कंपैनियन सूट का उपयोग कर सकते हैं।
      - id: T00230
        text: कॉर्नुकॉपिया कंपैनियन डेक (Cornucopia Companion Deck) के अलग-अलग सूटों (suits) के कार्डों में दिखाए गए हमले, OWASP की विभिन्न परियोजनाओं और अन्य स्रोतों से जुड़ी एप्लिकेशन सुरक्षा (AppSec) संबंधी आवश्यकताओं को सामने लाते हैं। ये कार्ड OWASP फाउंडेशन (OWASP Foundation) की 25वीं वर्षगाँठ का जश्न भी मनाते हैं। अपनी एप्लिकेशन सुरक्षा को किस्मत के भरोसे न छोड़ें—उसकी सुरक्षा के लिए इन कार्डों के साथ खेलें!
      - id: T00300
        text: कार्ड डेक (पैक)
      - id: T00310
        text: 'एजेंटिक एआई (AAI):'
      - id: T00315
        text: इसमें OWASP Agentic Top 10 और Mitre Atlas™ द्वारा कवर किए गए खतरे शामिल हैं। इस सूट का उपयोग तब किया जाना चाहिए
          जब ऐसे एप्लिकेशन विकसित किए जा रहे हों जो एजेंटिक क्षमताओं का उपयोग करते हैं।
      - id: T00320
        text: OWASP Top 10 for Agentic Applications 2026 एक विश्व स्तर पर सहकर्मी-समीक्षित ढांचा है जो स्वायत्त और एजेंटिक
          AI प्रणालियों के सामने आने वाले सबसे महत्वपूर्ण सुरक्षा जोखिमों की पहचान करता है। 100 से अधिक उद्योग विशेषज्ञों,
          शोधकर्ताओं और चिकित्सकों के साथ व्यापक सहयोग के माध्यम से विकसित, यह सूची संगठनों को जटिल वर्कफ़्लो में योजना बनाने,
          कार्य करने और निर्णय लेने वाले AI एजेंटों को सुरक्षित करने में मदद करने के लिए व्यावहारिक, कार्रवाई योग्य मार्गदर्शन
          प्रदान करती है।
      - id: T00330
        text: 'स्वचालित खतरे (BOT):'
      - id: T00335
        text: इसमें वेब अनुप्रयोगों के लिए OWASP Automated Threats द्वारा कवर किए गए खतरे शामिल हैं।
      - id: T00340
        text: वेब ऐप्लिकेशन्स को हर दिन अवांछित स्वचालित गतिविधियों का सामना करना पड़ता है। अक्सर ये गतिविधियाँ ऐप्लिकेशन की अपनी वैध सुविधाओं (legitimate features) के दुरुपयोग (abuse) से जुड़ी होती हैं, न कि उन सुरक्षा कमजोरियों का फायदा उठाने की कोशिश से, जिनका अभी तक समाधान नहीं किया गया है। इसके अलावा, इस तरह के अत्यधिक दुरुपयोग को अक्सर गलती से ऐप्लिकेशन पर सेवा-अस्वीकृति हमला (Denial of Service - DoS) मान लिया जाता है, जबकि वास्तव में DoS हमलावर का मुख्य उद्देश्य नहीं, बल्कि दुरुपयोग का एक दुष्परिणाम (consequence) होता है। यह प्रोजेक्ट हमलावरों के इन इरादों को सूचीबद्ध करता है।
      - id: T00350
        text: 'क्लाउड (CLD):'
      - id: T00355
        text: इसमें MITRE ATT&CK® से खतरे शामिल हैं, विशेष रूप से वे जो क्लाउड अनुप्रयोगों को प्रभावित करते हैं। जब निर्माणाधीन
          एप्लिकेशन क्लाउड-आधारित हो, तो एप्लिकेशन के क्लाउड पहलुओं को कवर करने के लिए इस सूट का उपयोग किया जा सकता है। क्लाउड
          अनुप्रयोगों के अधिक गहन थ्रेट मॉडलिंग के लिए, आप OWASP Cumulus का उपयोग कर सकते हैं, जिसे आप copi.owasp.org पर ऑनलाइन
          खेल सकते हैं।
      - id: T00360
        text: 'डेवऑप्स (DVO):'
      - id: T00365
        text: उन टीमों पर लागू होने वाले खतरों को कवर करता है जो विकास, डिप्लॉयमेंट और कुछ हद तक अपने अनुप्रयोगों के संचालन
          दोनों के लिए जिम्मेदार हैं। यह आपूर्ति श्रृंखला जोखिमों, अधिग्रहण और डिप्लॉयमेंट से संबंधित CAPECs™ को कवर करता
          है।
      - id: T00370
        text: 'फ़्रंटएंड (FRE):'
      - id: T00375
        text: इसमें OWASP Top 10 Client-Side Security Risks और OWASP Top 10 के खतरे शामिल हैं। यह सूट Angular, Electron, और
          React अनुप्रयोगों के लिए है जो पूरी तरह से फ़्रंटएंड हो सकते हैं या एक पतली बैकएंड परत के साथ बनाए गए हैं।
      - id: T00380
        text: 'लार्ज लैंग्वेज मॉडल्स (LLM):'
      - id: T00385
        text: यह OWASP Top 10 for Large Language Model Applications पर आधारित है। इस सूट का उपयोग LLM के साथ एकीकृत करने के
          लिए किया जा सकता है। यह प्रशिक्षण और ट्यूनिंग से संबंधित बुनियादी खतरों को भी कवर करता है। मशीन लर्निंग पहलुओं के
          संबंध में LLM के अधिक गहन थ्रेट मॉडलिंग के लिए, कृपया एक अलग सत्र करें और Elevation of MLSec का उपयोग करें, जिसे
          आप copi.owasp.org पर ऑनलाइन खेल सकते हैं।
      - id: T00400
        text: कार्ड का उपयोग कैसे करें
      - id: T00410
        text: "विकास के दायरे (development scope) के अनुसार वे सूट चुनें जिनका आप इस्तेमाल करना चाहते हैं। अगर किसी सूट को लेकर संदेह हो, तो हर सूट की जानकारी के लिए पिछला अनुभाग पढ़ें। थ्रेट मॉडलिंग सत्र (threat modeling session) से पहले ही विकास का दायरा तय कर लेना बेहतर होता है, ताकि टीम को पता हो कि सत्र से पहले तैयार किए जाने वाले डेटा फ्लो डायग्राम (Data Flow Diagram - DFD) में किन घटकों (components) को शामिल करना है। इससे हम यह तय कर पाएँगे:"
      - id: T00415
        text: हम किस पर काम कर रहे हैं?
      - id: T00420
        text: अपने मुख्य डेक (या तो वेबसाइट ऐप या मोबाइल ऐप डेक) से किसी भी सूट को बाहर करने और इसके बजाय कंपैनियन डेक के सूट का उपयोग करने के लिए स्वतंत्र महसूस करें। आप सभी सूटों के अतिरिक्त कंपैनियन सूट का उपयोग करना भी चुन सकते हैं या कॉर्नुकॉपिया सूट की तरह ही एक विशिष्ट कंपैनियन सूट को ट्रम्प (Trump / प्रभावी कार्ड) के रूप में खेल सकते हैं। सुनिश्चित करें कि आप पहले से स्पष्ट कर लें कि कौन सा सूट ट्रम्प (Trump / प्रभावी कार्ड) है, यदि कोई है।
      - id: T00430
        text: 'सुनिश्चित करें कि टीम खेलने से पहले Cornucopia के नियमों को जानती है। यदि संदेह है, तो OWASP Cornucopia वेबसाइट
          पर कार्ड के साथ खेलने के सामान्य निर्देश पढ़ें:'
      - id: T00500
        text: मैपिंग्स
      - id: T00510
        text: 'प्रत्येक कार्ड में एक QR कोड होता है। QR कोड आपको यहाँ ले जाता है:'
      - id: T00520
        text: वहाँ, आपको कार्ड से संबंधित एक ठोस खतरे का उदाहरण मिलेगा। इसके अलावा, आपको इसके बारे में भी जानकारी मिलेगी
      - id: T00530
        text: कौन सी STRIDE श्रेणी लागू है और क्यों?
      - id: T00540
        text: 'इसका उत्तर:'
      - id: T00545
        text: क्या गलत हो सकता है?
      - id: T00550
        text: 'इसका उत्तर:'
      - id: T00555
        text: हम इसके बारे में क्या करने जा रहे हैं?
      - id: T00560
        text: उपरोक्त प्रश्नों से संबंधित आवश्यकताएं।
      - id: T00570
        text: "ऊपर दिए गए प्रश्नों से जुड़ी आवश्यकताएँ मैपिंग (requirements mapping) में शामिल होती हैं। मैपिंग में आम तौर पर खतरे और उनसे जुड़ी आवश्यकताएँ दी जाती हैं। खतरे आपको कार्ड को समझने में मदद करते हैं, जबकि आवश्यकताएँ यह जाँचने में मदद करती हैं कि उन खतरों से उचित बचाव (mitigation) किया गया है या नहीं। थ्रेट मॉडलिंग और आवश्यकताओं के विश्लेषण (requirements analysis), दोनों के लिए ये महत्वपूर्ण हैं। इसके अलावा, पिछले थ्रेट मॉडलिंग सत्रों में किए गए काम की समीक्षा करें और पहले पहचाने गए खतरों पर फिर से विचार करें। इसके लिए मैपिंग को दोबारा देखें। क्या मैपिंग में ऐसे कोई खतरे दिए गए हैं जिन्हें आप पहले पहचान नहीं पाए थे? क्या आपने उन खतरों से जुड़ी सभी आवश्यकताओं को लागू करके उनकी जाँच भी की है? इन सवालों के जवाब देने से आखिरी सवाल का जवाब मिल सकेगा:"
      - id: T00575
        text: क्या हमने अच्छा काम किया?
      - id: T01000
        text: प्रतिक्रिया दें
      - id: T01010
        text: यदि आपके पास OWASP® Cornucopia के उपयोग पर कोई विचार या प्रतिक्रिया है, तो कृपया उन्हें साझा करें।
      - id: T01020
        text: और भी बेहतर होगा यदि आप कार्ड के वैकल्पिक संस्करण बनाते हैं, या पेशेवर प्रिंट-रेडी संस्करण तैयार करते हैं, तो
          कृपया इसे इस संस्करण को बनाने वाले स्वयंसेवकों और व्यापक एप्लिकेशन विकास और एप्लिकेशन सुरक्षा समुदाय के साथ साझा
          करें।
