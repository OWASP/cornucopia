---
meta:
  edition: "eop"
  component: "cards"
  language: "FA"
  version: "5.0"
suits:
-
  id: "SP"
  name: "جعل هویت"
  cards:
    -
      id: "SP2"
      value: "2"
      desc: "یک مهاجم می‌تواند پورت یا سوکتی را که سرور معمولاً از آن استفاده می‌کند در اختیار بگیرد"
    -
      id: "SP3"
      value: "3"
      desc: "یک مهاجم می‌تواند یکی پس از دیگری اعتبارنامه‌ها را امتحان کند و چیزی برای کند کردن او وجود ندارد (آنلاین یا آفلاین)"
    -
      id: "SP4"
      value: "4"
      desc: "یک مهاجم می‌تواند به‌صورت ناشناس متصل شود، زیرا انتظار داریم احراز هویت در سطحی بالاتر انجام شود"
    -
      id: "SP5"
      value: "5"
      desc: "یک مهاجم می‌تواند یک کلاینت را گیج کند، زیرا راه‌های بسیار زیادی برای شناسایی یک سرور وجود دارد"
    -
      id: "SP6"
      value: "6"
      desc: "یک مهاجم می‌تواند خود را جای یک سرور جا بزند، زیرا شناسه‌ها روی کلاینت ذخیره نمی‌شوند و هنگام اتصال مجدد از نظر سازگاری بررسی نمی‌شوند (یعنی ماندگاری کلید وجود ندارد)"
    -
      id: "SP7"
      value: "7"
      desc: "یک مهاجم می‌تواند از طریق پیوندی که احراز هویت (و رمزگذاری) نشده است به یک سرور یا همتا متصل شود"
    -
      id: "SP8"
      value: "8"
      desc: "یک مهاجم می‌تواند اعتبارنامه‌های ذخیره‌شده روی سرور را بدزدد و دوباره استفاده کند (برای مثال، کلیدی در فایلی ذخیره شده که برای همه قابل خواندن است)"
    -
      id: "SP9"
      value: "9"
      desc: "یک مهاجم که رمز عبوری به دست آورد می‌تواند دوباره از آن استفاده کند (از احراز هویت‌کننده‌های قوی‌تر استفاده کنید)"
    -
      id: "SPX"
      value: "10"
      desc: "یک مهاجم می‌تواند استفاده از احراز هویت ضعیف‌تر یا بدون احراز هویت را انتخاب کند"
    -
      id: "SPJ"
      value: "J"
      desc: "یک مهاجم می‌تواند اعتبارنامه‌های ذخیره‌شده روی کلاینت را بدزدد و دوباره استفاده کند"
    -
      id: "SPQ"
      value: "Q"
      desc: "یک مهاجم می‌تواند به روش به‌روزرسانی یا بازیابی اعتبارنامه‌ها حمله کند (بازیابی حساب نیازی به افشای رمز عبور قدیمی ندارد)"
    -
      id: "SPK"
      value: "K"
      desc: "سامانه شما با یک رمز عبور مدیر پیش‌فرض عرضه می‌شود و تغییر آن را اجباری نمی‌کند"
    -
      id: "SPA"
      value: "A"
      desc: "شما یک حمله جدید جعل هویت ابداع کرده‌اید"
      misc: "درباره این موضوع بیشتر بخوانید ..."
-
  id: "TA"
  name: "دستکاری"
  cards:
    -
      id: "TA2"
      value: "2"
      desc: "یک مهاجم می‌تواند از تبادل کلید یا کنترل یکپارچگی سفارشی شما که به‌جای رمزنگاری استاندارد ساخته‌اید سوءاستفاده کند"
    -
      id: "TA3"
      value: "3"
      desc: "یک مهاجم می‌تواند سامانه ساخت شما را تغییر دهد و نسخه‌های امضاشده‌ای از نرم‌افزار شما تولید کند"
    -
      id: "TA4"
      value: "4"
      desc: "کد شما تصمیم‌های کنترل دسترسی را در همه جا می‌گیرد، نه با یک هسته امنیتی"
    -
      id: "TA5"
      value: "5"
      desc: "یک مهاجم می‌تواند داده‌ها را بدون تشخیص بازپخش کند، زیرا کد شما زمان‌مهر یا شماره ترتیب فراهم نمی‌کند"
    -
      id: "TA6"
      value: "6"
      desc: "یک مهاجم می‌تواند در یک مخزن داده‌ای که کد شما به آن متکی است بنویسد"
    -
      id: "TA7"
      value: "7"
      desc: "یک مهاجم می‌تواند مجوزها را دور بزند، زیرا پیش از بررسی مجوزهای دسترسی، نام‌ها را به شکل متعارف (canonical) درنمی‌آورید"
    -
      id: "TA8"
      value: "8"
      desc: "یک مهاجم می‌تواند داده‌ها را دستکاری کند، زیرا برای داده‌های روی شبکه حفاظت یکپارچگی وجود ندارد"
    -
      id: "TA9"
      value: "9"
      desc: "یک مهاجم می‌تواند اطلاعات وضعیت را فراهم یا کنترل کند"
    -
      id: "TAX"
      value: "10"
      desc: "یک مهاجم می‌تواند اطلاعات یک مخزن داده را تغییر دهد، زیرا مجوزهای ضعیف/باز دارد یا شامل گروهی است که معادل همه است («هر کسی که حساب فیس‌بوک دارد»)"
    -
      id: "TAJ"
      value: "J"
      desc: "یک مهاجم می‌تواند روی یک منبع بنویسد، زیرا مجوزها برای همه داده شده یا هیچ ACL وجود ندارد"
    -
      id: "TAQ"
      value: "Q"
      desc: "یک مهاجم می‌تواند پارامترها را از روی یک مرز اعتماد و پس از اعتبارسنجی تغییر دهد (برای مثال، پارامترهای مهم در یک فیلد پنهان HTML، یا ارسال یک اشاره‌گر به حافظه حیاتی)"
    -
      id: "TAK"
      value: "K"
      desc: "یک مهاجم می‌تواند از طریق یک نقطه توسعه (extension point) کد را داخل فرایند شما بارگذاری کند"
    -
      id: "TAA"
      value: "A"
      desc: "شما یک حمله جدید دستکاری ابداع کرده‌اید"
      misc: "درباره این موضوع بیشتر بخوانید ..."
-
  id: "RE"
  name: "انکار"
  cards:
    -
      id: "RE2"
      value: "2"
      desc: "یک مهاجم می‌تواند داده‌ها را از طریق لاگ عبور دهد تا به خواننده لاگ حمله کند، و مستنداتی درباره اینکه چه نوع اعتبارسنجی‌هایی انجام می‌شود وجود ندارد"
    -
      id: "RE3"
      value: "3"
      desc: "یک مهاجم کم‌امتیاز می‌تواند اطلاعات امنیتی جالب را در لاگ‌ها بخواند"
    -
      id: "RE4"
      value: "4"
      desc: "یک مهاجم می‌تواند امضاهای دیجیتال را تغییر دهد، زیرا سامانه امضای دیجیتالی که پیاده‌سازی می‌کنید ضعیف است یا به‌جای امضا از MAC استفاده می‌کند"
    -
      id: "RE5"
      value: "5"
      desc: "یک مهاجم می‌تواند پیام‌های لاگ را روی شبکه تغییر دهد، زیرا کنترل‌های یکپارچگی قوی ندارند"
    -
      id: "RE6"
      value: "6"
      desc: "یک مهاجم می‌تواند یک ورودی لاگ بدون زمان‌مهر ایجاد کند (یا هیچ ورودی لاگی زمان‌مهر ندارد)"
    -
      id: "RE7"
      value: "7"
      desc: "یک مهاجم می‌تواند باعث شود لاگ‌ها دور بزنند (wrap around) و داده‌ها از دست بروند"
    -
      id: "RE8"
      value: "8"
      desc: "یک مهاجم می‌تواند باعث شود یک لاگ اطلاعات امنیتی را از دست بدهد یا آن را مخدوش کند"
    -
      id: "RE9"
      value: "9"
      desc: "یک مهاجم می‌تواند از یک کلید مشترک برای احراز هویت به‌عنوان اصل‌های مختلف استفاده کند و اطلاعات لاگ‌ها را مخدوش کند"
    -
      id: "REX"
      value: "10"
      desc: "یک مهاجم می‌تواند بدون اعتبارسنجی، داده‌های دلخواه را از افراد بیرونی بدون احراز هویت (یا با احراز هویت ضعیف) وارد لاگ‌ها کند"
    -
      id: "REJ"
      value: "J"
      desc: "یک مهاجم می‌تواند لاگ‌ها را ویرایش کند و راهی برای تشخیص آن وجود ندارد (شاید چون سامانه لاگ‌گیری گزینه heartbeat ندارد)"
    -
      id: "REQ"
      value: "Q"
      desc: "یک مهاجم می‌تواند بگوید «من این کار را نکردم» و شما راهی برای اثبات نادرستی گفته او ندارید"
    -
      id: "REK"
      value: "K"
      desc: "سامانه هیچ لاگی ندارد"
    -
      id: "REA"
      value: "A"
      desc: "شما یک حمله جدید انکار ابداع کرده‌اید"
      misc: "درباره این موضوع بیشتر بخوانید ..."
-
  id: "ID"
  name: "افشای اطلاعات"
  cards:
    -
      id: "ID2"
      value: "2"
      desc: "یک مهاجم می‌تواند رمزگذاری فایل را با حمله brute-force بشکند، زیرا هیچ دفاعی وجود ندارد (دفاع نمونه: password stretching)"
    -
      id: "ID3"
      value: "3"
      desc: "یک مهاجم می‌تواند پیام‌های خطا با محتوای حساس امنیتی را ببیند"
    -
      id: "ID4"
      value: "4"
      desc: "یک مهاجم می‌تواند محتوا را بخواند، زیرا پیام‌ها (مثلاً یک ایمیل یا کوکی HTTP) رمزگذاری نشده‌اند، حتی اگر کانال رمزگذاری شده باشد"
    -
      id: "ID5"
      value: "5"
      desc: "یک مهاجم ممکن است بتواند سندی یا داده‌ای را بخواند، زیرا با یک الگوریتم غیراستاندارد رمزگذاری شده است"
    -
      id: "ID6"
      value: "6"
      desc: "یک مهاجم می‌تواند داده‌ای را بخواند، زیرا پنهان یا پوشیده شده است (برای واگرد یا ردیابی تغییرات) و ممکن است کاربر فراموش کند که وجود دارد"
    -
      id: "ID7"
      value: "7"
      desc: "یک مهاجم می‌تواند به‌عنوان «مرد میانی» (man in the middle) عمل کند، زیرا نقاط پایانی یک اتصال شبکه را احراز هویت نمی‌کنید"
    -
      id: "ID8"
      value: "8"
      desc: "یک مهاجم می‌تواند از طریق یک نمایه‌ساز جست‌وجو، لاگ‌گیر یا سازوکاری مشابه به اطلاعات دسترسی پیدا کند"
    -
      id: "ID9"
      value: "9"
      desc: "یک مهاجم می‌تواند اطلاعات حساس را در فایلی با مجوزهای آزاد بخواند"
    -
      id: "IDX"
      value: "10"
      desc: "یک مهاجم می‌تواند اطلاعات را در فایل‌ها یا پایگاه‌های داده بدون کنترل دسترسی بخواند"
    -
      id: "IDJ"
      value: "J"
      desc: "یک مهاجم می‌تواند کلید ثابتی را که برای رمزگذاری استفاده می‌شود کشف کند"
    -
      id: "IDQ"
      value: "Q"
      desc: "یک مهاجم می‌تواند کل کانال را بخواند، زیرا کانال (مثلاً HTTP یا SMTP) رمزگذاری نشده است"
    -
      id: "IDK"
      value: "K"
      desc: "یک مهاجم می‌تواند اطلاعات شبکه را بخواند، زیرا هیچ رمزنگاری‌ای استفاده نمی‌شود"
    -
      id: "IDA"
      value: "A"
      desc: "شما یک حمله جدید افشای اطلاعات ابداع کرده‌اید"
      misc: "درباره این موضوع بیشتر بخوانید ..."
