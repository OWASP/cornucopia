      desc: "یک مهاجم می‌تواند دستوری تزریق کند که سامانه آن را با سطح امتیاز بالاتر اجرا می‌کند"
    -
      id: "EPA"
      value: "A"
      desc: "شما یک حمله جدید ارتقای امتیاز ابداع کرده‌اید"
      misc: "درباره این موضوع بیشتر بخوانید ..."
paragraphs:
-
  id: "Common"
  name: "Common"
  sentences:
  -
    id: "Title"
    text: "ارتقای امتیاز"
  -
    id: "T00001"
    text: "درباره"
  -
    id: "T00002"
    text: "مدل‌سازی تهدید"
  -
    id: "T00003"
    text: "توسعه امن"
  -
    id: "T00004"
    text: "چرخه عمر"
  -
    id: "T00010"
    text: "بازی ارتقای امتیاز (Elevation of Privilege) طراحی شده است تا آسان‌ترین راه برای شروع نگاه به طراحی شما از دیدگاه امنیتی باشد. این یکی از روش‌های مدل‌سازی تهدید است که برای برداشتن و استفاده توسط هر گروه توسعه در نظر گرفته شده است. از آنجا که بازی از تهدیدهای STRIDE استفاده می‌کند، چارچوبی برای فکر کردن و نمونه‌های مشخص و قابل‌اقدام از آن تهدیدها به شما می‌دهد."
  -
    id: "T00020"
    text: "STRIDE مخفف این‌هاست:"
  -
    id: "T00030"
    text: "جعل هویت چیزی یا کسی دیگر."
  -
    id: "T00040"
    text: "تغییر داده یا کد."
  -
    id: "T00050"
    text: "ادعای اینکه عملی انجام نشده است."
  -
    id: "T00060"
    text: "افشای اطلاعات به کسی که مجاز به دیدن آن نیست."
  -
    id: "T00070"
    text: "انکار یا تضعیف سرویس برای کاربران."
  -
    id: "T00080"
    text: "به دست آوردن توانایی‌ها بدون مجوز مناسب."
  -
    id: "T00090"
    text: "در"
  -
    id: "T00100"
    text: "ویدیوها، برگه‌های امتیاز و نکته‌ها و ترفندهای بازی را داریم."
  -
    id: "T00105"
    text: "چرخه عمر توسعه امن (SDL)."
  -
    id: "T00110"
    text: "بازی ارتقای امتیاز راهی سرگرم‌کننده و آسان برای شروع درک امنیت سامانه‌های شماست از طریق مدل‌سازی تهدید. با کشف و رفع مشکلات امنیتی در سطح طراحی، ارزش دارد به راه‌های دیگری که مسائل امنیتی می‌توانند به کد شما نفوذ کنند هم فکر کنید. مایکروسافت مجموعه بزرگی از منابع رایگان دارد که به شما کمک می‌کند با چرخه عمر توسعه امن (SDL) شروع کنید."
  -
    id: "T00120"
    text: "برای آشنایی بیشتر با مدل‌سازی تهدید و چرخه عمر توسعه امن مایکروسافت، به وب‌سایت ما در این نشانی مراجعه کنید"
  -
    id: "T00130"
    text: "ادامه در پشت کارت"
  -
    id: "T00140"
    text: "ادامه"
  -
    id: "T00150"
    text: "دستورالعمل‌ها"
  -
    id: "T00160"
    text: "پیش از پخش کارت‌ها، نموداری از سامانه‌ای که می‌خواهید مدل‌سازی تهدید کنید بکشید."
  -
    id: "T00170"
    text: "کارت‌ها را بین 3 تا 6 بازیکن پخش کنید. بازی با کارت 3 از دسته دستکاری (Tampering) شروع می‌شود. در جهت عقربه‌های ساعت بازی کنید و هر بازیکن به نوبت، اگر کارتی از آن دسته دارد، همان دسته را ادامه می‌دهد. اگر بازیکن کارتی از آن دسته ندارد، می‌تواند از دسته دیگری بازی کند. هر دور را بالاترین کارت بازی‌شده از دسته آغازگر می‌برد، مگر اینکه یک کارت ارتقای امتیاز (EoP) بازی شود؛ در آن صورت کارت EoP با بالاترین ارزش می‌برد."
  -
    id: "T00180"
    text: "برای بازی کردن یک کارت، کارت را بخوانید، تهدید خود را اعلام کنید و آن را ثبت کنید. اگر بازیکن نتواند تهدید را به سامانه مرتبط کند، بازی ادامه می‌یابد."
  -
    id: "T00190"
    text: "برنده یک دست، کارت (و دسته) آغاز دست بعدی را انتخاب می‌کند. بین دست‌ها چند دقیقه برای فکر کردن به تهدیدها وقت بگذارید."
  -
    id: "T00200"
    text: "امتیازها:"
  -
    id: "T00210"
    text: "1 امتیاز برای یک تهدید روی کارت شما، به‌علاوه 1 امتیاز برای بردن دست"
  -
    id: "T00220"
    text: "تهدیدها باید به‌روشنی بیان شوند، قابل آزمون باشند و "
  -
    id: "T00230"
    text: "قابل رسیدگی باشند. اگر یک تهدید به "
  -
    id: "T00240"
    text: "مشاجره منجر شد، می‌توانید با پرسیدن این پرسش آن را حل کنید: «آیا برای آن یک باگ قابل‌اقدام، درخواست قابلیت یا تغییر طراحی می‌پذیریم؟» اگر پاسخ بله است، تهدید واقعی است. (این به آن معنا نیست که تهدیدهای خارج از این چارچوب واقعی نیستند؛ این فقط راهی است برای متمرکز کردن بحث بر تهدیدهای قابل‌اقدام.) پرسش‌هایی که با «راهی هست» شروع می‌شوند باید به‌صورت «راهی هست... و این‌گونه است...» خوانده شوند، در حالی که پرسش‌هایی که با «کد شما» شروع می‌شوند باید به‌صورت «کدی که همگی در حال ساختن آن هستیم... و این‌گونه است.» خوانده شوند."
  -
    id: "T00250"
    text: "دسته کارت‌ها شامل تعدادی کارت ویژه است: کارت‌های برتر (trump) و تهدیدهای باز. کارت‌های EoP کارت برتر هستند: حتی اگر ارزش کمتری از دسته آغازگر داشته باشند، دست را می‌برند. آس هر دسته یک کارت تهدید باز است. هنگام بازی شدن، بازیکن باید تهدیدی را شناسایی کند که روی کارت دیگری فهرست نشده است."
  -
    id: "T00260"
    text: "وقتی همه کارت‌ها بازی شدند، هر که بیشترین امتیاز را داشته باشد برنده است."
  -
    id: "T00270"
    text: "فراموش نکنید که لذت ببرید!"
  -
    id: "T00280"
    text: "گونه‌ها"
  -
    id: "T00290"
    text: "گونه‌های اختیاری:"
  -
    id: "T00300"
    text: "می‌توانید پس از دست سوم کارت‌ها را ردوبدل کنید. این کار زمانی مفید است که کارت‌هایی دارید که نمی‌توانید به سامانه ربط دهید. ممکن است کس دیگری بتواند."
  -
    id: "T00310"
    text: "امتیازها را دو برابر کنید و برای تهدیدهای روی کارت‌های دیگران یک امتیاز بدهید."
  -
    id: "T00320"
    text: "بازیکنان دیگر می‌توانند روی تهدید «ریف» (riff) کنند و اگر چنین کنند، برای هر تهدید اضافی یک امتیاز می‌گیرند."
  -
    id: "T00330"
    text: "ریف‌کردن را به حداکثر 60 ثانیه محدود کنید."
  -
    id: "T00340"
    text: "جایی را که تهدید رخ می‌دهد روی نمودار علامت بزنید."
  -
    id: "T00350"
    text: "پرسش‌هایی روی کارت‌های تهدید فهرست شده‌اند تا به آس‌ها کمک کنند."
  -
    id: "T00360"
    text: "از Laurie Williams برای الهام سپاسگزاریم."
  -
    id: "T00370"
    text: "محتویات:"
  -
    id: "T00380"
    text: "کارت‌های دستورالعمل"
  -
    id: "T00390"
    text: "کارت نمودار راهبرد"
  -
    id: "T00400"
    text: "کارت‌های تهدید STRIDE «دسته‌ها»:"
  -
    id: "T00410"
    text: "جعل هویت: 2 تا شاه، آس"
  -
    id: "T00420"
    text: "دستکاری: 2 تا شاه، آس"
  -
    id: "T00430"
    text: "انکار: 2 تا شاه، آس"
  -
    id: "T00440"
