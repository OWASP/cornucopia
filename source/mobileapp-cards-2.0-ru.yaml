---
meta:
  edition: mobileapp
  component: cards
  language: RU
  version: 2.0
suits:
-
  id: "PC"
  name: "Platform & Code"
  cards:
  -
    id: "PC2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/PC2"
    desc: "Andrew может раскрыть конфиденциальные данные через снимки экрана, записи экрана или автоматически создаваемый предпросмотр приложения при переходе в фоновый режим"
  -
    id: "PC3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/PC3"
    desc: "Harold может раскрыть отображаемые, вводимые или кэшируемые конфиденциальные данные, потому что их слишком много, они недостаточно маскируются или очищаются после использования, сохраняются без защиты, раскрываются веб-контенту или становятся доступными сторонним компонентам через избыточные разрешения"
  -
    id: "PC4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/PC4"
    desc: "Kelly может раскрыть конфиденциальные данные, используя избыточные, необъясненные или необоснованные разрешения (permissions) и права доступа (entitlements) для геолокации, камеры, микрофона, хранилища, медицинских данных и т. д."
  -
    id: "PC5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/PC5"
    desc: "Toby может изменить или раскрыть данные, потому что используются implicit intents, содержащие важные для безопасности данные, на получение которых могут зарегистрироваться приложения, или потому что ответ от intents не проходит надлежащую валидацию и очистку"
  -
    id: "PC6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/PC6"
    desc: "Dawn может раскрыть и перехватить чувствительную функциональность через межпроцессное взаимодействие (IPC), потому что permissions для broadcast и sharing не заданы, недостаточно узкие или чувствительная функциональность не исключается должным образом при sharing"
  -
    id: "PC7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/PC7"
    desc: "Colin может раскрыть или изменить конфиденциальные данные через межпроцессное взаимодействие (IPC) приложения из-за неправильной конфигурации или потому что методы запросов content provider не параметризованы должным образом, а аргументы не очищаются"
  -
    id: "PC8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/PC8"
    desc: "Lauren может обходить или изменять иначе защищенные файлы или сервисы через доступ к нижележащей файловой системе, используя слабости content providers на основе файловой системы, resolvers или их конфигурации"
  -
    id: "PC9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/PC9"
    desc: "Max может изменить или раскрыть конфиденциальные данные, потому что валидация и очистка входных данных не применяются должным образом к межпроцессному взаимодействию (IPC) или потому что extensions ограничены ненадлежащим образом"
  -
    id: "PCX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/PCX"
    desc: "Johan может изменить или раскрыть конфиденциальные данные, используя устаревшие платформы, SDK, сторонние зависимости или компоненты WebView, потому что поддерживаемые версии, доверенные компоненты и обновления безопасности не обеспечиваются"
  -
    id: "PCJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/PCJ"
    desc: "Xavier может внедрить скрипты в WebView, потому что он разрешает встраивание контента через deep linking без надлежащей авторизации и валидации host, scheme и path цели, которые пользователь может изменить, или потому что safe browsing отключен"
  -
    id: "PCQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/PCQ"
    desc: "Grant может изменить или раскрыть данные, воздействуя на JavaScript bridges, DOM, extensions или межпроцессное взаимодействие (например, shared memory, message passing, pipes, sockets) либо изменяя их"
  -
    id: "PCK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/PCK"
    desc: "Jason может вызвать утечки или повреждение памяти, потому что приложение ненадлежащим образом управляет памятью или общими ресурсами либо его native binaries не используют защиты, предоставляемые компилятором"
  -
    id: "PCA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/PCA"
    desc: "Вы изобрели новую атаку против «Platform and Code»"
    misc: "Подробнее об этой теме читайте в бесплатных OWASP Cheat Sheets по Mobile Application Security и в разделе “Mobile App Code Quality” руководства “Mobile Application Security Testing Guide” на сайте OWASP MAS"
-
  id: "AA"
  name: "Authentication & Authorization"
  cards:
  -
    id: "AA2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/AA2"
    desc: "Anant может выполнять чувствительные операции без step-up или повторной аутентификации, потому что требования к аутентификации не учитывают риск, связанный с транзакциями или изменениями контекста"
  -
    id: "AA3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/AA3"
    desc: "Vandana может получить доступ к чувствительным функциям из-за неправильно привязанных или неверно настроенных средств биометрической аутентификации, небезопасных fallback-механизмов или необработанных изменений конфигурации"
  -
    id: "AA4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/AA4"
    desc: "Jie может использовать приложение для выполнения чувствительных операций, потому что «unlocked key» не используется в ходе выполнения приложения"
  -
    id: "AA5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/AA5"
    desc: "Pramod может перехватить учетные данные через misdirection, потому что приложение уязвимо к атакам вроде Tapjacking, StrandHogg и/или URL scheme hijacking"
  -
    id: "AA6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/AA6"
    desc: "Eiman может обойти локальную аутентификацию через patching и/или instrumentation, потому что аутентификацию можно удалить патчем или перегрузить из-за небезопасных fallback-механизмов или неправильной конфигурации"
  -
    id: "AA7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/AA7"
    desc: "Abdullah может обойти защищенные операции, вызывая их вне последовательности, повторно используя ранее действительный результат аутентификации или изменяя контролируемые клиентом состояние, время или входные данные функций, которым приложение доверяет вместо повторной проверки авторизации"
  -
    id: "AA8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/AA8"
    desc: "Wong может обойти аутентификацию, потому что приложение доверяет результатам аутентификации на стороне клиента или по умолчанию разрешает доступ при сбое проверки"
  -
    id: "AA9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/AA9"
    desc: "Choi может получить доступ к конфиденциальным данным или чувствительной функциональности, потому что контроль доступа для компонентов приложения (например, entitlements, permissions), локальных ресурсов или веб-контента слишком широкий, неправильно настроен или не применяется"
  -
    id: "AAX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/AAX"
    desc: "Ade может обойти аутентификацию, потому что она не применяется через удаленный endpoint или не основана на криптографическом примитиве, защищенном флагами контроля доступа keystore/keychain"
  -
    id: "AAJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/AAJ"
    desc: "Prasad может обойти централизованные средства аутентификации и авторизации, поскольку они не применяются полноценно во всех взаимодействиях"
  -
    id: "AAQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/AAQ"
    desc: "Riotaro может обойти средства авторизации, используя потоки данных между views, процессами и компонентами для внедрения команд, манипулирования данными или раскрытия конфиденциальной информации"
  -
    id: "AAK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/AAK"
    desc: "Aatif может воздействовать на средства аутентификации или изменять их и поэтому обходить их"
  -
    id: "AAA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/AAA"
    desc: "Вы изобрели новую атаку против «Authentication & Authorization»"
    misc: "Подробнее об этой теме читайте в бесплатных OWASP Cheat Sheets по Mobile Application Security и в разделе “Mobile App Authentication Architectures” руководства “Mobile Application Security Testing Guide” на сайте OWASP MAS"
-
  id: "NS"
  name: "Network & Storage"
  cards:
  -
    id: "NS2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/NS2"
    desc: "Matt может просматривать конфиденциальные данные в логах приложения, потому что операторы логирования (logging statements) не были удалены или проверены как безопасные перед production release"
  -
    id: "NS3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/NS3"
    desc: "Bil может получить доступ к конфиденциальным данным из чувствительных полей через pasteboard/clipboard или кэш клавиатуры, потому что pasteboard/clipboard своевременно не очищается, не отключен или не ограничен для чувствительных полей, либо кэш клавиатуры не отключен"
  -
    id: "NS4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/NS4"
    desc: "Kevin может прочитать конфиденциальные данные, связанные с учетными записями или сессиями пользователей, извлекая данные, раскрытые через сторонние библиотеки, уведомления, резервные копии, кэши, локальные базы данных или другие встроенные сервисы"
  -
    id: "NS5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/NS5"
    desc: "Steve может получить доступ к конфиденциальным данным, читая резервные копии и/или локальное, внутреннее/внешнее хранилище"
  -
    id: "NS6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/NS6"
    desc: "Ricardo может извлечь данные, сохраненные приложением на украденном или списанном устройстве, потому что оно не обеспечивает политики безопасности доступа к устройству (например, блокировку с PIN, версии приложения/ОС, отключение USB debugging, шифрование устройства и rooting)"
  -
    id: "NS7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/NS7"
    desc: "Sam может выгрузить конфиденциальные данные из памяти, потому что данные не хранятся как примитивные типы и не перезаписываются случайными данными после использования или потому что поля ввода приложения используют небезопасные SDK для хранения данных в RAM"
  -
    id: "NS8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/NS8"
    desc: "Taher может раскрыть или изменить хранимые конфиденциальные данные (data at rest), потому что шифрование или защита целостности недостаточны"
  -
    id: "NS9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/NS9"
    desc: "Martin может изменить поведение или получить доступ к конфиденциальным данным, подменяя важные для безопасности данные в shared preferences, user defaults, файлах или базах данных, потому что приложение не проверяет их целостность и подлинность перед использованием"
  -
    id: "NSX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/NSX"
    desc: "Adrian может скомпрометировать взаимодействие приложения через proxy, потому что приложение не использует certificate pinning или реализует его неправильно"
  -
    id: "NSJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/NSJ"
    desc: "Nihel может раскрыть или изменить передаваемые данные (data in transit), потому что приложение разрешает cleartext traffic или допускает downgrade до устаревших версий протокола TLS"
  -
    id: "NSQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/NSQ"
    desc: "Ahmed может читать и изменять передаваемые данные (data in transit), потому что взаимодействие передается по незашифрованному каналу"
  -
    id: "NSK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/NSK"
    desc: "Maarten может выдать себя за доверенный сервер и раскрыть или изменить передаваемые данные (data in transit), потому что проверка TLS-сертификата (TLS certificate), hostname или custom trust validation слаба или может быть обойдена"
  -
    id: "NSA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/NSA"
    desc: "Вы изобрели новую атаку против «Network & Storage»"
    misc: "Подробнее об этой теме читайте в бесплатных OWASP Cheat Sheets по Mobile Application Security и в разделе “Mobile App Network Communication” руководства “Mobile Application Security Testing Guide” на сайте OWASP MAS"
-
  id: "RS"
  name: "Resilience"
  cards:
  -
    id: "RS2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/RS2"
    desc: "Sebastien может раскрыть конфиденциальные данные или внутреннее поведение, потому что отладочный код (debug code), подробная диагностика, тестовые ресурсы или небезопасное логирование во время выполнения (runtime logging) остаются в production app"
  -
    id: "RS3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/RS3"
    desc: "Tobias может раскрыть конфиденциальные данные и детали реализации, потому что отладочные символы (debug symbols) и другие не относящиеся к релизу метаданные (non-production metadata) остаются доступными в релизе (release)"
  -
    id: "RS4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/RS4"
    desc: "Timur может заменить, повторно распространить или внедрить непроверенный код в production app, потому что его signature, certificate, store origin, целостность упакованного кода (packaged code) или происхождение воспроизводимой сборки (reproducible build provenance) не могут быть надлежащим образом проверены"
  -
    id: "RS5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/RS5"
    desc: "Matteo может обойти контроль доступа и запустить функциональность, потому что debugging оставлен включенным в production build"
  -
    id: "RS6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/RS6"
    desc: "Joren может обойти контроль доступа, потому что средства anti-debugging недостаточно сильны относительно рекомендаций или предполагаемых усилий потенциального атакующего"
  -
    id: "RS7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/RS7"
    desc: "Erlend может скомпрометировать приложение, запустив его в emulator, simulator, virtualized environment или на недоверенном устройстве, потому что обнаружение окружения или attestation отсутствуют либо слишком слабы"
  -
    id: "RS8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/RS8"
    desc: "Carlos может раскрыть конфиденциальные данные, перехватывая (hooking) чувствительные функции во время выполнения (runtime), потому что приложение не обнаруживает instrumentation и не реагирует на нее"
  -
    id: "RS9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/RS9"
    desc: "Sean может выполнить reverse engineering приложения, потому что код или чувствительные к безопасности ресурсы (например, строки, конфигурация и bundled assets) недостаточно обфусцированы"
  -
    id: "RSX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/RSX"
    desc: "Juan может получить доступ к функциональности с rooted, jailbroken или infected device, потому что приложение не обнаруживает враждебные окружения или не реагирует на них должным образом"
  -
    id: "RSJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/RSJ"
    desc: "Pekka может изменить важные для безопасности файлы, конфигурацию, загруженный контент или восстановленные данные, потому что приложение не проверяет их целостность и подлинность перед использованием"
  -
    id: "RSQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/RSQ"
    desc: "Titus может изменить или обойти критическую функциональность, модифицируя приложение патчем (patching) или перехватывая (hooking) чувствительные функции во время выполнения (runtime), потому что приложение недостаточно обнаруживает tampering или реагирует на runtime instrumentation"
  -
    id: "RSK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/RSK"
    desc: "Sherif может отключить или обойти проверки anti-reversing и runtime protection, изменяя их патчами (patching) или перехватывая (hooking) сигналы, на которые они опираются, позволяя анализу или instrumentation продолжаться незамеченными"
  -
    id: "RSA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/RSA"
    desc: "Вы изобрели новую атаку против «Resilience»"
    misc: "Подробнее об этой теме читайте в бесплатных OWASP Cheat Sheets по Mobile Application Security и в разделе “Mobile App Tampering and Reverse Engineering” руководства “Mobile Application Security Testing Guide” на сайте OWASP MAS"
-
  id: "CRM"
  name: "Криптография"
  cards:
  -
    id: "CRM2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/CRM2"
    desc: "Lesego может скомпрометировать криптографические операции и ресурсы, потому что ключи повторно используются для нескольких целей или используются не в соответствии с назначением, для которого они были созданы"
  -
    id: "CRM3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/CRM3"
    desc: "Orace может скомпрометировать защищенные данные, потому что случайные значения, используемые для генерации криптографических ключей, векторов инициализации (IV) или nonces, предсказуемы"
  -
    id: "CRM4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/CRM4"
    desc: "Adel может предсказать, вывести или восстановить ключи шифрования или подписи, потому что при их генерации или выводе (derivation) используются недостаточная энтропия, слабые параметры либо известные или перебираемые входные значения"
  -
    id: "CRM5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/CRM5"
    desc: "Emery может получить доступ к данным, потому что они были обфусцированы вместо использования одобренной криптографической функции"
  -
    id: "CRM6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/CRM6"
    desc: "Enselme может изменить конфиденциальные данные (хранимые или передаваемые), потому что они не проходят проверку целостности"
  -
    id: "CRM7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/CRM7"
    desc: "Hassan может извлечь или изменить конфиденциальные данные, потому что они хранятся без надлежащего шифрования или платформенных средств защиты данных"
  -
    id: "CRM8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/CRM8"
    desc: "Ash может взломать криптографию, потому что она недостаточно стойкая относительно рекомендаций или предполагаемых усилий потенциального атакующего"
  -
    id: "CRM9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/CRM9"
    desc: "Ramsey может получить доступ к защищенным конфиденциальным данным, потому что криптографическая конфигурация (например, algorithm, mode, IV, nonce или provider) слаба или используется неправильно"
  -
    id: "CRMX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/CRMX"
    desc: "Kouti может извлечь криптографические ключи или конфиденциальные данные, потому что они hard-coded или хранятся без шифрования либо надлежащей платформенной защиты в изолированном хранилище приложения (app-private) или общем хранилище (shared storage)"
  -
    id: "CRMJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/CRMJ"
    desc: "Fady может обойти криптографические средства контроля, потому что они не переходят в безопасное состояние при сбое (fail securely), т.е. по умолчанию остаются незащищенными"
  -
    id: "CRMQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/CRMQ"
    desc: "Simon может обойти функции хеширования (hashing) и шифрования (encryption), потому что они являются самодельными (custom) и/или реализованы ненадлежащим образом"
  -
    id: "CRMK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/CRMK"
    desc: "Tarik может воздействовать на криптографические операции или изменять их и поэтому обходить их"
  -
    id: "CRMA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/CRMA"
    desc: "Вы изобрели новую атаку против «Криптографии»"
    misc: "Подробнее об этой теме читайте в бесплатных OWASP Cheat Sheets по Mobile Application Security и в разделе “Mobile App Cryptography” руководства “Mobile Application Security Testing Guide” на сайте OWASP MAS"
-
  id: "CM"
  name: "Cornucopia"
  cards:
  -
    id: "CM2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/CM2"
    desc: "Garth может снизить приватность пользователей приложения, потому что приложение ясно не раскрывает, к каким конфиденциальным данным или tracking domains оно получает доступ, какие собирает, использует или передает"
  -
    id: "CM3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/CM3"
    desc: "Elsa может снизить приватность пользователей приложения, потому что приложение не позволяет пользователю легко управлять своими данными, удалять и изменять их, менять настройки приватности и повторно запрашивать согласие, когда требуется больше данных"
  -
    id: "CM4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/CM4"
    desc: "Elizabeth может снизить приватность пользователей приложения, потому что приложение ясно не раскрывает персональные данные, передаваемые downstream services, или не получает согласие пользователя на такую передачу."
  -
    id: "CM5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/CM5"
    desc: "Debarghaya может снизить приватность пользователей приложения, потому что приложение без информированного согласия использует персональные данные, собранные для безопасности или предотвращения мошенничества, в коммерческих целях"
  -
    id: "CM6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/CM6"
    desc: "Kim может снизить приватность пользователей приложения, потому что приложение использует биометрическую информацию (например, отпечатки пальцев, данные распознавания лиц и т. д.), собранную для целей безопасности, в коммерческих интересах"
  -
    id: "CM7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/CM7"
    desc: "Carlos может использовать службы уведомлений (notification services) приложения для запуска фишинговых кампаний (phishing), потому что содержимое уведомлений или целевые адреса действий (action destinations) не проходят надлежащую очистку или валидацию"
  -
    id: "CM8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/CM8"
    desc: "Gastón может запускать вредоносные действия, используя небезопасное межприложенное взаимодействие или делегированные действия (delegated actions)"
  -
    id: "CM9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/CM9"
    desc: "Luis может заставить приложение действовать на основе поддельных защищенных данных, потому что оно не проверяет, что данные, полученные от внешних сервисов, подлинны и не изменены"
  -
    id: "CMX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/CMX"
    desc: "Roxana может произвольно перезаписывать файлы и потенциально выполнять вредоносный код через path traversal, потому что целевой путь (path) и каталог (directory) не проходят надлежащую валидацию"
  -
    id: "CMJ"
    value: "В"
    url: "https://cornucopia.owasp.org/cards/CMJ"
    desc: "Alessandro может проэксплуатировать приложение, используя buffer overflows и утечки памяти для записи постороннего кода в адресное пространство мобильного кода"
  -
    id: "CMQ"
    value: "Д"
    url: "https://cornucopia.owasp.org/cards/CMQ"
    desc: "Victor может модифицировать приложение патчем (patch) и использовать его для распространения вредоносного кода, потому что runtime integrity checks недостаточно сильны относительно рекомендаций или предполагаемых усилий потенциального атакующего"

  -
    id: "CMK"
    value: "К"
    url: "https://cornucopia.owasp.org/cards/CMK"
    desc: "Ruben может использовать приложение для распространения вредоносного кода, потому что оно принимает, загружает или пересылает недоверенный контент без проверки его источника, типа или безопасности"
  -
    id: "CMA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/CMA"
    desc: "Вы изобрели новую атаку любого типа"
    misc: "Подробнее об этой теме читайте в бесплатных OWASP Cheat Sheets по Mobile Application Security и в разделе “Mobile App User Privacy Protection” руководства “Mobile Application Security Testing Guide” на сайте OWASP MAS"
-
  id: "WC"
  name: "Wild Card"
  cards:
  -
    id: "JOAM"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/JOAM"
    card: "Joker"
    desc: "Starr может воздействовать на приложение, изменить его или повлиять на него так, что оно перестанет соответствовать правовым, нормативным, договорным или иным требованиям"
    misc: "Вы размышляли над тем, чтобы стать индивидуальным членом OWASP? Все инструменты, руководства и локальные встречи бесплатны для всех, но индивидуальное членство помогает поддержать работу OWASP"
  -
    id: "JOBM"
    value: "B"
    url: "https://cornucopia.owasp.org/cards/JOBM"
    card: "Joker"
    desc: "Mallory может злонамеренно использовать приложение, установленное на устройстве Bob, чтобы без согласия и/или уведомления вести наблюдение, шпионить, подслушивать, удаленно управлять, отслеживать или иным образом мониторить Bob"
    misc: "Изучайте уязвимости и узнавайте, как их можно исправить, используя бесплатные MASTG reference applications на сайте OWASP MAS"
paragraphs:
-
  id: "Common"
  name: "Common"
  sentences:
  -
    id: "NoCard"
    text: "Нет карты"
  -
    id: "Title"
    text: "Mobile App Edition v2.0-RU"
  -
    id: "Title_full"
    text: "OWASP® Cornucopia Mobile App Edition v2.0-RU"
  -
    id: "T00010"
    text: "OWASP® Cornucopia — это механизм, помогающий командам разработки программного обеспечения выявлять требования безопасности в Agile, обычных и формальных процессах разработки."
  -
    id: "T00020"
    text: "Авторы"
  -
    id: "T00090"
    text: "© 2012-2026 OWASP Foundation"
  -
    id: "T00092"
    text: "OWASP® Cornucopia Mobile App Edition is free to use. It is licensed under the Creative Commons Attribution-ShareAlike 4.0 license, so you can copy, distribute and transmit the work, and you can adapt it, and use it commercially, but all provided that you attribute the work and if you alter, transform, or build upon this work, you may distribute the resulting work only under the same or similar license to this one."
  -
    id: "T00100"
    text: "Благодарности"
  -
    id: "T00110"
    text: "Adam Shostack и команда Microsoft SDL за “Elevation of Privilege Threat Modelling Game”, опубликованную под лицензией Creative Commons Attribution, которая стала вдохновением для Cornucopia и из которой были заимствованы многие идеи, особенно игровая механика."
  -
    id: "T00120"
    text: "Colin Watson за создание Cornucopia, на которой основана OWASP Cornucopia Mobile App Edition."
  -
    id: "T00130"
    text: "Участникам, сторонникам, спонсорам и волонтерам OWASP MASVS/MASTG, Mitre Common Attack Pattern Enumeration and Classification (CAPEC™) и SAFECode “Practical Security Stories and Security Tasks for Agile Development Environments”, которые используются в приведенных перекрестных ссылках."
  -
    id: "T00145"
    text: "Текущим и прошлым участникам и лидерам проекта OWASP® Cornucopia, особенно тем, кто недавно участвовал в обновлении перекрестных ссылок, создании онлайн-версий и написании скриптов для динамической генерации выходных файлов Cornucopia."
  -
    id: "T00150"
    text: "Blackfoot (UK) Limited за создание и передачу готовых к печати файлов дизайна, Tom Brennan и OWASP® Foundation за инициативу создания коробки и буклета под брендом OWASP, а также Secure Delivery Ltd за разработку и передачу Copi — платформы для онлайн-игры в Cornucopia и EoP."
  -
    id: "T00161"
    text: "(продолжение на стр. 20)"
  -
    id: "T00162"
    text: "(продолжение со стр. 10)"
  -
    id: "T00200"
    text: "Введение"
  -
    id: "T00210"
    text: "Идея Cornucopia состоит в том, чтобы помочь командам разработки, особенно использующим Agile-методологии, выявлять требования безопасности приложений и разрабатывать пользовательские истории, основанные на безопасности."
  -
    id: "T00220"
    text: "Cornucopia Mobile App Edition использует те же концепции и игровую стратегию, что и Cornucopia Website App Edition, но предназначена для команд разработки мобильных приложений. Cornucopia вдохновлена “Elevation of Privilege: The Threat Modeling Game (EoP)”."
  -
    id: "T00240"
    text: "Cornucopia стремится привнести идеи threat modeling в команды мобильной разработки, использующие Agile-методологии или больше сосредоточенные на слабостях мобильных приложений, чем на других типах уязвимостей ПО."
  -
    id: "T00300"
    text: "Колода карт (набор)"
  -
    id: "T00310"
    text: "Сценарии карт предназначены для покрытия всех требований MASVS 2.0, всех тестов из MASTG и дополнительных рекомендаций из руководств по безопасной разработке Android и iOS. Это сделано, чтобы игра была максимально согласована с актуальными рекомендациями по безопасной мобильной разработке. При этом важно помнить, что требования и рекомендации по безопасности постоянно меняются, а игру прежде всего следует использовать как поддержку при threat modeling мобильного приложения, а не как полный справочник требований и рекомендаций безопасности."
  -
    id: "T00311"
    text: "Масти Cornucopia Mobile App Edition основаны на разделах Mobile Application Security Verification Standard."
  -
    id: "T00320"
    text: "Они дали пять мастей, а шестая, называемая “Cornucopia”, была создана как козырная масть: "
  -
    id: "T00330"
    text: "Platform & Code (PC)"
  -
    id: "T00340"
    text: "Authentication & Authorization (AA)"
  -
    id: "T00350"
    text: "Network & Storage (NS)"
  -
    id: "T00360"
    text: "Resilience (RS)"
  -
    id: "T00370"
    text: "Cryptography (CRM)"
  -
    id: "T00380"
    text: "Cornucopia (CM)"
  -
    id: "T00390"
    text: "Как и в покерной колоде, каждая масть содержит 13 карт (Туз, 2-10, Валет, Дама и Король)."
  -
    id: "T00400"
    text: "Также есть две карты Джокер, как в Cornucopia Website App Edition."
  -
    id: "T00500"
    text: "Соответствия"
  -
    id: "T00510"
    text: "Еще одна цель Mobile Cornucopia — связать атаки с требованиями и методами верификации."
  -
    id: "T00520"
    text: "Помимо напечатанных на картах кодов требований MASVS 2.0 и кодов тестов MASTG, карты также ссылаются на идентификаторы шаблонов атак ПО CAPEC™, которые сами сопоставлены с CWE."
  -
    id: "T00530"
    text: "Каждая карта также сопоставлена с 36 основными историями безопасности (security stories) из документа SAFECode, чтобы помочь командам создавать собственные истории, связанные с безопасностью, для использования в Agile-процессах."
  -
    id: "T00600"
    text: "Стратегия игры"
  -
    id: "T00610"
    text: "За исключением различий в содержании, правила игры практически идентичны правилам Cornucopia Website App Edition."
  -
    id: "T01000"
    text: "Оставьте отзыв"
  -
    id: "T01010"
    text: "Если у вас есть идеи или отзывы по использованию OWASP® Mobile Cornucopia, пожалуйста, поделитесь ими."
  -
    id: "T01020"
    text: "А если вы создадите альтернативные версии карт или профессиональные версии, готовые к печати, пожалуйста, поделитесь ими с волонтерами, создавшими это издание, и с более широким сообществом разработки приложений и безопасности приложений."
  -
    id: "T01030"
    text: "Лучшее место для обсуждения или участия — список/группа проекта OWASP:"
  -
    id: "T01040"
    text: "Список/Группа"
  -
    id: "T01050"
    text: "Домашняя страница проекта"
  -
    id: "T01060"
    text: "Все документы и инструменты OWASP можно бесплатно загружать и использовать."
  -
    id: "T01070"
    text: "OWASP® Cornucopia Mobile App Edition is licensed under the Creative Commons Attribution-ShareAlike 4.0 license."
  -
    id: "T01100"
    text: "Инструкции"
  -
    id: "T01110"
    text: "Текст на каждой карте описывает атаку, а атакующему присвоено имя, уникальное среди всех карт."
  -
    id: "T01120"
    text: "Имя может представлять компьютерную систему (например, базу данных, файловую систему, другое приложение, связанный сервис, botnet), отдельного человека (например, гражданина, покупателя, клиента, сотрудника, преступника, шпиона) или даже группу людей (например, конкурирующую организацию, активистов с общей целью)."
  -
    id: "T01130"
    text: "Атакующий может быть удаленным — на другом устройстве или в другом месте — либо локальным/внутренним с доступом к тому же устройству, host или сети, где работает приложение."
  -
    id: "T01140"
    text: "Атакующий всегда назван в начале каждого описания"
  -
    id: "T01150"
    text: "Пример:"
  -
    id: "T01160"
    text: "Wong может обойти аутентификацию, потому что она не переходит в безопасное состояние при сбое (fail securely)."
  -
    id: "T01170"
    text: "Это означает, что атакующий Wong может войти в приложение без предоставления учетных данных, потому что механизм входа разрешает доступ при сбое."
  -
    id: "T01180"
    text: "Атаки были в основном взяты из MASVS 2.0 Mobile Application Testing guide и руководств по безопасному кодированию Android и iOS"
  -
    id: "T01200"
    text: "На большинстве карт приведены ссылки между атаками и руководствами:"
  -
    id: "T01210"
    text: "Коды тестов из MASVS Mobile Application Test Guide:"
  -
    id: "T01220"
    text: "Идентификаторы проверки (Verification IDs) в “Mobile Application Security Verification Standard (MASVS) 2.0 for Mobile Applications”"
  -
    id: "T01240"
    text: "Идентификаторы в “Common Attack Pattern Enumeration and Classification (CAPEC™)”, v3.9, Mitre Corporation, ноябрь 2015"
  -
    id: "T01250"
    text: "Истории, ориентированные на безопасность (security-focused stories), в 'Practical Security Stories and Security Tasks for Agile Development Environments', SAFECode, июль 2012"
  -
    id: "T01260"
    text: "Ссылка означает, что атака включена в указанный материал, но не обязательно охватывает весь его смысл. "
  -
    id: "T01270"
    text: "Для структурированных данных, таких как CAPEC, приводится наиболее конкретная ссылка, но иногда указывается перекрестная ссылка, у которой также есть более конкретные (дочерние) примеры."
  -
    id: "T01280"
    text: "На шести Тузах и двух Джокерах ссылок нет. "
  -
    id: "T01290"
    text: "Вместо этого на этих картах приведены общие подсказки курсивом."
  -
    id: "T01300"
    text: "В Cornucopia можно играть множеством разных способов. "
  -
    id: "T01301"
    text: "Описание правил игры продолжается на страницах: 11-19."
  -
    id: "T01400"
    text: "Подготовка"
  -
    id: "T01410"
    text: "Получите колоду или распечатайте собственную колоду карт Cornucopia (см. страницу 2 этого документа) и разделите/вырежьте карты"
  -
    id: "T01411"
    text: "Используйте карты из этого набора"
  -
    id: "T01420"
    text: "Определите приложение или процесс приложения для рассмотрения; это может быть концепция, дизайн или фактическая реализация"
  -
    id: "T01430"
    text: "Создайте диаграмму потоков данных, пользовательские истории (user stories) или другие артефакты, которые помогут рассмотрению"
  -
    id: "T01440"
    text: "Определите и пригласите группу из 3-6 архитекторов, разработчиков, тестировщиков и других заинтересованных представителей бизнеса, посадив их за один стол (постарайтесь включить кого-то достаточно знакомого с безопасностью приложений)"
  -
    id: "T01450"
    text: "Подготовьте призы (золотые звезды, шоколад, пиццу, пиво или цветы — в зависимости от вашей офисной культуры)"
  -
    id: "T01500"
    text: "Игра"
  -
    id: "T01510"
    text: "Одна масть — Cornucopia — является козырной."
  -
    id: "T01520"
    text: "Тузы старшие (т.е. бьют Королей)."
  -
    id: "T01530"
    text: "Полезно, если кто-то, не участвующий в игре, документирует проблемы и счет."
  -
    id: "T01540"
    text: "Уберите Джокеров и несколько младших карт (2, 3, 4) из масти Cornucopia, чтобы у каждого игрока было одинаковое число карт"
  -
    id: "T01550"
    text: "Перемешайте колоду и раздайте все карты"
  -
    id: "T01560"
    text: "Для начала случайным образом выберите игрока, который сыграет первую карту — он может сыграть любую карту из руки, кроме карты козырной масти Cornucopia"
  -
    id: "T01570"
    text: "Чтобы сыграть карту, каждый игрок должен прочитать ее вслух и объяснить (подсказки см. в online Wiki Deck), как угроза может применяться (игрок получает очко за атаки, которые могут сработать и которые группа считает исправимой ошибкой (actionable bug)) — на этом этапе не пытайтесь думать о мерах снижения риска (mitigations) и не исключайте угрозу только потому, что считаете ее уже смягченной — кто-нибудь должен отметить карту и записать поднятые проблемы"
  -
    id: "T01580"
    text: "Играйте по часовой стрелке; каждый должен играть карту тем же способом. Если у вас есть карты той же ведущей масти (lead suit), вы должны сыграть одну из них, иначе можно сыграть карту любой другой масти."
  -
    id: "T01590"
    text: "Только более старшая карта той же масти или самая старшая карта козырной масти Cornucopia выигрывает раздачу."
  -
    id: "T01600"
    text: "Игрок, выигравший раунд, начинает следующий раунд (т.е. играет первым) и тем самым определяет следующую ведущую масть (lead suit)"
  -
    id: "T01610"
    text: "Повторяйте, пока все карты не будут сыграны"
  -
    id: "T01700"
    text: "Начисление очков"
  -
    id: "T01710"
    text: "Цель — выявлять применимые угрозы и выигрывать раздачи (раунды):"
  -
    id: "T01720"
    text: "Начисляйте +1 за каждую карту, которую вы можете определить как действительную угрозу для рассматриваемого приложения"
  -
    id: "T01730"
    text: "Начисляйте +1, если вы выиграли раунд"
  -
    id: "T01740"
    text: "Когда все карты сыграны, выигрывает тот, у кого больше всего очков"
  -
    id: "T01800"
    text: "Завершение"
  -
    id: "T01810"
    text: "Рассмотрите все применимые угрозы и соответствующие требования безопасности"
  -
    id: "T01820"
    text: "Создайте пользовательские истории (user stories), спецификации и сценарии тестирования (test cases) в соответствии с требованиями вашей методологии разработки."
  -
    id: "T01900"
    text: "Альтернативные правила игры"
  -
    id: "T01910"
    text: "Если вы новичок в игре, для начала уберите Тузов и двух Джокеров."
  -
    id: "T01920"
    text: "Верните Джокеров, когда участники лучше познакомятся с процессом."
  -
    id: "T01930"
    text: "Помимо описанных выше правил «игры с козырями», очень похожих на EoP, с колодой можно играть и по правилам «двадцать одно» (также известной как «понтун» (pontoon) или «блэкджек» (blackjack)), что обычно уменьшает число карт, разыгрываемых в каждом раунде."
  -
    id: "T01940"
    text: "Практикуйтесь на воображаемом приложении или даже на будущем планируемом приложении, а не пытайтесь искать недостатки в существующих приложениях, пока участники не убедятся в полезности игры."
  -
    id: "T01950"
    text: "Подумайте о том, чтобы играть только одной мастью для более короткой сессии, но старайтесь покрывать все масти для каждого проекта. "
  -
    id: "T01960"
    text: "Или, что еще лучше, сыграйте одну раздачу с заранее выбранными картами и начисляйте очки только за способность выявлять требования безопасности. "
  -
    id: "T01970"
    text: "Если участники не могут выделить достаточно времени на полную колоду, можно играть примерно неделю по одной игре каждой мастью в день."
  -
    id: "T01980"
    text: "Некоторые команды предпочитали разыгрывать полную раздачу карт, а затем обсуждать содержание карт после каждого раунда (а не после хода каждого игрока)."
  -
    id: "T01990"
    text: "Еще одно предложение: если игрок не смог определить, что карта релевантна, разрешите другим игрокам предложить идеи и, возможно, получить очко за эту карту. "
  -
    id: "T02000"
    text: "Подумайте о начислении дополнительных очков за особенно хороший вклад."
  -
    id: "T02010"
    text: "Вы можете играть даже самостоятельно. "
  -
    id: "T02020"
    text: "Просто используйте карты как стимулы для размышлений. "
  -
    id: "T02030"
    text: "Однако привлечение большего числа людей будет полезным."
  -
    id: "T02040"
    text: "В руководстве Microsoft EoP «жульничество» (cheating) рекомендуется как хорошая игровая стратегия."
  -
    id: "T02600"
    text: "Часто задаваемые вопросы"
  -
    id: "T02610"
    text: "1. Могу ли я копировать или редактировать игру?"
  -
    id: "T02620"
    text: "Да, конечно."
  -
    id: "T02630"
    text: "All OWASP materials are free to do with as you like provided you comply with the Creative Commons Attribution-ShareAlike 4.0 license. "
  -
    id: "T02640"
    text: "Возможно, если вы создадите новую версию, вы передадите ее проекту OWASP® Cornucopia?"
  -
    id: "T02650"
    text: "2. Как я могу принять участие?"
  -
    id: "T02660"
    text: "Пожалуйста, отправляйте идеи или предложения помощи в список рассылки проекта."
  -
    id: "T02670"
    text: "3. Как были выбраны имена атакующих?"
  -
    id: "T02680"
    text: "EoP начинает каждое описание словами вроде 'An attacker can...',"
  -
    id: "T02690"
    text: "но Colin Watson использовал в Cornucopia личные имена, которые можно воспринимать как внешних или внутренних людей либо как псевдонимы компьютерных систем."
  -
    id: "T02700"
    text: "Аналогично, имена в Mobile App Edition отражают аспект сообщества OWASP."
  -
    id: "T02710"
    text: "Поэтому, за исключением 'Bob and Mallory', имена атакующих взяты из состава OWASP Global and EU board members 2024 года, OWASP Staff, авторов и участников OWASP Cornucopia Mobile App Edition, а также лидеров OWASP Chapter по всему миру."
  -
    id: "T02720"
    text: "Культурное и гендерное разнообразие просто отражает эти источники имен и"
  -
    id: "T02730"
    text: "не предназначено для репрезентативного представления всего мира."
  -
    id: "T02750"
    text: "4. Почему на лицевой стороне карт нет изображений?"
  -
    id: "T02760"
    text: "На картах довольно много текста, и перекрестные ссылки тоже занимают место."
  -
    id: "T02770"
    text: "Но было бы здорово добавить дополнительные элементы дизайна."
  -
    id: "T02780"
    text: "Есть добровольцы?"
  -
    id: "T02790"
    text: "5. Ранжированы ли атаки по номеру на карте?"
  -
    id: "T02800"
    text: "Только приблизительно."
  -
    id: "T02810"
    text: "Риск будет зависеть от приложения и организации из-за различий в требованиях безопасности и соответствия стандартам (compliance), поэтому ваша собственная оценка серьезности (severity) может расположить карты в порядке, отличном от их номеров."
  -
    id: "T02820"
    text: "6. Сколько времени занимает раунд с полной колодой карт?"
  -
    id: "T02830"
    text: "Это зависит от масштаба приложения, объема обсуждений и того, насколько игроки знакомы с концепциями безопасности приложений."
  -
    id: "T02840"
    text: "Но, вероятно, стоит заложить 1,5–2,0 часа для 4-6 человек."
  -
    id: "T02850"
    text: "7. Какие люди должны играть в эту игру?"
  -
    id: "T02860"
    text: "Всегда старайтесь собрать смесь ролей, способных внести разные точки зрения."
  -
    id: "T02870"
    text: "Но включите кого-то, кто хорошо знает терминологию уязвимостей приложений. "
  -
    id: "T02880"
    text: "В остальном постарайтесь включить архитекторов, разработчиков, тестировщиков и соответствующего менеджера проекта или владельца бизнеса."
  -
    id: "T02890"
    text: "8. Кто должен делать заметки и вести счет?"
  -
    id: "T02900"
    text: "Лучше, если заметки о выявленных требованиях и обсужденных проблемах делает кто-то другой, не участвующий в игре."
  -
    id: "T02910"
    text: "Это можно использовать как обучение для менее опытного разработчика (junior developer) или поручить менеджеру проекта."
  -
    id: "T02920"
    text: "Некоторые организации делают запись, чтобы позже пересмотреть ее при более формальном описании требований."
  -
    id: "T02930"
    text: "9. Всегда ли нужно использовать полную колоду карт?"
  -
    id: "T02940"
    text: "Нет. "
  -
    id: "T02950"
    text: "С меньшей колодой играть быстрее. "
  -
    id: "T02960"
    text: "Начните первую игру только с такого числа карт, которого хватит на два-три раунда. "
  -
    id: "T02970"
    text: "Всегда рассматривайте возможность убрать карты, которые совершенно не подходят для целевого приложения или рассматриваемой функции. "
  -
    id: "T02980"
    text: "В первые несколько игр обычно также лучше убрать Тузов и двух Джокеров."
  -
    id: "T02990"
    text: "Также обычно играют без козырной масти, пока участники лучше не познакомятся с идеей."
  -
    id: "T03000"
    text: "10. Что делать игрокам, когда у них карта Туз с текстом «изобрели новую атаку X»?"
  -
    id: "T03010"
    text: "Игрок может придумать любую атаку, которую считает действительной, но она должна соответствовать масти карты (например, Platform & Code)."
  -
    id: "T03020"
    text: "Если игроки новички, для начала лучше убрать такие карты (см. также FAQ 9)."
  -
    id: "T03850"
    text: "Трудолюбивые сотрудники OWASP."
