    text: "از Adam Shostack و تیم Microsoft SDL برای «بازی مدل‌سازی تهدید Elevation of Privilege»، که تحت مجوز Creative Commons Attribution منتشر شده و الهام‌بخش Cornucopia بوده و بسیاری از ایده‌ها، به‌ویژه نظریه بازی آن، از آن برگرفته شده است."
  -
    id: "T00120"
    text: "از Colin Watson برای ابداع Cornucopia که نسخه برنامه موبایل OWASP Cornucopia بر پایه آن ساخته شده است."
  -
    id: "T00130"
    text: "از مشارکت‌کنندگان، حامیان، اسپانسرها و داوطلبان OWASP MASVS/MASTG، فهرست‌بندی و طبقه‌بندی الگوهای حمله رایج (CAPEC™) از Mitre، و «داستان‌ها و وظایف امنیتی عملی برای محیط‌های توسعه چابک» از SAFECode که همگی در ارجاع‌های متقابل ارائه‌شده به‌کار رفته‌اند."
  -
    id: "T00145"
    text: "از مشارکت‌کنندگان و رهبران کنونی و پیشین پروژه OWASP® Cornucopia، به‌ویژه کسانی که اخیراً در به‌روزرسانی ارجاع‌های متقابل، ایجاد نسخه‌های آنلاین و نوشتن اسکریپت‌هایی برای تولید پویای فایل‌های خروجی Cornucopia نقش داشته‌اند."
  -
    id: "T00150"
    text: "از Blackfoot (UK) Limited برای ایجاد و اهدای فایل‌های طراحی آماده چاپ، از Tom Brennan و بنیاد OWASP® برای پیشگامی در ساخت جعبه و بروشور با برند OWASP، و از Secure Delivery Ltd برای توسعه و اهدای Copi، پلتفرم بازی آنلاین Cornucopia و EoP."
  -
    id: "T00161"
    text: "(ادامه در صفحه 20)"
  -
    id: "T00162"
    text: "(ادامه از صفحه 10)"
  -
    id: "T00200"
    text: "مقدمه"
  -
    id: "T00210"
    text: "ایده پشت Cornucopia این است که به تیم‌های توسعه، به‌ویژه تیم‌هایی که از روش‌شناسی‌های چابک استفاده می‌کنند، کمک کند نیازمندی‌های امنیتی برنامه را شناسایی کنند و داستان‌های کاربری مبتنی بر امنیت بنویسند."
  -
    id: "T00220"
    text: "نسخه برنامه موبایل Cornucopia از همان مفاهیم و راهبرد بازی نسخه برنامه وب Cornucopia استفاده می‌کند، اما برای تیم‌های توسعه‌دهنده موبایل ساخته شده است. Cornucopia از «Elevation of Privilege: The Threat Modeling Game (EoP)» الهام گرفته است."
  -
    id: "T00240"
    text: "Cornucopia تلاش می‌کند ایده‌های مدل‌سازی تهدید را به تیم‌های توسعه موبایل که از روش‌شناسی‌های چابک استفاده می‌کنند، یا بیشتر بر ضعف‌های برنامه‌های موبایل تمرکز دارند تا سایر انواع آسیب‌پذیری‌های نرم‌افزاری، معرفی کند."
  -
    id: "T00300"
    text: "دسته کارت‌ها (بسته)"
  -
    id: "T00310"
    text: "سناریوهای کارت‌ها قرار است همه الزامات MASVS 2.0، همه آزمون‌های MASTG و هر رهنمود اضافی از راهنماهای کدنویسی امن Android و iOS را پوشش دهند. این کار برای آن انجام شد که بازی تا حد امکان با جدیدترین رهنمودهای توسعه امن موبایل هم‌راستا باشد. با این حال، مهم است به یاد داشته باشید که رهنمودها و الزامات امنیتی همواره در حال تغییرند و بازی پیش از هر چیز باید به‌عنوان پشتیبان در مدل‌سازی تهدید برنامه‌های موبایل به‌کار رود، نه به‌عنوان راهنمای کامل الزامات و رهنمودهای امنیتی."
  -
    id: "T00311"
    text: "دسته‌های (suit) نسخه برنامه موبایل Cornucopia بر پایه بخش‌های استاندارد راستی‌آزمایی امنیت برنامه‌های موبایل (MASVS) هستند."
  -
    id: "T00320"
    text: "این‌ها پنج دسته را فراهم کردند و دسته ششم با نام «Cornucopia» به‌عنوان دسته برتر (trump) ایجاد شد: "
  -
    id: "T00330"
    text: "پلتفرم و کد (PC)"
  -
    id: "T00340"
    text: "احراز هویت و مجوزدهی (AA)"
  -
    id: "T00350"
    text: "شبکه و ذخیره‌سازی (NS)"
  -
    id: "T00360"
    text: "تاب‌آوری (RS)"
  -
    id: "T00370"
    text: "رمزنگاری (CRM)"
  -
    id: "T00380"
    text: "کورنوکوپیا (CM)"
  -
    id: "T00390"
    text: "مانند ورق‌های بازی پوکر، هر دسته شامل 13 کارت است (آس، 2 تا 10، سرباز، ملکه و شاه)."
  -
    id: "T00400"
    text: "همچنین دو کارت جوکر وجود دارد، مشابه نسخه برنامه وب Cornucopia."
  -
    id: "T00500"
    text: "نگاشت‌ها"
  -
    id: "T00510"
    text: "انگیزه دیگر Cornucopia موبایل، پیوند دادن حمله‌ها به الزامات و روش‌های راستی‌آزمایی است."
  -
    id: "T00520"
    text: "علاوه بر چاپ کدهای الزامات MASVS 2.0 و کدهای آزمون MASTG روی کارت‌ها، کارت‌ها به شناسه‌های الگوی حمله نرم‌افزاری CAPEC™ نیز پیوند دارند که خود به CWEها نگاشت شده‌اند."
  -
    id: "T00530"
    text: "هر کارت همچنین به 36 داستان امنیتی اصلی در سند SAFECode نگاشت شده است تا به تیم‌ها کمک کند داستان‌های مرتبط با امنیت خود را برای استفاده در فرایندهای چابک ایجاد کنند."
  -
    id: "T00600"
    text: "راهبرد بازی"
  -
    id: "T00610"
    text: "جدا از تفاوت‌های محتوا، قوانین بازی تقریباً با قوانین نسخه برنامه وب Cornucopia یکسان است."
  -
    id: "T01000"
    text: "بازخورد بدهید"
  -
    id: "T01010"
    text: "اگر ایده یا بازخوردی درباره استفاده از OWASP® Mobile Cornucopia دارید، لطفاً آن را به اشتراک بگذارید."
  -
    id: "T01020"
    text: "حتی بهتر است اگر نسخه‌های جایگزین کارت‌ها را بسازید یا نسخه‌های حرفه‌ای آماده چاپ تولید کنید، آن را با داوطلبانی که این نسخه را ساخته‌اند و با جامعه گسترده‌تر توسعه و امنیت برنامه به اشتراک بگذارید."
  -
    id: "T01030"
    text: "بهترین مکان برای گفت‌وگو یا مشارکت، فهرست/گروه پروژه OWASP است:"
  -
    id: "T01040"
    text: "فهرست/گروه"
  -
    id: "T01050"
    text: "صفحه اصلی پروژه"
  -
    id: "T01060"
    text: "همه مستندات و ابزارهای OWASP برای دانلود و استفاده رایگان هستند."
  -
    id: "T01070"
    text: "نسخه برنامه موبایل OWASP® Cornucopia تحت مجوز Creative Commons Attribution-ShareAlike 4.0 منتشر شده است."
  -
    id: "T01100"
    text: "دستورالعمل‌ها"
  -
    id: "T01110"
    text: "متن هر کارت یک حمله را توصیف می‌کند، اما به مهاجم یک نام داده شده است که در میان همه کارت‌ها یکتاست."
  -
    id: "T01120"
    text: "این نام می‌تواند نمایانگر یک سامانه رایانه‌ای (مثلاً پایگاه داده، سیستم فایل، برنامه‌ای دیگر، سرویسی مرتبط، یک botnet)، یک فرد (مثلاً شهروند، مشتری، کارفرما، کارمند، مجرم، جاسوس) یا حتی گروهی از افراد (مثلاً یک سازمان رقیب، فعالانی با هدف مشترک) باشد."
  -
    id: "T01130"
    text: "مهاجم ممکن است از راه دور در دستگاه یا مکانی دیگر باشد، یا محلی/داخلی باشد و به همان دستگاه، میزبان یا شبکه‌ای که برنامه روی آن اجرا می‌شود دسترسی داشته باشد."
  -
    id: "T01140"
    text: "نام مهاجم همیشه در ابتدای هر توصیف آمده است"
  -
    id: "T01150"
    text: "یک مثال:"
  -
    id: "T01160"
    text: "وونگ می‌تواند احراز هویت را دور بزند، زیرا به‌صورت ایمن شکست نمی‌خورد."
  -
    id: "T01170"
    text: "این یعنی مهاجم، وونگ، می‌تواند بدون ارائه اعتبارنامه وارد برنامه شود، زیرا سازوکار ورود هنگام شکست اجازه دسترسی می‌دهد."
  -
    id: "T01180"
    text: "حمله‌ها عمدتاً از راهنمای آزمون برنامه موبایل MASVS 2.0 و راهنماهای کدنویسی امن Android و iOS گرفته شده‌اند"
  -
    id: "T01200"
    text: "ارجاع‌هایی میان حمله‌ها و راهنماها روی بیشتر کارت‌ها ارائه شده است:"
  -
    id: "T01210"
    text: "کدهای آزمون از راهنمای آزمون برنامه موبایل MASVS:"
  -
    id: "T01220"
    text: "شناسه‌های راستی‌آزمایی در «استاندارد راستی‌آزمایی امنیت برنامه‌های موبایل (MASVS) 2.0 برای برنامه‌های موبایل»"
  -
    id: "T01240"
    text: "شناسه‌ها در «فهرست‌بندی و طبقه‌بندی الگوهای حمله رایج (CAPEC™)»، v3.9، Mitre Corporation، نوامبر 2015"
  -
    id: "T01250"
    text: "داستان‌های متمرکز بر امنیت در «داستان‌ها و وظایف امنیتی عملی برای محیط‌های توسعه چابک»، SAFECode، ژوئیه 2012"
  -
    id: "T01260"
    text: "ارجاع یعنی حمله در مورد ارجاع‌شده گنجانده شده است، اما لزوماً تمام قصد آن را در بر نمی‌گیرد. "
  -
    id: "T01270"
    text: "برای داده‌های ساخت‌یافته مانند CAPEC، دقیق‌ترین ارجاع ارائه شده است، اما گاهی ارجاعی نیز آمده که مثال‌های دقیق‌تر (فرزند) هم دارد."
  -
    id: "T01280"
    text: "روی شش آس و دو جوکر ارجاعی وجود ندارد. "
  -
    id: "T01290"
    text: "در عوض، این کارت‌ها چند نکته کلی را با متن مورب ارائه می‌دهند."
  -
    id: "T01300"
    text: "می‌توان Cornucopia را به روش‌های گوناگون بازی کرد. "
  -
    id: "T01301"
    text: "برای نحوه بازی، به صفحه‌های 11 تا 19 ادامه دهید."
  -
    id: "T01400"
    text: "آماده‌سازی"
  -
    id: "T01410"
    text: "یک دسته کارت تهیه کنید یا دسته کارت‌های Cornucopia خودتان را چاپ کنید (صفحه 2 این سند را ببینید) و کارت‌ها را جدا/برش دهید"
  -
    id: "T01411"
    text: "از کارت‌های این بسته استفاده کنید"
  -
    id: "T01420"
    text: "یک برنامه یا فرایند برنامه را برای بازبینی انتخاب کنید؛ این می‌تواند یک مفهوم، طراحی یا پیاده‌سازی واقعی باشد"
  -
    id: "T01430"
    text: "یک نمودار جریان داده، داستان‌های کاربری یا مصنوعات دیگر برای کمک به بازبینی ایجاد کنید"
  -
    id: "T01440"
    text: "گروهی از 3 تا 6 معمار، توسعه‌دهنده، آزمونگر و سایر ذی‌نفعان کسب‌وکار را شناسایی و دعوت کنید و دور یک میز بنشینید (سعی کنید کسی را که با امنیت برنامه تا حدی آشناست بگنجانید)"
  -
    id: "T01450"
    text: "چند جایزه در دسترس داشته باشید (ستاره طلایی، شکلات، پیتزا، نوشیدنی یا گل، بسته به فرهنگ محل کارتان)"
  -
    id: "T01500"
    text: "بازی"
  -
    id: "T01510"
    text: "یک دسته - Cornucopia - نقش دسته برتر (trump) را دارد."
  -
    id: "T01520"
    text: "آس‌ها بالاترند (یعنی از شاه‌ها بالاتر هستند)."
  -
    id: "T01530"
    text: "اگر یک غیربازیکن مشکلات و امتیازها را ثبت کند، کمک‌کننده است."
  -
    id: "T01540"
    text: "جوکرها و چند کارت کم‌امتیاز (2، 3، 4) را از دسته Cornucopia بردارید تا هر بازیکن تعداد کارت برابر داشته باشد"
  -
    id: "T01550"
    text: "کارت‌ها را بُر بزنید و همه را پخش کنید"
  -
    id: "T01560"
    text: "برای شروع، یک بازیکن را تصادفی انتخاب کنید که کارت اول را بازی کند - او می‌تواند هر کارتی از دست خود را بازی کند، جز کارتی از دسته برتر - Cornucopia"
  -
    id: "T01570"
    text: "برای بازی کردن یک کارت، هر بازیکن باید آن را با صدای بلند بخواند و توضیح دهد (برای نکته‌ها به Wiki Deck آنلاین مراجعه کنید) که تهدید چگونه می‌تواند اعمال شود (بازیکن برای حمله‌هایی که ممکن است کارساز باشند و گروه آن‌ها را اشکالی قابل‌اقدام می‌داند یک امتیاز می‌گیرد) - در این مرحله سعی نکنید راه‌های کاهش خطر را فکر کنید و تهدیدی را فقط به این دلیل که گمان می‌کنید قبلاً کاهش یافته کنار نگذارید - کسی کارت را یادداشت کند و مشکلات مطرح‌شده را ثبت کند"
  -
    id: "T01580"
    text: "در جهت عقربه‌های ساعت بازی کنید؛ هر نفر باید کارتی را به همین شیوه بازی کند؛ اگر کارتی از دسته آغازگر دارید باید یکی از آن‌ها را بازی کنید، در غیر این صورت می‌توانید کارتی از هر دسته دیگر بازی کنید. "
  -
    id: "T01590"
    text: "فقط کارت بالاتر از همان دسته، یا بالاترین کارت از دسته برتر Cornucopia، دست را می‌برد."
  -
    id: "T01600"
    text: "کسی که دور را می‌برد، دور بعد را آغاز می‌کند (یعنی اول بازی می‌کند) و در نتیجه دسته آغازگر بعدی را تعیین می‌کند"
  -
    id: "T01610"
    text: "تکرار کنید تا همه کارت‌ها بازی شوند"
  -
    id: "T01700"
    text: "امتیازدهی"
  -
    id: "T01710"
    text: "هدف، شناسایی تهدیدهای کاربردپذیر و بردن دست‌ها (دورها) است:"
  -
    id: "T01720"
    text: "برای هر کارتی که بتوانید آن را تهدیدی معتبر برای برنامه مورد بررسی تشخیص دهید، 1+ امتیاز بگیرید"
  -
    id: "T01730"
    text: "اگر دوری را ببرید، 1+ امتیاز بگیرید"
  -
    id: "T01740"
    text: "وقتی همه کارت‌ها بازی شدند، هر که بیشترین امتیاز را دارد برنده است"
  -
    id: "T01800"
    text: "جمع‌بندی"
  -
    id: "T01810"
    text: "همه تهدیدهای کاربردپذیر و نیازمندی‌های امنیتی متناظر را بازبینی کنید"
  -
    id: "T01820"
    text: "بسته به روش‌شناسی توسعه خود، داستان‌های کاربری، مشخصات و موارد آزمون لازم را ایجاد کنید."
  -
    id: "T01900"
    text: "قوانین جایگزین بازی"
  -
    id: "T01910"
    text: "اگر با بازی تازه‌کار هستید، در ابتدا آس‌ها و دو کارت جوکر را بردارید."
  -
    id: "T01920"
    text: "وقتی افراد با فرایند آشناتر شدند، کارت‌های جوکر را دوباره اضافه کنید."
  -
    id: "T01930"
    text: "جدا از قوانین «بازی کارت برتر» که در بالا توضیح داده شد و بسیار شبیه EoP است، این دسته را می‌توان به‌صورت «بازی بیست‌ویک» (که «pontoon» یا «blackjack» نیز نامیده می‌شود) هم بازی کرد که معمولاً تعداد کارت‌های بازی‌شده در هر دور را کاهش می‌دهد."
  -
    id: "T01940"
    text: "روی یک برنامه خیالی، یا حتی برنامه‌ای که در آینده برنامه‌ریزی شده، تمرین کنید، نه اینکه تلاش کنید در برنامه‌های موجود ایراد پیدا کنید، تا زمانی که شرکت‌کنندگان از سودمندی بازی راضی شوند."
  -
    id: "T01950"
    text: "برای نشستی کوتاه‌تر فقط با یک دسته بازی کنید - اما سعی کنید برای هر پروژه همه دسته‌ها را پوشش دهید. "
  -
    id: "T01960"
    text: "یا حتی بهتر، فقط یک دست را با چند کارت از پیش انتخاب‌شده بازی کنید و فقط بر پایه توانایی شناسایی نیازمندی‌های امنیتی امتیاز بدهید. "
  -
    id: "T01970"
    text: "شاید اگر شرکت‌کنندگان نمی‌توانند زمان کافی برای یک دسته کامل کنار بگذارند، یک هفته یا بیشتر هر روز یک بازی با یک دسته انجام دهید."
  -
    id: "T01980"
    text: "برخی تیم‌ها ترجیح داده‌اند یک دست کامل کارت بازی کنند و سپس پس از هر دور درباره آنچه روی کارت‌هاست گفت‌وگو کنند (به‌جای گفت‌وگو پس از بازی هر نفر)."
  -
    id: "T01990"
    text: "پیشنهاد دیگر این است که اگر بازیکنی نتوانست مرتبط بودن کارت را تشخیص دهد، به بازیکنان دیگر اجازه دهید ایده بدهند و احتمالاً بگذارید آن‌ها امتیاز کارت را بگیرند. "
  -
    id: "T02000"
    text: "پیشنهاد می‌شود برای مشارکت‌های به‌ویژه خوب امتیاز اضافه در نظر بگیرید."
  -
    id: "T02010"
    text: "حتی می‌توانید تنها بازی کنید. "
  -
    id: "T02020"
    text: "فقط از کارت‌ها به‌عنوان برانگیزاننده تفکر استفاده کنید. "
  -
    id: "T02030"
    text: "هرچند مشارکت دادن افراد بیشتر سودمند خواهد بود."
  -
    id: "T02040"
    text: "در راهنمای EoP مایکروسافت، تقلب‌کردن به‌عنوان یک راهبرد خوب بازی توصیه شده است."
  -
    id: "T02600"
    text: "پرسش‌های متداول"
  -
    id: "T02610"
    text: "1. آیا می‌توانم بازی را کپی یا ویرایش کنم؟"
  -
    id: "T02620"
    text: "بله، البته."
  -
    id: "T02630"
    text: "با همه مواد OWASP هر کاری که بخواهید می‌توانید بکنید، به شرط رعایت مجوز Creative Commons Attribution-ShareAlike 4.0. "
  -
    id: "T02640"
    text: "شاید اگر نسخه جدیدی ساختید، بتوانید آن را به پروژه OWASP® Cornucopia اهدا کنید؟"
  -
    id: "T02650"
    text: "2. چگونه می‌توانم مشارکت کنم؟"
  -
    id: "T02660"
    text: "لطفاً ایده‌ها یا پیشنهادهای کمک خود را به فهرست پستی پروژه بفرستید."
  -
    id: "T02670"
    text: "3. نام مهاجمان چگونه انتخاب شده است؟"
  -
    id: "T02680"
    text: "EoP هر توصیف را با عباراتی مانند «یک مهاجم می‌تواند...» آغاز می‌کند،"
  -
    id: "T02690"
    text: "اما Colin Watson در Cornucopia از نام‌های شخصی استفاده کرد که می‌توان آن‌ها را افراد بیرونی یا درونی یا نام‌های مستعار سامانه‌های رایانه‌ای دانست."
  -
    id: "T02700"
    text: "به همین ترتیب، نام‌ها در نسخه برنامه موبایل بازتاب‌دهنده جنبه جامعه OWASP هستند."
  -
    id: "T02710"
    text: "بنابراین، جز «باب و مالوری»، نام مهاجمان از اعضای هیئت‌مدیره جهانی و اروپایی OWASP در سال 2024، کارکنان OWASP، نویسندگان و مشارکت‌کنندگان نسخه برنامه موبایل OWASP Cornucopia و رهبران شاخه‌های OWASP در سراسر جهان گرفته شده است."
  -
    id: "T02720"
    text: "ترکیب فرهنگی و جنسیتی صرفاً بازتاب همین منابع نام‌هاست، و"
  -
    id: "T02730"
    text: "قرار نیست نماینده جهان باشد."
  -
    id: "T02750"
    text: "4. چرا روی کارت‌ها تصویری وجود ندارد؟"
  -
    id: "T02760"
    text: "روی کارت‌ها متن زیادی هست و ارجاع‌های متقابل نیز جا می‌گیرند."
  -
    id: "T02770"
    text: "اما خوب است عناصر طراحی بیشتری هم گنجانده شود."
  -
    id: "T02780"
    text: "داوطلبی هست؟"
  -
    id: "T02790"
    text: "5. آیا حمله‌ها بر اساس عدد روی کارت رتبه‌بندی شده‌اند؟"
  -
    id: "T02800"
    text: "فقط تقریباً."
  -
    id: "T02810"
    text: "ریسک به برنامه و سازمان بستگی دارد، به‌دلیل تفاوت در الزامات امنیتی و انطباق، پس ممکن است رتبه‌بندی شدت شما کارت‌ها را به ترتیبی غیر از اعداد روی کارت‌ها قرار دهد."
  -
    id: "T02820"
    text: "6. بازی یک دور کارت با دسته کامل چقدر طول می‌کشد؟"
  -
    id: "T02830"
    text: "این به دامنه برنامه، میزان گفت‌وگو و آشنایی بازیکنان با مفاهیم امنیت برنامه بستگی دارد."
  -
    id: "T02840"
    text: "اما شاید برای 4 تا 6 نفر 1.5 تا 2.0 ساعت در نظر بگیرید."
  -
    id: "T02850"
    text: "7. چه نوع افرادی باید بازی کنند؟"
  -
    id: "T02860"
    text: "همیشه سعی کنید ترکیبی از نقش‌ها داشته باشید که بتوانند دیدگاه‌های جایگزین ارائه دهند."
  -
    id: "T02870"
    text: "اما کسی را بگنجانید که دانش معقولی از اصطلاحات آسیب‌پذیری برنامه دارد. "
  -
    id: "T02880"
    text: "در غیر این صورت سعی کنید ترکیبی از معماران، توسعه‌دهندگان، آزمونگران و یک مدیر پروژه یا صاحب کسب‌وکار مرتبط را بگنجانید."
  -
    id: "T02890"
    text: "8. چه کسی باید یادداشت بردارد و امتیازها را ثبت کند؟"
  -
    id: "T02900"
    text: "بهتر است شخص دیگری که بازی نمی‌کند، درباره نیازمندی‌های شناسایی‌شده و مسائل مورد بحث یادداشت بردارد."
  -
    id: "T02910"
    text: "این کار می‌تواند به‌عنوان آموزش برای یک توسعه‌دهنده تازه‌کار به‌کار رود، یا مدیر پروژه آن را انجام دهد."
  -
    id: "T02920"
    text: "برخی سازمان‌ها ضبطی تهیه کرده‌اند تا پس از آن، هنگامی که نیازمندی‌ها رسمی‌تر نوشته می‌شوند، آن را بازبینی کنند."
  -
    id: "T02930"
    text: "9. آیا همیشه باید از دسته کامل کارت‌ها استفاده کنیم؟"
  -
    id: "T02940"
    text: "خیر. "
  -
    id: "T02950"
    text: "یک دسته کوچک‌تر سریع‌تر بازی می‌شود. "
  -
    id: "T02960"
    text: "اولین بازی خود را فقط با کارت‌هایی که برای دو یا سه دور کافی است شروع کنید. "
  -
    id: "T02970"
    text: "همیشه حذف کارت‌هایی را که اصلاً با برنامه یا عملکرد مورد بررسی مناسب نیستند در نظر بگیرید. "
  -
    id: "T02980"
    text: "برای چند بار اول بازی، معمولاً بهتر است آس‌ها و دو جوکر نیز کنار گذاشته شوند."
  -
    id: "T02990"
    text: "همچنین معمول است که تا وقتی افراد با ایده آشناتر نشده‌اند، بازی بدون دسته برتر انجام شود."
  -
    id: "T03000"
    text: "10. وقتی بازیکنان کارت آسی دارند که می‌گوید «حمله جدید X ابداع کرده‌اید» چه باید بکنند؟"
  -
    id: "T03010"
    text: "بازیکن می‌تواند هر حمله‌ای را که معتبر می‌داند ابداع کند، اما باید با دسته کارت (مثلاً پلتفرم و کد) سازگار باشد."
  -
    id: "T03020"
    text: "برای بازیکنان تازه‌کار، بهتر است در ابتدا این کارت‌ها حذف شوند (پرسش متداول 9 را هم ببینید)."
  -
    id: "T03850"
    text: "کارکنان سخت‌کوش OWASP."
