    desc: "تیمور می‌تواند کد بازبینی‌نشده را در برنامه نسخه تولید جایگزین، بازتوزیع یا وارد کند، زیرا امضا، گواهی، منبع فروشگاه، یکپارچگی کد بسته‌بندی‌شده یا منشأ ساخت تکرارپذیر آن را نمی‌توان به‌درستی راستی‌آزمایی کرد"
  -
    id: "RS5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/RS5"
    desc: "ماتئو می‌تواند کنترل‌های دسترسی را دور بزند و قابلیت‌ها را فعال کند، زیرا اشکال‌زدایی در نسخه تولید فعال رها شده است"
  -
    id: "RS6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/RS6"
    desc: "یورن می‌تواند کنترل‌های دسترسی را دور بزند، زیرا کنترل‌های ضد اشکال‌زدایی (anti-debugging) با توجه به آنچه توصیه می‌شود یا تلاش تصورشده یک مهاجم بالقوه به اندازه کافی قوی نیستند"
  -
    id: "RS7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/RS7"
    desc: "ارلند می‌تواند با اجرای برنامه در یک شبیه‌ساز (emulator یا simulator)، محیط مجازی یا دستگاه نامطمئن، برنامه را به خطر بیندازد، زیرا تشخیص محیط یا تصدیق (attestation) وجود ندارد یا بسیار ضعیف است"
  -
    id: "RS8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/RS8"
    desc: "کارلوس می‌تواند با هوک‌کردن توابع حساس در زمان اجرا، داده‌های حساس را افشا کند، زیرا برنامه ابزارگذاری (instrumentation) را تشخیص نمی‌دهد یا به آن واکنش نشان نمی‌دهد"
  -
    id: "RS9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/RS9"
    desc: "شون می‌تواند برنامه را مهندسی معکوس کند، زیرا کد یا منابع حساس از نظر امنیتی (مثلاً رشته‌ها، پیکربندی و دارایی‌های همراه) به اندازه کافی مبهم‌سازی نشده‌اند"
  -
    id: "RSX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/RSX"
    desc: "خوان می‌تواند از یک دستگاه روت‌شده، جیل‌برک‌شده یا آلوده به قابلیت‌ها دسترسی پیدا کند، زیرا برنامه محیط‌های خصمانه را تشخیص نمی‌دهد یا واکنش مناسبی به آن‌ها نشان نمی‌دهد"
  -
    id: "RSJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/RSJ"
    desc: "پکا می‌تواند فایل‌ها، پیکربندی، محتوای دانلودشده یا داده‌های بازیابی‌شده مرتبط با امنیت را تغییر دهد، زیرا برنامه پیش از استفاده، یکپارچگی و اصالت آن‌ها را راستی‌آزمایی نمی‌کند"
  -
    id: "RSQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/RSQ"
    desc: "تیتوس می‌تواند با وصله‌کردن برنامه یا هوک‌کردن توابع حساس در زمان اجرا، قابلیت‌های حیاتی را تغییر دهد یا دور بزند، زیرا برنامه دستکاری را به‌طور کافی تشخیص نمی‌دهد یا به ابزارگذاری زمان اجرا واکنش نشان نمی‌دهد"
  -
    id: "RSK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/RSK"
    desc: "شریف می‌تواند بررسی‌های ضد مهندسی معکوس و حفاظت زمان اجرا را با وصله‌کردن آن‌ها یا هوک‌کردن سیگنال‌هایی که به آن‌ها متکی هستند غیرفعال یا دور بزند، و به تحلیل یا ابزارگذاری اجازه دهد بی‌آنکه تشخیص داده شود ادامه یابد"
  -
    id: "RSA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/RSA"
    desc: "شما حمله‌ای جدید علیه «تاب‌آوری» ابداع کرده‌اید"
    misc: "درباره این موضوع در برگه‌های تقلب (Cheat Sheet) رایگان OWASP درباره امنیت برنامه‌های موبایل و در بخش «دستکاری و مهندسی معکوس برنامه موبایل» از «راهنمای آزمون امنیت برنامه‌های موبایل» در وب‌سایت OWASP MAS بیشتر بخوانید"
-
  id: "CRM"
  name: "رمزنگاری"
  cards:
  -
    id: "CRM2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/CRM2"
    desc: "لسگو می‌تواند عملیات و منابع رمزنگاری را به خطر بیندازد، زیرا کلیدها برای چند منظور استفاده مجدد می‌شوند یا مطابق هدفی که برای آن ساخته شده‌اند به‌کار نمی‌روند"
  -
    id: "CRM3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/CRM3"
    desc: "اوراس می‌تواند داده‌های محافظت‌شده را به خطر بیندازد، زیرا مقادیر تصادفی مورد استفاده برای تولید کلیدهای رمزنگاری، بردارهای مقداردهی اولیه یا nonceها قابل پیش‌بینی هستند"
  -
    id: "CRM4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/CRM4"
    desc: "عادل می‌تواند کلیدهای رمزگذاری یا امضا را پیش‌بینی، استخراج یا بازیابی کند، زیرا تولید یا اشتقاق آن‌ها از آنتروپی ناکافی، پارامترهای ضعیف، یا مقادیر ورودی شناخته‌شده یا قابل شمارش استفاده می‌کند"
  -
    id: "CRM5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/CRM5"
    desc: "امری می‌تواند به داده‌ها دسترسی پیدا کند، زیرا به‌جای استفاده از یک تابع رمزنگاری تأییدشده، فقط مبهم‌سازی شده‌اند"
  -
    id: "CRM6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/CRM6"
    desc: "آنسلم می‌تواند داده‌های حساس (ذخیره‌شده یا در حال انتقال) را تغییر دهد، زیرا بررسی یکپارچگی روی آن‌ها انجام نمی‌شود"
  -
    id: "CRM7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/CRM7"
    desc: "حسن می‌تواند داده‌های حساس را استخراج یا تغییر دهد، زیرا بدون رمزگذاری کافی یا کنترل‌های حفاظت از داده پلتفرم ذخیره شده‌اند"
  -
    id: "CRM8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/CRM8"
    desc: "اَش می‌تواند رمزنگاری را بشکند، زیرا با توجه به آنچه توصیه می‌شود یا تلاش تصورشده یک مهاجم بالقوه به اندازه کافی قوی نیست"
  -
    id: "CRM9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/CRM9"
    desc: "رمزی می‌تواند به داده‌های حساس محافظت‌شده دسترسی پیدا کند، زیرا پیکربندی رمزنگاری (مثلاً الگوریتم، حالت، IV، nonce یا ارائه‌دهنده) ضعیف است یا نادرست استفاده شده است"
  -
    id: "CRMX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/CRMX"
    desc: "کوتی می‌تواند کلیدهای رمزنگاری یا داده‌های حساس را استخراج کند، زیرا به‌صورت ثابت در کد نوشته شده‌اند یا بدون رمزگذاری یا حفاظت مناسب پلتفرم در حافظه خصوصی برنامه یا حافظه اشتراکی ذخیره شده‌اند"
  -
    id: "CRMJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/CRMJ"
    desc: "فادی می‌تواند کنترل‌های رمزنگاری را دور بزند، زیرا آن‌ها به‌صورت ایمن شکست نمی‌خورند (یعنی به‌طور پیش‌فرض بدون حفاظت می‌شوند)"
  -
    id: "CRMQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/CRMQ"
    desc: "سایمون می‌تواند توابع درهم‌سازی (hash) و رمزگذاری را دور بزند، زیرا سفارشی و/یا ناکافی پیاده‌سازی شده‌اند"
  -
    id: "CRMK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/CRMK"
    desc: "طارق می‌تواند بر عملیات رمزنگاری تأثیر بگذارد یا آن‌ها را تغییر دهد و بنابراین آن‌ها را دور بزند"
  -
    id: "CRMA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/CRMA"
    desc: "شما حمله‌ای جدید علیه «رمزنگاری» ابداع کرده‌اید"
    misc: "درباره این موضوع در برگه‌های تقلب (Cheat Sheet) رایگان OWASP درباره امنیت برنامه‌های موبایل و در بخش «رمزنگاری برنامه موبایل» از «راهنمای آزمون امنیت برنامه‌های موبایل» در وب‌سایت OWASP MAS بیشتر بخوانید"
-
  id: "CM"
  name: "کورنوکوپیا"
  cards:
  -
    id: "CM2"
    value: "2"
    url: "https://cornucopia.owasp.org/cards/CM2"
    desc: "گارث می‌تواند حریم خصوصی کاربران برنامه را کاهش دهد، زیرا برنامه داده‌های حساس یا دامنه‌های ردیابی‌ای را که به آن‌ها دسترسی دارد، جمع‌آوری می‌کند، استفاده می‌کند یا به اشتراک می‌گذارد به‌روشنی افشا نمی‌کند"
  -
    id: "CM3"
    value: "3"
    url: "https://cornucopia.owasp.org/cards/CM3"
    desc: "السا می‌تواند حریم خصوصی کاربران برنامه را کاهش دهد، زیرا برنامه به کاربر اجازه نمی‌دهد داده‌های خود را به‌راحتی مدیریت، حذف و اصلاح کند، تنظیمات حریم خصوصی را تغییر دهد و هنگامی که داده بیشتری لازم است دوباره رضایت بگیرد"
  -
    id: "CM4"
    value: "4"
    url: "https://cornucopia.owasp.org/cards/CM4"
    desc: "الیزابت می‌تواند حریم خصوصی کاربران برنامه را کاهش دهد، زیرا برنامه داده‌های شخصی‌ای را که با سرویس‌های پایین‌دستی به اشتراک می‌گذارد به‌روشنی افشا نمی‌کند یا برای آن رضایت کاربر را دریافت نمی‌کند."
  -
    id: "CM5"
    value: "5"
    url: "https://cornucopia.owasp.org/cards/CM5"
    desc: "دبارگایا می‌تواند حریم خصوصی کاربران برنامه را کاهش دهد، زیرا برنامه داده‌های شخصی جمع‌آوری‌شده برای امنیت یا پیشگیری از تقلب را بدون رضایت آگاهانه برای مقاصد تجاری به‌کار می‌گیرد"
  -
    id: "CM6"
    value: "6"
    url: "https://cornucopia.owasp.org/cards/CM6"
    desc: "کیم می‌تواند حریم خصوصی کاربران برنامه را کاهش دهد، زیرا برنامه اطلاعات بیومتریک (مثلاً اثر انگشت، داده‌های تشخیص چهره و غیره) جمع‌آوری‌شده برای مقاصد امنیتی را برای تأمین منافع تجاری به‌کار می‌گیرد"
  -
    id: "CM7"
    value: "7"
    url: "https://cornucopia.owasp.org/cards/CM7"
    desc: "کارلوس می‌تواند از سرویس‌های اعلان برنامه برای اجرای کمپین‌های فیشینگ استفاده کند، زیرا محتوای اعلان یا مقصد اقدام‌ها به‌درستی پاک‌سازی یا اعتبارسنجی نمی‌شود"
  -
    id: "CM8"
    value: "8"
    url: "https://cornucopia.owasp.org/cards/CM8"
    desc: "گاستون می‌تواند با سوءاستفاده از ارتباط ناامن بین برنامه‌ها یا اقدام‌های واگذارشده، اقدام‌های مخرب را فعال کند"
  -
    id: "CM9"
    value: "9"
    url: "https://cornucopia.owasp.org/cards/CM9"
    desc: "لوئیس می‌تواند برنامه را وادار کند بر اساس داده‌های محافظت‌شده جعلی عمل کند، زیرا برنامه راستی‌آزمایی نمی‌کند که داده‌های دریافتی از سرویس‌های خارجی اصیل و بدون تغییر هستند"
  -
    id: "CMX"
    value: "10"
    url: "https://cornucopia.owasp.org/cards/CMX"
    desc: "روکسانا می‌تواند فایل‌ها را به‌طور دلخواه بازنویسی کند و احتمالاً از طریق پیمایش مسیر (path traversal) کد مخرب اجرا کند، زیرا مسیر و دایرکتوری مقصد به‌درستی اعتبارسنجی نمی‌شود"
  -
    id: "CMJ"
    value: "J"
    url: "https://cornucopia.owasp.org/cards/CMJ"
    desc: "الساندرو می‌تواند با سوءاستفاده از سرریز بافر و نشت حافظه، کد بیگانه را در فضای آدرس کد موبایل بنویسد و از برنامه سوءاستفاده کند"
  -
    id: "CMQ"
    value: "Q"
    url: "https://cornucopia.owasp.org/cards/CMQ"
    desc: "ویکتور می‌تواند برنامه را وصله کند و از آن برای توزیع کد مخرب استفاده کند، زیرا بررسی‌های یکپارچگی زمان اجرا با توجه به آنچه توصیه می‌شود یا تلاش تصورشده یک مهاجم بالقوه به اندازه کافی قوی نیستند"
  -
    id: "CMK"
    value: "K"
    url: "https://cornucopia.owasp.org/cards/CMK"
    desc: "روبن می‌تواند از برنامه برای گسترش کد مخرب استفاده کند، زیرا برنامه محتوای نامطمئن را بدون راستی‌آزمایی منبع، نوع یا ایمنی آن می‌پذیرد، بارگذاری می‌کند یا ارسال می‌کند"
  -
    id: "CMA"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/CMA"
    desc: "شما حمله‌ای جدید از هر نوع ابداع کرده‌اید"
    misc: "درباره این موضوع در برگه‌های تقلب (Cheat Sheet) رایگان OWASP درباره امنیت برنامه‌های موبایل و در بخش «حفاظت از حریم خصوصی کاربر برنامه موبایل» از «راهنمای آزمون امنیت برنامه‌های موبایل» در وب‌سایت OWASP MAS بیشتر بخوانید"
-
  id: "WC"
  name: "کارت جوکر"
  cards:
  -
    id: "JOAM"
    value: "A"
    url: "https://cornucopia.owasp.org/cards/JOAM"
    card: "Joker"
    desc: "استار می‌تواند بر برنامه تأثیر بگذارد، آن را تغییر دهد یا بر آن اثر بگذارد، به‌طوری‌که دیگر با الزامات قانونی، مقرراتی، قراردادی یا سایر الزام‌ها سازگار نباشد"
    misc: "آیا به عضویت فردی در OWASP فکر کرده‌اید؟ همه ابزارها، راهنماها و نشست‌های محلی برای همه رایگان است، اما عضویت فردی از کار OWASP حمایت می‌کند"
  -
    id: "JOBM"
    value: "B"
    url: "https://cornucopia.owasp.org/cards/JOBM"
    card: "Joker"
    desc: "مالوری می‌تواند از برنامه نصب‌شده روی دستگاه باب به‌طور مخرب برای نظارت، جاسوسی، استراق سمع، کنترل از راه دور، ردیابی یا پایش باب بدون رضایت و/یا اطلاع‌رسانی استفاده کند"
    misc: "آسیب‌پذیری‌ها را بررسی کنید و با استفاده از برنامه‌های مرجع رایگان MASTG در وب‌سایت OWASP MAS کشف کنید چگونه می‌توان آن‌ها را برطرف کرد"
